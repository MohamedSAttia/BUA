<style>

.toast{position:fixed;bottom:64px;left:50%;transform:translateX(-50%);background:var(--ok);color:#06281A;padding:14px 24px;border-radius:14px;z-index:50;font-weight:700;box-shadow:var(--sh);animation:up .2s}

.lgn .intro:after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(127,211,107,.35),transparent 70%);inset-inline-end:-80px;bottom:-90px}

 .tabbar{display:flex;position:fixed;bottom:0;inset-inline:0;background:var(--bg2);border-top:1px solid var(--line);z-index:20;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
 .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;color:var(--mu);font-size:.72em;font-weight:700;text-decoration:none;position:relative}
 .tabbar a .ico{width:26px;height:26px}.tabbar a.on{color:var(--pri)}

<body>
<div id="root"></div>
<script>// Shared core for the simplified system — used by the server (api/s.js) and by the in-browser demo store.
const MODS = [
  { k: 'req', n: 'الطلبات وخط السير', ap: true },
  { k: 'task', n: 'المتابعة والمهام' },
  { k: 'kpi', n: 'مؤشرات الأداء' },
  { k: 'rep', n: 'التقارير', viewOnly: true }
];
const PRESETS = {
  full: { n: 'صلاحيات كاملة', p: () => Object.fromEntries(MODS.map(m => [m.k, { v: 1, a: m.viewOnly ? 0 : 1, e: m.viewOnly ? 0 : 1, d: m.viewOnly ? 0 : 1, ap: m.ap ? 1 : 0 }])) },
  lead: { n: 'قيادي (عميد / رئيس قسم)', p: () => Object.fromEntries(MODS.map(m => [m.k, { v: 1, a: m.viewOnly ? 0 : 1, e: m.viewOnly ? 0 : 1, d: 0, ap: m.ap ? 1 : 0 }])) },
  staff: { n: 'موظف / عضو', p: () => ({ req: { v: 1, a: 1, e: 0, d: 0, ap: 0 }, task: { v: 1, a: 0, e: 0, d: 0 }, kpi: { v: 1, a: 0, e: 0, d: 0 }, rep: { v: 0 } }) },
  view: { n: 'اطلاع فقط', p: () => Object.fromEntries(MODS.map(m => [m.k, { v: m.k === 'rep' ? 0 : 1, a: 0, e: 0, d: 0, ap: 0 }])) }
};
const COL = { req: 's_req', task: 's_task', kpi: 's_kpi' };
const FLOW = ['تقديم الطلب', 'عند رئيس القسم', 'عند العميد', 'معتمد'];
const PENDING = ['عند رئيس القسم', 'عند العميد'];
const ADMIN_ID = 'khaled';
const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clean = (s, n = 400) => String(s ?? '').slice(0, n);
const can = (u, mod, p) => !!(u && u.active !== false && (u.admin || u.perms?.[mod]?.[p]));
const pub = u => u && ({ id: u.id, name: u.name, title: u.title || '', email: u.email || '', admin: !!u.admin, active: u.active !== false, perms: u.perms || {}, preset: u.preset || '' });

const FIELDS = {
  req: ['title', 'type', 'applicant', 'details', 'status', 'due', 'priority', 'note'],
  task: ['title', 'owner', 'due', 'status', 'priority', 'details', 'progress'],
  kpi: ['name', 'target', 'actual', 'unit', 'period', 'better', 'owner']
};

async function notify(store, to, text, mod, ref) {
  try { for (const t of [...new Set(to)].filter(Boolean)) {
    const id = rid(); await store.writeDoc('s_notif', id, { id, to: t, text: clean(text, 200), mod, ref, at: Date.now(), read: false });
  } } catch (e) { console.error('notify failed', e); }
}
async function log(store, by, act, mod, ref, title) { try { const id = rid(); await store.writeDoc('s_log', id, { id, by, act, mod, ref, title: clean(title, 120), at: Date.now() }); } catch (e) { console.error('log write failed', e); } }

async function ensureAdmin(store, hp, adminPw) {
  const u = await store.readOne('s_users', ADMIN_ID);
  if (u) return u;
  if (!adminPw) return null;
  const doc = { id: ADMIN_ID, name: 'د. خالد البلوي', title: 'مدير النظام', email: '', admin: true, active: true, perms: PRESETS.full.p(), preset: 'full', at: Date.now() };
  await store.writeDoc('s_users', ADMIN_ID, doc);
  await store.writeDoc('_s_auth', ADMIN_ID, { id: ADMIN_ID, ...(await hp.hash(adminPw)) });
  return doc;
}

async function handle(store, hp, sessId, act, b) {
  b = b || {};
  if (act === 'login') {
    const id = clean(b.user, 60).trim().toLowerCase().replace(/^@/, '');
    let u = await store.readOne('s_users', id);
    if (!u) { const all = await store.readCol('s_users'); u = all.find(x => (x.email || '').toLowerCase() === id) || null; }
    if (!u && id === ADMIN_ID) { try { u = await ensureAdmin(store, hp, hp.adminPw); } catch (e) { console.error('ensureAdmin failed', e); if (String(b.pass || '').trim() === hp.adminPw) u = { id: ADMIN_ID, name: 'د. خالد البلوي', admin: true, active: true, perms: PRESETS.full.p() }; } }
    if (!u || u.active === false) return { status: 401, body: { error: 'bad' } };

    let rec = await store.readOne('_s_auth', u.id);

      if (!rec || rec.envTag !== tag) {

  if (act === 'logout') return { status: 200, body: { ok: true }, session: null };

  if (!me || me.active === false) return { status: 401, body: { error: 'auth' } };

  if (act === 'boot') {

    try {

    for (const r of await store.readCol('s_req')) if (MAP[r.status]) {
      const st = MAP[r.status]; const hist = [{ s: 'تقديم الطلب', by: r.by, at: r.at || Date.now() }, { s: 'عند رئيس القسم', by: r.by, at: (r.at || Date.now()) + 3e5 }];
      if (st === 'عند العميد') hist.push({ s: 'عند العميد', by: r.by, at: (r.at || Date.now()) + 864e5 });

    }
    const meta = await store.readOne('s_meta', 'demo');
    if (!meta && me.admin) {
      const [rq, tk] = [await store.readCol('s_req'), await store.readCol('s_task')];
      if (!rq.length && !tk.length) await seed(store, me.id);
      await store.writeDoc('s_meta', 'demo', { id: 'demo', at: Date.now() });
    }
    } catch (e) { console.error('boot upgrade failed', e); }
    const out = { me: pub(me), mods: MODS, presets: Object.fromEntries(Object.entries(PRESETS).map(([k, v]) => [k, v.n])) };
    for (const [m, c] of Object.entries(COL)) if (can(me, m, 'v') || (m === 'task')) {
      let docs = await store.readCol(c);
      if (!can(me, m, 'v')) docs = docs.filter(d => d.owner === me.id); // tasks assigned to me are always visible
      out[m] = docs;
    }
    const users = await store.readCol('s_users');
    out.people = users.filter(u => u.active !== false).map(u => ({ id: u.id, name: u.name, title: u.title || '' }));
    if (me.admin) out.users = users.map(pub);
    out.notif = (await store.readCol('s_notif')).filter(n => n.to === me.id).sort((a, b) => b.at - a.at).slice(0, 60);
    if (me.admin || can(me, 'rep', 'v')) out.log = (await store.readCol('s_log')).sort((a, b) => b.at - a.at).slice(0, 40);
    return { status: 200, body: out };
  }
  if (act === 'save') {
    const m = b.mod, c = COL[m]; if (!c) return { status: 400, body: { error: 'mod' } };
    const d = b.doc || {}; const old = d.id ? await store.readOne(c, d.id) : null;
    const isOwnTask = m === 'task' && old && old.owner === me.id;
    const isOwnReturned = m === 'req' && old && old.by === me.id && old.status === 'معاد للاستكمال';
    if (old ? !(can(me, m, 'e') || isOwnTask || isOwnReturned || (m === 'req' && can(me, m, 'ap'))) : !can(me, m, 'a')) return { status: 403, body: { error: 'forbidden' } };
    const doc = { ...(old || {}), id: old?.id || rid() };

    if (m === 'req' && old && d.status && d.status !== old.status && !can(me, 'req', 'ap') && !(isOwnReturned && d.status === 'عند رئيس القسم')) return { status: 403, body: { error: 'forbidden' } };
    if (m === 'req' && isOwnReturned && !can(me, 'req', 'e') && !can(me, 'req', 'ap')) doc.status = 'عند رئيس القسم';
    if (isOwnTask && !can(me, m, 'e')) { for (const f of FIELDS.task) if (!['status', 'progress'].includes(f)) doc[f] = old[f]; }
    if (!old) { doc.by = me.id; doc.at = Date.now(); if (m === 'req') doc.status = 'عند رئيس القسم'; if (m === 'task' && !doc.status) doc.status = 'لم تبدأ'; }
    doc.upd = Date.now(); doc.updBy = me.id;
    if (m === 'req' && old && doc.status !== old.status) { doc.hist = [...(old.hist || []), { s: doc.status, by: me.id, at: Date.now(), note: clean(d.note, 300) }]; }
    if (m === 'req' && !old) doc.hist = [{ s: 'تقديم الطلب', by: me.id, at: Date.now() }, { s: doc.status, by: me.id, at: Date.now() }];
    await store.writeDoc(c, doc.id, doc);

    // notifications
    const users = (await store.readCol('s_users')).filter(u => u.active !== false && u.id !== me.id);
    if (m === 'task' && doc.owner && (!old || old.owner !== doc.owner) && doc.owner !== me.id) await notify(store, [doc.owner], 'أُسندت إليك مهمة: ' + doc.title, 'task', doc.id);
    if (m === 'task' && old && old.status !== doc.status && doc.by && doc.by !== me.id) await notify(store, [doc.by], `تحديث مهمة «${doc.title}»: ${doc.status}`, 'task', doc.id);

async function seed(store, by) {
  const day = 864e5, now = Date.now(), d = n => new Date(now + n * day).toISOString().slice(0, 10);
  const W = async (c, o) => { const id = rid(); await store.writeDoc(c, id, { id, by, at: now - Math.random() * 6 * day, upd: now, ...o }); };
  const R = [['اعتماد خطة الفصل الدراسي الثاني', 'أكاديمي', 'عند العميد', 2, 'عالية'], ['طلب تكليف أستاذ متعاون', 'موارد بشرية', 'عند رئيس القسم', 5, 'متوسطة'], ['اعتماد نتائج الاختبارات النهائية', 'أكاديمي', 'معتمد', -3, 'عالية'],
    ['شراء أجهزة لمعمل اللغات', 'مالي', 'عند العميد', -1, 'متوسطة'], ['طلب إجازة علمية', 'موارد بشرية', 'عند رئيس القسم', 7, 'منخفضة'], ['تعديل جدول المحاضرات', 'أكاديمي', 'مرفوض', -6, 'منخفضة'], ['مشاركة في مؤتمر دولي', 'بحثي', 'معتمد', -10, 'متوسطة'], ['طلب دعم نشر بحث', 'بحثي', 'معاد للاستكمال', 3, 'متوسطة']];
  for (const [title, type, status, due, priority] of R) { const i = FLOW.indexOf(status), t0 = now - (4 + Math.random() * 4) * day;
    const hist = [{ s: 'تقديم الطلب', by, at: t0 }, { s: 'عند رئيس القسم', by, at: t0 + 3e5 }];
    if (i >= 2 || status === 'مرفوض') hist.push({ s: 'عند العميد', by, at: t0 + 1.2 * day, note: 'تمت المراجعة وإحالته للعميد' });
    if (i >= 3) hist.push({ s: 'معتمد', by, at: t0 + 2.5 * day });
    if (status === 'مرفوض') hist.push({ s: 'مرفوض', by, at: t0 + 2.4 * day, note: 'يتعارض مع الجدول المعتمد' });
    if (status === 'معاد للاستكمال') hist.push({ s: 'معاد للاستكمال', by, at: t0 + day, note: 'يرجى إرفاق خطاب القبول' });
    await W('s_req', { title, type, applicant: ['د. أحمد', 'د. سارة', 'أ. محمد', 'د. نورة'][Math.floor(Math.random() * 4)], status, due: d(due), priority, details: '', hist, at: t0 }); }
  const T = [['إعداد تقرير الأداء الفصلي', 'جارية', 4, 60, 'عالية'], ['تحديث توصيف المقررات', 'جارية', -2, 40, 'عالية'], ['متابعة استبانات رضا الطلاب', 'مكتملة', -5, 100, 'متوسطة'], ['تجهيز ملفات الاعتماد', 'لم تبدأ', 10, 0, 'عالية'],
    ['جدولة اجتماع مجلس القسم', 'مكتملة', -1, 100, 'منخفضة'], ['حصر احتياجات التدريب', 'جارية', 6, 30, 'متوسطة'], ['مراجعة توزيع الأعباء التدريسية', 'لم تبدأ', -1, 0, 'عالية']];
  for (const [title, status, due, progress, priority] of T) await W('s_task', { title, status, due: d(due), progress: String(progress), priority, owner: by });
  const K = [['نسبة إنجاز المعاملات في وقتها', 90, 78, '%', 'high'], ['متوسط زمن إنجاز الطلب', 5, 7, 'يوم', 'low'], ['رضا الطلاب عن المقررات', 85, 88, '%', 'high'], ['نسبة المهام المكتملة', 80, 64, '%', 'high'], ['نسبة حضور الاجتماعات', 90, 93, '%', 'high'], ['الأبحاث المنشورة هذا العام', 12, 9, 'بحث', 'high']];
  for (const [name, target, actual, unit, better] of K) await W('s_kpi', { name, target: String(target), actual: String(actual), unit, better, period: 'الفصل الأول 1448' });
}

function steps(r){const st=r.status;const idx=FLOW.indexOf(st);const rej=st==='مرفوض',ret=st==='معاد للاستكمال';

 <div class="card"><h3>فرص التحسين المقترحة</h3><ul style="margin:0;padding-inline-start:22px;line-height:2.1">${improve().map(x=>`<li>${x}</li>`).join('')}</ul></div></div>
 ${D.log?`<div class="card noprint" style="margin-top:20px"><h3>آخر النشاطات</h3>${D.log.slice(0,10).map(l=>`<div class="row" style="padding:10px 0;border-bottom:1px solid var(--line)">${av(l.by,pname(l.by))}<div style="flex:1"><b>${esc(pname(l.by))}</b> — ${({add:'أضاف',edit:'حدّث',del:'حذف',login:'دخل النظام'})[l.act]||l.act} ${esc(l.act==='login'?'':l.title||'')}</div><span class="small muted">${ago(l.at)}</span></div>`).join('')}</div>`:''}`};
function improve(){const out=[],T=D.task||[],K=D.kpi||[];const late=T.filter(isLate);if(late.length)out.push(`معالجة <b>${late.length}</b> مهمة متأخرة بإعادة جدولتها أو توزيعها.`);
 const old=pending().filter(r=>Date.now()-(r.at||0)>3*864e5);if(old.length)out.push(`<b>${old.length}</b> طلب ينتظر أكثر من 3 أيام — يُقترح تحديد مدة قصوى للرد.`);
 K.filter(kBad).forEach(k=>out.push(`رفع مؤشر «${esc(k.name)}» من ${esc(k.actual)} إلى ${esc(k.target)} بخطة ومسؤول.`));
 const cnt={};T.filter(t=>t.status!=='مكتملة').forEach(t=>cnt[t.owner]=(cnt[t.owner]||0)+1);const mx=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];if(mx&&mx[1]>=3)out.push(`المهام المفتوحة متركزة لدى ${esc(pname(mx[0]))} (${mx[1]}) — يُنصح بتوزيعها.`);
 return out.length?out:['الأداء ضمن المستهدف — لا ملاحظات حالياً.']}
V.users=()=>{const U=D.users||[];return`<h1 class="pg">المستخدمون والصلاحيات</h1><p class="sub">حدّد لكل شخص ما يراه وما يستطيع فعله — يُطبّق فوراً ويصله تنبيه</p>
 <div class="tools"><div style="flex:1"></div><button class="btn pri" data-act="userNew">${ic('plus')}مستخدم جديد</button></div>
 <div class="card tbl"><table><tr><th>المستخدم</th><th>اسم الدخول</th><th>الصفة</th><th>الصلاحيات</th><th>الحالة</th></tr>${U.map(u=>`<tr class="click" data-user="${u.id}"><td><span class="row">${av(u.id,u.name)}<b>${esc(u.name)}</b></span></td><td dir="ltr" style="text-align:end">${esc(u.id)}</td><td>${esc(u.title||'—')}</td><td>${u.admin?'<span class="pill p-blue">مدير النظام</span>':`<span class="small">${D.mods.filter(m=>u.perms?.[m.k]?.v).map(m=>m.n.split(' ')[0]).join('، ')||'—'}${D.mods.some(m=>u.perms?.[m.k]?.ap)?' · <b>اعتماد</b>':''}</span>`}</td><td>${u.active?'<span class="pill p-ok">مفعّل</span>':'<span class="pill p-gray">موقوف</span>'}</td></tr>`).join('')}</table></div>
 <div class="card" style="margin-top:20px"><h3>بيانات العرض</h3><p class="muted small" style="margin-top:0">لعرض الفكرة على الإدارة حمّل بيانات تجريبية، ثم امسحها قبل التشغيل الفعلي.</p><div class="row"><button class="btn" data-act="seed">تحميل بيانات تجريبية</button><button class="btn bad" data-act="wipe">مسح بيانات العرض</button></div></div>`};

function modal(t,body,foot,wide){closeM();const o=document.createElement('div');o.className='ov';o.id='ov';o.innerHTML=`<div class="md ${wide?'wide':''}"><div class="hd"><h3>${t}</h3><button class="btn ghost sm" data-act="close">${ic('x')}</button></div><div class="bd">${body}</div>${foot?`<div class="ft">${foot}</div>`:''}</div>`;o.addEventListener('mousedown',e=>{if(e.target===o)closeM()});document.body.appendChild(o)}
function closeM(){$('#ov')?.remove()}
const opt=(a,v)=>a.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('');
const ppl=v=>D.people.map(p=>`<option value="${p.id}" ${p.id===v?'selected':''}>${esc(p.name)}</option>`).join('');
const FORMS={
 req:d=>`<div class="fg"><div class="f full"><label>عنوان الطلب</label><input class="in" name="title" value="${esc(d.title)}"></div><div class="f"><label>النوع</label><select class="in" name="type">${opt(['أكاديمي','موارد بشرية','مالي','بحثي','طلابي','أخرى'],d.type)}</select></div><div class="f"><label>مقدم الطلب</label><input class="in" name="applicant" value="${esc(d.applicant||(d.id?'':me().name))}"></div><div class="f"><label>الأولوية</label><select class="in" name="priority">${opt(['منخفضة','متوسطة','عالية'],d.priority||'متوسطة')}</select></div><div class="f"><label>مطلوب قبل</label><input class="in" type="date" name="due" value="${esc(d.due)}"></div><div class="f full"><label>التفاصيل</label><textarea class="in" name="details">${esc(d.details)}</textarea></div></div>`,
 task:d=>{const own=d.id&&d.owner===me().id&&!CAN('task','e');return`<div class="fg"><div class="f full"><label>المهمة</label><input class="in" name="title" value="${esc(d.title)}" ${own?'disabled':''}></div><div class="f"><label>المسؤول</label><select class="in" name="owner" ${own?'disabled':''}>${ppl(d.owner||me().id)}</select></div><div class="f"><label>الموعد</label><input class="in" type="date" name="due" value="${esc(d.due)}" ${own?'disabled':''}></div><div class="f"><label>الحالة</label><select class="in" name="status">${opt(['لم تبدأ','جارية','مكتملة'],d.status||'لم تبدأ')}</select></div><div class="f"><label>نسبة الإنجاز: <b id="pv">${+d.progress||0}%</b></label><input type="range" min="0" max="100" step="10" name="progress" value="${+d.progress||0}" style="width:100%;height:40px" oninput="document.getElementById('pv').textContent=this.value+'%'"></div><div class="f full"><label>ملاحظات</label><textarea class="in" name="details" ${own?'disabled':''}>${esc(d.details)}</textarea></div></div>`},
 kpi:d=>`<div class="fg"><div class="f full"><label>اسم المؤشر</label><input class="in" name="name" value="${esc(d.name)}"></div><div class="f"><label>المستهدف</label><input class="in" name="target" value="${esc(d.target)}"></div><div class="f"><label>القيمة الفعلية</label><input class="in" name="actual" value="${esc(d.actual)}"></div><div class="f"><label>الوحدة</label><input class="in" name="unit" value="${esc(d.unit||'%')}"></div><div class="f"><label>الاتجاه</label><select class="in" name="better"><option value="high" ${d.better!=='low'?'selected':''}>الأعلى أفضل</option><option value="low" ${d.better==='low'?'selected':''}>الأقل أفضل</option></select></div><div class="f full"><label>الفترة</label><input class="in" name="period" value="${esc(d.period)}"></div></div>`};
const MN={req:'طلب',task:'مهمة',kpi:'مؤشر'};
function formModal(m,d){const id=d.id;const ro=m==='task'&&id&&!CAN('task','e')&&d.owner!==me().id;if(ro)return modal(esc(d.title),`<p>المسؤول: <b>${esc(pname(d.owner))}</b> · الموعد ${fmtD(d.due)} · ${esc(d.status)} · ${+d.progress||0}%</p>${d.details?`<p>${esc(d.details)}</p>`:''}`);
 modal((id?'تعديل ':'إضافة ')+MN[m],`<form id="df">${FORMS[m](d)}</form>`,`<button class="btn pri lg" data-save="${m}:${id||''}">حفظ</button><button class="btn" data-act="close">إلغاء</button>${id&&CAN(m,'d')?`<button class="btn bad" data-del="${m}:${id}" style="margin-inline-start:auto">حذف</button>`:''}`)}
function openReq(id){const r=D.req.find(x=>x.id===id);if(!r)return;const cls=s=>s==='معتمد'?'ok':s==='مرفوض'?'bad':s==='معاد للاستكمال'?'warn':'';
 const canResub=r.by===me().id&&r.status==='معاد للاستكمال';
 modal(esc(r.title),`<div class="row" style="margin-bottom:6px"><span class="pill ${SP[r.status]}">${esc(r.status)}</span><span class="muted small">${esc(r.type||'')} · ${esc(r.applicant||pname(r.by))} · أولوية ${esc(r.priority||'—')} · مطلوب قبل ${fmtD(r.due)}</span></div>${steps(r)}
 ${r.details?`<p>${esc(r.details)}</p>`:''}${CAN('req','ap')&&PENDING.includes(r.status)?`<div class="f" style="margin-top:14px"><label>ملاحظة مع القرار (اختياري)</label><input class="in" id="stNote" placeholder="تصل لصاحب الطلب"></div>`:''}
 <h4 style="margin:18px 0 12px">خط السير بالتفصيل</h4><div class="tl">${(r.hist||[]).map(h=>`<div class="ev ${cls(h.s)}"><i></i><b>${esc(h.s)}</b><span class="small muted">${esc(pname(h.by))} · ${fmtT(h.at)}</span>${h.note?`<div class="small" style="color:var(--tx2)">«${esc(h.note)}»</div>`:''}</div>`).join('')}</div>`,
 `${decisionBtns(r,false)}${canResub?`<button class="btn pri" data-resub="${r.id}">${ic('flow')}إعادة الإرسال لرئيس القسم</button>`:''}${CAN('req','e')||canResub?`<button class="btn" data-edit="${r.id}">تعديل</button>`:''}${CAN('req','d')?`<button class="btn bad" data-del="req:${r.id}" style="margin-inline-start:auto">حذف</button>`:''}`,true)}
const PL={v:'عرض',a:'إضافة',e:'تعديل',d:'حذف',ap:'اعتماد'};
function userModal(id){const u=id?D.users.find(x=>x.id===id):{perms:PRESETS.staff.p(),active:true,preset:'staff'};const Pm=JSON.parse(JSON.stringify(u.perms||{}));
 const mx=()=>`<table class="mx"><tr><th>القسم</th>${Object.values(PL).map(p=>`<th>${p}</th>`).join('')}</tr>${D.mods.map(m=>`<tr><td>${m.n}</td>${Object.keys(PL).map(p=>(m.viewOnly&&p!=='v')||(p==='ap'&&!m.ap)?'<td class="muted">—</td>':`<td><input type="checkbox" data-pm="${m.k}.${p}" ${Pm[m.k]?.[p]?'checked':''} ${u.admin?'disabled checked':''}></td>`).join('')}</tr>`).join('')}</table>`;
 modal(id?'تعديل المستخدم والصلاحيات':'مستخدم جديد',`<div class="fg"><div class="f"><label>الاسم</label><input class="in" id="uN" value="${esc(u.name)}"></div><div class="f"><label>اسم الدخول (بالإنجليزي)</label><input class="in" id="uI" dir="ltr" value="${esc(u.id)}" ${id?'disabled':''} placeholder="dean"></div>
 <div class="f"><label>الصفة</label><input class="in" id="uT" value="${esc(u.title)}" placeholder="عميد الكلية، رئيس القسم…"></div><div class="f"><label>البريد (اختياري)</label><input class="in" id="uE" dir="ltr" value="${esc(u.email)}"></div>
 <div class="f full"><label>${id?'كلمة مرور جديدة (اتركها فارغة إن لم ترد تغييرها)':'كلمة المرور'}</label><div class="row" style="flex-wrap:nowrap"><input class="in" id="uP" dir="ltr" autocomplete="new-password"><button class="btn" type="button" data-act="genPw">توليد</button></div><div class="small muted" style="margin-top:4px">10 أحرف على الأقل، ويغيّرها المستخدم عند أول دخول.</div></div></div>
 ${id==='khaled'?'':`<div class="row" style="margin:16px 0"><label class="sw"><input type="checkbox" id="uA" ${u.active?'checked':''}> الحساب مفعّل</label><label class="sw"><input type="checkbox" id="uAd" ${u.admin?'checked':''}> مدير نظام</label></div>`}
 <div class="row" style="margin:16px 0 10px"><b style="flex:1">الصلاحيات</b><span class="small muted">قالب جاهز:</span>${Object.entries(D.presets).map(([k,n])=>`<button class="chip" type="button" data-preset="${k}">${n}</button>`).join('')}</div><div id="mxw">${mx()}</div>`,
 `<button class="btn pri lg" data-act="userSave" data-id="${id||''}">حفظ</button><button class="btn" data-act="close">إلغاء</button>${id&&id!=='khaled'?`<button class="btn bad" data-act="userDel" data-id="${id}" style="margin-inline-start:auto">حذف المستخدم</button>`:''}`,true);
 const ov=$('#ov');ov._P=Pm;ov._u=u;ov.addEventListener('click',e=>{const pr=e.target.closest('[data-preset]');if(pr){Object.keys(Pm).forEach(k=>delete Pm[k]);Object.assign(Pm,PRESETS[pr.dataset.preset].p());ov._preset=pr.dataset.preset;$('#mxw').innerHTML=mx()}});
 ov.addEventListener('change',e=>{const c=e.target.closest('[data-pm]');if(c){const[m,p]=c.dataset.pm.split('.');Pm[m]=Pm[m]||{};Pm[m][p]=c.checked?1:0;if(p!=='v'&&c.checked)Pm[m].v=1;if(p==='v'&&!c.checked)Pm[m]={v:0};$('#mxw').innerHTML=mx()}})}
function pwModal(force){modal(force?'اختر كلمة مرور جديدة':'تغيير كلمة المرور',`<div class="fg"><div class="f full"><label>كلمة المرور الحالية</label><input class="in" type="password" id="po" dir="ltr"></div><div class="f full"><label>كلمة المرور الجديدة (10 أحرف على الأقل)</label><input class="in" type="password" id="pn" dir="ltr" autocomplete="new-password"></div></div><div class="err" id="pe"></div>`,`<button class="btn pri lg" data-act="pwSave">حفظ</button>${force?'':'<button class="btn" data-act="close">إلغاء</button>'}`)}
const genPw=()=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZ',b='abcdefghijkmnpqrstuvwxyz',c='23456789',d='#@$%&*!?';const r=s=>s[crypto.getRandomValues(new Uint32Array(1))[0]%s.length];let p=r(a)+r(b)+r(c)+r(d);for(let i=0;i<10;i++)p+=r(a+b+c+d);return p.split('').sort(()=>Math.random()-.5).join('')};

async function act(fn,ok){try{await fn();closeM();D=await API('boot');render();if(ok)toast(ok)}catch(e){toast(errMsg(e),1)}}
document.addEventListener('click',async e=>{const t=e.target.closest('[data-go],[data-act],[data-open],[data-new],[data-save],[data-del],[data-edit],[data-st],[data-flt],[data-user],[data-nt],[data-task],[data-kpi],[data-resub]');
 if(POP&&!e.target.closest('#pop')&&!e.target.closest('[data-act=bell]')){POP=false;$('#pop')?.remove()}
 if(!t)return;const ds=t.dataset;
 if(ds.st){const msg={'عند العميد':'تم الاعتماد والإحالة للعميد ✓','معتمد':'تم الاعتماد النهائي ✓','مرفوض':'تم رفض الطلب','معاد للاستكمال':'أُعيد الطلب لصاحبه للاستكمال'}[ds.st];return act(()=>API('save',{mod:'req',doc:{id:ds.rid,status:ds.st,note:$('#stNote')?.value||''}}),msg)}
 if(ds.nt){API('read',{id:ds.nt}).catch(()=>{});const n=D.notif.find(x=>x.id===ds.nt);if(n)n.read=true}
 if(ds.flt){F.st=ds.flt;F.q='';PAGE='req';location.hash='req';render();scrollTo(0,0);return}
 if(ds.go){PAGE=ds.go;F.q='';F.st=ds.f||'all';POP=false;location.hash=PAGE;render();scrollTo(0,0);return}
 if(ds.open)return openReq(ds.open);
 if(ds.task)return formModal('task',D.task.find(x=>x.id===ds.task));
 if(ds.kpi){const k=D.kpi.find(x=>x.id===ds.kpi);return CAN('kpi','e')?formModal('kpi',k):null}
 if(ds.new)return formModal(ds.new,{});
 if(ds.edit)return formModal('req',D.req.find(x=>x.id===ds.edit));
 if(ds.resub)return act(()=>API('save',{mod:'req',doc:{id:ds.resub,status:'عند رئيس القسم'}}),'أُعيد إرسال الطلب ✓');
 if(ds.save){const[m,id]=ds.save.split(':');const doc={id:id||undefined};$('#df').querySelectorAll('[name]').forEach(i=>{if(!i.disabled)doc[i.name]=i.value});if(!(doc.title||doc.name||'').trim()&&!(id&&m==='task'))return toast('اكتب العنوان أولاً',1);return act(()=>API('save',{mod:m,doc}),'تم الحفظ ✓')}
 if(ds.del){const[m,id]=ds.del.split(':');if(!confirm('هل أنت متأكد من الحذف؟'))return;return act(()=>API('del',{mod:m,id}),'تم الحذف')}
 if(ds.user)return userModal(ds.user);
 switch(ds.act){
  case'close':return closeM();
  case'theme':{const n=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=n;LSS('bs_theme',n);return D?render():renderLogin()}
  case'big':{const b=document.documentElement.classList.toggle('big');LSS('bs_big',b?'1':'0');return D?render():renderLogin()}
  case'bell':POP=!POP;render();return;
  case'menu':case'pw':return pwModal(false);
  case'readAll':return act(()=>API('read'));
  case'logout':await API('logout').catch(()=>{});D=null;return renderLogin();
  case'pwSave':try{await API('pw',{old:$('#po').value,pass:$('#pn').value});closeM();toast('تم تغيير كلمة المرور ✓')}catch(er){$('#pe').textContent=errMsg(er)}return;
  case'userNew':return userModal();
  case'genPw':$('#uP').value=genPw();return;
  case'userSave':{const ov=$('#ov'),id=ds.id;const u={id:id||$('#uI').value,name:$('#uN').value,title:$('#uT').value,email:$('#uE').value,perms:ov._P,preset:ov._preset||ov._u.preset,active:$('#uA')?$('#uA').checked:true,admin:$('#uAd')?$('#uAd').checked:!!ov._u.admin};
   const pass=$('#uP').value;return act(()=>API('user',{user:u,pass:pass||undefined,temp:!!pass&&id!=='khaled'}),id?'تم تحديث المستخدم ✓':'تم إنشاء المستخدم ✓')}
  case'userDel':if(!confirm('حذف هذا المستخدم نهائياً؟'))return;return act(()=>API('userDel',{id:ds.id}),'تم الحذف');
  case'seed':return act(()=>API('seed'),'تم تحميل البيانات التجريبية ✓');
  case'wipe':if(!confirm('مسح كل الطلبات والمهام والمؤشرات؟'))return;return act(()=>API('wipe'),'تم المسح');
 }});
document.addEventListener('input',e=>{if(e.target.id==='q'){F.q=e.target.value.trim();const p=e.target.selectionStart;render();const q=$('#q');q.focus();q.setSelectionRange(p,p)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeM();if(POP){POP=false;$('#pop')?.remove()}}});
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(D&&h&&h!==PAGE){PAGE=h;render()}});
if(SRV)setInterval(async()=>{if(!D||document.hidden||$('#ov'))return;try{const n=await API('boot');const nn=n.notif.filter(x=>!x.read&&!D.notif.some(y=>y.id===x.id));D=n;render();if(nn.length)toast('🔔 '+nn[0].text)}catch{}},30000);
load();
</script>
