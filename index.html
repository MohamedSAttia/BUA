<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نظام إدارة القسم</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#1b2433;--mu:#66738a;--bd:#e1e6ef;--pr:#1f4e8c;--prt:#fff;--ok:#1e8a5a;--wn:#b7791f;--dn:#c0392b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141c;--card:#18202c;--tx:#e8edf5;--mu:#93a1b8;--bd:#2a3546;--pr:#5b9bf0;--prt:#0b1220;--ok:#4cc38a;--wn:#e0b25a;--dn:#ef7b6e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f141c;--card:#18202c;--tx:#e8edf5;--mu:#93a1b8;--bd:#2a3546;--pr:#5b9bf0;--prt:#0b1220;--ok:#4cc38a;--wn:#e0b25a;--dn:#ef7b6e;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 "Segoe UI",Tahoma,system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 20px;background:var(--card);border-bottom:1px solid var(--bd)}
h1{margin:0;font-size:20px}h2{margin:0 0 10px;font-size:17px}h3{margin:0 0 12px}
.mu,small{color:var(--mu)}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mu)}
select,input,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;max-width:100%}
textarea{width:100%;min-height:80px}
nav{display:flex;gap:6px;padding:10px 20px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--bd)}
nav button{white-space:nowrap;border:0;background:transparent;color:var(--mu);font:inherit;font-weight:600;padding:8px 14px;border-radius:20px;cursor:pointer}
nav button.on{background:var(--pr);color:var(--prt)}
main{padding:20px;max-width:1000px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:14px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
.st{text-align:center;margin:0}.st b{display:block;font-size:30px;color:var(--pr)}.st span{color:var(--mu);font-size:13px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.top h2{margin:0}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.b{border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-weight:600;padding:7px 14px;border-radius:9px;cursor:pointer}
.b.p{background:var(--pr);color:var(--prt);border-color:var(--pr)}
.s{border:1px solid var(--bd);background:transparent;color:var(--pr);font:inherit;font-size:13px;padding:3px 10px;border-radius:7px;cursor:pointer}
.s.x{color:var(--dn)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{display:inline-block;background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:1px 10px;margin:2px;font-size:13px}
.chip.on{background:var(--pr);color:var(--prt);border-color:var(--pr);cursor:pointer}.chip{cursor:default}
.tag{font-size:12px;padding:2px 10px;border-radius:12px;font-weight:700}
.todo{background:rgba(120,130,150,.18);color:var(--mu)}.doing{background:rgba(183,121,31,.18);color:var(--wn)}.done{background:rgba(30,138,90,.18);color:var(--ok)}
table{width:100%;border-collapse:collapse}th,td{padding:8px;text-align:center;border-bottom:1px solid var(--bd)}th:first-child,td:first-child{text-align:start}
input[type=checkbox]{width:18px;height:18px;padding:0}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}#ov[hidden]{display:none}
.md{background:var(--card);border-radius:14px;padding:20px;width:min(480px,100%);max-height:90vh;overflow:auto}
.md label{display:block;margin-bottom:10px;font-weight:600;font-size:13px}.md input,.md select{width:100%;margin-top:4px}
.md label.ck{font-weight:400;display:inline-flex;gap:6px;align-items:center;margin:2px 8px 2px 0}.md label.ck input{width:auto;margin:0}
.bar{display:flex;gap:8px;margin-top:14px}
footer{text-align:center;color:var(--mu);font-size:12px;padding:20px}
.scroll{overflow-x:auto}
</style>
</head>
<body>
<div id="app"></div>
<div id="ov" hidden></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TODAY=new Date().toISOString().slice(0,10);
const R={head:'رئيس القسم',secretary:'سكرتير القسم',chair:'رئيس لجنة',member:'عضو هيئة تدريس',viewer:'مشاهد'};
const M={circulars:'التعاميم',committees:'اللجان',tasks:'المهام',meetings:'الاجتماعات',users:'المستخدمون والصلاحيات'};
const A={v:'عرض',a:'إضافة',e:'تعديل',d:'حذف'};
const ST={todo:'جديدة',doing:'جارية',done:'منتهية'};
const mk=s=>{const o={};for(const m in M){o[m]={};for(const a in A)o[m][a]=(s[m]||'').includes(a)}return o};
const defPerms=()=>({head:mk({circulars:'vaed',committees:'vaed',tasks:'vaed',meetings:'vaed',users:'vaed'}),secretary:mk({circulars:'vaed',committees:'v',tasks:'va',meetings:'vae'}),chair:mk({circulars:'v',committees:'v',tasks:'vae',meetings:'vae'}),member:mk({circulars:'v',committees:'v',tasks:'ve',meetings:'v'}),viewer:mk({circulars:'v',committees:'v'})});
const seed=()=>({me:'u1',
 users:[{id:'u1',name:'د. أحمد',role:'head'},{id:'u2',name:'أ. سارة',role:'secretary'},{id:'u3',name:'د. منى',role:'chair'},{id:'u4',name:'د. خالد',role:'member'},{id:'u5',name:'أ. ليلى',role:'member'},{id:'u6',name:'ضيف',role:'viewer'}],
 committees:[{id:'c1',name:'اللجنة العلمية',chair:'u3',members:['u4','u5']},{id:'c2',name:'لجنة الجداول والاختبارات',chair:'u4',members:['u5','u2']},{id:'c3',name:'لجنة الجودة',chair:'u5',members:['u3']}],
 circulars:[{id:'k1',title:'بدء التسجيل للفصل القادم',body:'يرجى من جميع الأعضاء مراجعة الجداول المبدئية قبل نهاية الأسبوع.',date:TODAY,by:'u1'}],
 tasks:[{id:'t1',title:'مراجعة توصيف المقررات',assignee:'u4',committee:'c1',due:'2026-12-01',status:'doing'},{id:'t2',title:'إعداد جدول الاختبارات النهائية',assignee:'u5',committee:'c2',due:'2026-12-10',status:'todo'},{id:'t3',title:'تقرير الجودة الفصلي',assignee:'u3',committee:'c3',due:'2026-11-20',status:'done'}],
 meetings:[{id:'m1',committee:'c1',date:'2026-11-30',agenda:'مناقشة الخطة الدراسية',minutes:''}],
 perms:defPerms()});
let S=null;try{S=JSON.parse(localStorage.getItem('dept_v1'))}catch(e){}
if(!S||!S.perms)S=seed();
const save=()=>{try{localStorage.setItem('dept_v1',JSON.stringify(S))}catch(e){}};
const uid=()=>Math.random().toString(36).slice(2,8);
const me=()=>S.users.find(u=>u.id===S.me)||S.users[0];
const can=(m,a)=>!!(S.perms[me().role]&&S.perms[me().role][m]&&S.perms[me().role][m][a]);
const uname=id=>(S.users.find(u=>u.id===id)||{}).name||'—';
const cname=id=>(S.committees.find(c=>c.id===id)||{}).name||'—';
const uopt=()=>S.users.map(u=>[u.id,u.name]);
const copt=()=>[['','—'],...S.committees.map(c=>[c.id,c.name])];
let tab='home',tf='all',pr='secretary';

const cfg={
 circulars:{f:()=>[{k:'title',l:'العنوان'},{k:'body',l:'النص',t:'textarea'}],def:()=>({date:TODAY,by:S.me})},
 committees:{f:()=>[{k:'name',l:'اسم اللجنة'},{k:'chair',l:'رئيس اللجنة',t:'select',o:uopt()},{k:'members',l:'الأعضاء',t:'multi',o:uopt()}],def:()=>({members:[]})},
 tasks:{f:()=>[{k:'title',l:'المهمة'},{k:'assignee',l:'المكلّف',t:'select',o:uopt()},{k:'committee',l:'اللجنة',t:'select',o:copt()},{k:'due',l:'تاريخ التسليم',t:'date'},{k:'status',l:'الحالة',t:'select',o:Object.entries(ST)}],def:()=>({status:'todo',assignee:S.me})},
 meetings:{f:()=>[{k:'agenda',l:'جدول الأعمال',t:'textarea'},{k:'committee',l:'اللجنة',t:'select',o:copt()},{k:'date',l:'التاريخ',t:'date'},{k:'minutes',l:'المحضر والقرارات',t:'textarea'}],def:()=>({date:TODAY})},
 users:{f:()=>[{k:'name',l:'الاسم'},{k:'role',l:'الدور',t:'select',o:Object.entries(R)}],def:()=>({role:'member'})}
};

function inp(f,v){v=v??'';
 if(f.t==='textarea')return `<textarea id="f_${f.k}">${esc(v)}</textarea>`;
 if(f.t==='select')return `<select id="f_${f.k}">${f.o.map(o=>`<option value="${o[0]}" ${o[0]===v?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`;
 if(f.t==='multi')return `<div>${f.o.map(o=>`<label class="ck"><input type="checkbox" name="${f.k}" value="${o[0]}" ${(v||[]).includes(o[0])?'checked':''}>${esc(o[1])}</label>`).join('')}</div>`;
 return `<input id="f_${f.k}" type="${f.t==='date'?'date':'text'}" value="${esc(v)}">`;
}
function modal(h){const o=$('#ov');o.innerHTML=`<div class="md">${h}</div>`;o.hidden=false}
function closeM(){$('#ov').hidden=true}
function form(title,fields,vals,cb){
 modal(`<h3>${title}</h3>`+fields.map(f=>`<label>${f.l}${f.t==='multi'?'':inp(f,vals[f.k])}</label>${f.t==='multi'?`<div><b style="font-size:13px">${f.l}</b>${inp(f,vals[f.k])}</div>`:''}`).join('')+`<div class="bar"><button class="b p" id="ok">حفظ</button><button class="b" id="no">إلغاء</button></div>`);
 $('#no').onclick=closeM;
 $('#ok').onclick=()=>{const o={};for(const f of fields){o[f.k]=f.t==='multi'?[...document.querySelectorAll(`[name="${f.k}"]:checked`)].map(x=>x.value):$('#f_'+f.k).value}
  if(!String(o[fields[0].k]).trim()){$('#f_'+fields[0].k).focus();return}
  cb(o);save();closeM();render()};
}
function ask(msg,cb){modal(`<h3>${msg}</h3><div class="bar"><button class="b p" id="ok">تأكيد</button><button class="b" id="no">إلغاء</button></div>`);$('#no').onclick=closeM;$('#ok').onclick=()=>{cb();save();closeM();render()}}

const btns=(m,id)=>{const e=can(m,'e')&&!(m==='tasks'&&me().role==='member'),d=can(m,'d');return (e||d)?`<div class="acts">${e?`<button class="s" data-act="edit" data-m="${m}" data-id="${id}">تعديل</button>`:''}${d?`<button class="s x" data-act="del" data-m="${m}" data-id="${id}">حذف</button>`:''}</div>`:''};
const top=m=>`<div class="top"><h2>${M[m]}</h2>${can(m,'a')?`<button class="b p" data-act="add" data-m="${m}">+ إضافة</button>`:''}</div>`;
const empty='<p class="mu">لا توجد بيانات بعد</p>';

const views={
 home(){const u=me(),open=S.tasks.filter(t=>t.status!=='done'),mine=open.filter(t=>t.assignee===u.id),up=S.meetings.filter(m=>m.date>=TODAY).sort((a,b)=>a.date<b.date?-1:1);
  return `<div class="grid">${[['مهام مفتوحة',open.length],['مهامي',mine.length],['اجتماعات قادمة',up.length],['تعاميم',S.circulars.length]].map(s=>`<div class="card st"><b>${s[1]}</b><span>${s[0]}</span></div>`).join('')}</div>
  <div class="cols"><section class="card"><h2>مهامي</h2>${mine.map(t=>`<div class="row"><span>${esc(t.title)}</span><small>${t.due||''}</small></div>`).join('')||'<p class="mu">لا توجد مهام مفتوحة عليك</p>'}</section>
  <section class="card"><h2>أقرب اجتماع</h2>${up[0]?`<b>${esc(cname(up[0].committee))}</b><p>${up[0].date}</p><p class="mu">${esc(up[0].agenda)}</p>`:'<p class="mu">لا توجد اجتماعات قادمة</p>'}</section></div>`},
 circulars(){return top('circulars')+([...S.circulars].sort((a,b)=>a.date<b.date?1:-1).map(c=>`<div class="card"><b>${esc(c.title)}</b><p>${esc(c.body)}</p><small>${c.date} · ${esc(uname(c.by))}</small>${btns('circulars',c.id)}</div>`).join('')||empty)},
 committees(){return top('committees')+(S.committees.map(c=>`<div class="card"><b>${esc(c.name)}</b><p class="mu">رئيس اللجنة: ${esc(uname(c.chair))}</p><div>${(c.members||[]).map(i=>`<span class="chip">${esc(uname(i))}</span>`).join('')||'<small>لا أعضاء</small>'}</div>${btns('committees',c.id)}</div>`).join('')||empty)},
 tasks(){const u=me(),l=S.tasks.filter(t=>tf==='all'||t.assignee===u.id);
  return top('tasks')+`<div style="margin-bottom:10px"><span class="chip ${tf==='all'?'on':''}" data-act="tf" data-id="all">الكل</span><span class="chip ${tf==='mine'?'on':''}" data-act="tf" data-id="mine">مهامي</span></div>`+
  (l.map(t=>{const ce=can('tasks','e')&&(u.role!=='member'||t.assignee===u.id);return `<div class="card"><div class="row" style="border:0;padding:0"><b>${esc(t.title)}</b>${ce?`<select data-chg="tst" data-id="${t.id}">${Object.entries(ST).map(s=>`<option value="${s[0]}" ${s[0]===t.status?'selected':''}>${s[1]}</option>`).join('')}</select>`:`<span class="tag ${t.status}">${ST[t.status]}</span>`}</div><small>${esc(uname(t.assignee))} · ${esc(cname(t.committee))} · ${t.due||'بدون تاريخ'}</small>${btns('tasks',t.id)}</div>`}).join('')||empty)},
 meetings(){return top('meetings')+([...S.meetings].sort((a,b)=>a.date<b.date?1:-1).map(m=>`<div class="card"><b>${esc(cname(m.committee))}</b> <small>${m.date}</small><p>${esc(m.agenda)}</p>${m.minutes?`<p class="mu">القرارات: ${esc(m.minutes)}</p>`:''}${btns('meetings',m.id)}</div>`).join('')||empty)},
 users(){const ed=can('users','e'),L=pr==='head';
  return top('users')+`<div class="card scroll"><table><tr><th>الاسم</th><th>الدور</th><th></th></tr>${S.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${ed?`<select data-chg="urole" data-id="${u.id}">${Object.entries(R).map(r=>`<option value="${r[0]}" ${r[0]===u.role?'selected':''}>${r[1]}</option>`).join('')}</select>`:R[u.role]}</td><td>${can('users','d')&&u.id!==S.me?`<button class="s x" data-act="del" data-m="users" data-id="${u.id}">حذف</button>`:''}</td></tr>`).join('')}</table></div>
  <div class="card"><h2>مصفوفة الصلاحيات</h2><div style="margin-bottom:10px">${Object.entries(R).map(r=>`<span class="chip ${pr===r[0]?'on':''}" data-act="pr" data-id="${r[0]}">${r[1]}</span>`).join('')}</div>
  <div class="scroll"><table><tr><th>الوحدة</th>${Object.values(A).map(a=>`<th>${a}</th>`).join('')}</tr>${Object.keys(M).map(m=>`<tr><td>${M[m]}</td>${Object.keys(A).map(a=>`<td><input type="checkbox" data-chg="perm" data-m="${m}" data-a="${a}" ${S.perms[pr][m][a]?'checked':''} ${(!ed||L)?'disabled':''}></td>`).join('')}</tr>`).join('')}</table></div>
  ${L?'<small>صلاحيات رئيس القسم كاملة وثابتة.</small>':''}${ed?`<div class="acts"><button class="s x" data-act="reset">إعادة البيانات التجريبية</button></div>`:''}</div>`}
};

function render(){
 const u=me(),tabs=[['home','الرئيسية'],...Object.keys(M).filter(m=>can(m,'v')).map(m=>[m,M[m]])];
 if(!tabs.some(t=>t[0]===tab))tab='home';
 $('#app').innerHTML=`<header><div><h1>نظام إدارة القسم</h1><small>${esc(u.name)} — ${R[u.role]}</small></div><label class="who">الدخول كـ<select data-chg="me">${S.users.map(x=>`<option value="${x.id}" ${x.id===S.me?'selected':''}>${esc(x.name)} — ${R[x.role]}</option>`).join('')}</select></label></header>
 <nav>${tabs.map(t=>`<button class="${t[0]===tab?'on':''}" data-act="tab" data-id="${t[0]}">${t[1]}</button>`).join('')}</nav>
 <main>${views[tab]()}</main><footer>إعداد وفكرة وتصميم د. خالد البلوي — جميع الحقوق محفوظة</footer>`;
}
const acts={
 tab:d=>{tab=d.id;render()},tf:d=>{tf=d.id;render()},pr:d=>{pr=d.id;render()},
 add:d=>{const c=cfg[d.m];form('إضافة',c.f(),c.def(),o=>{S[d.m].push({id:uid(),...c.def(),...o})})},
 edit:d=>{const c=cfg[d.m],x=S[d.m].find(i=>i.id===d.id);form('تعديل',c.f(),x,o=>Object.assign(x,o))},
 del:d=>ask('تأكيد الحذف؟',()=>{S[d.m]=S[d.m].filter(i=>i.id!==d.id)}),
 reset:()=>ask('سيتم مسح كل البيانات والرجوع للبيانات التجريبية. متأكد؟',()=>{S=seed()}),
 me:(d,t)=>{S.me=t.value;save();render()},
 tst:(d,t)=>{S.tasks.find(x=>x.id===d.id).status=t.value;save();render()},
 urole:(d,t)=>{S.users.find(x=>x.id===d.id).role=t.value;save();render()},
 perm:(d,t)=>{S.perms[pr][d.m][d.a]=t.checked;save();render()}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t&&acts[t.dataset.act])acts[t.dataset.act](t.dataset,t)});
document.addEventListener('change',e=>{const t=e.target.closest('[data-chg]');if(t&&acts[t.dataset.chg])acts[t.dataset.chg](t.dataset,t)});
render();
</script>
</body>
</html>
