ا لم يجتز الاختبار الشامل بعد السماح له بإعادته مرة واحدة.\nج- إذا قررت لجحنة الحكم على الرسالة العلمية عدم صلاحيتها للمناقشة: أو عدم قبوها بعد المناقشة.\nد- إذا أخل بالأمانة العلمية سواء في مرحلة دراسته للمقررات: أو خلال إعداده للرسالة العلمية، أو أخلٌ\nبالأنظمة: أو اللوائح: أو القرارات. ذات العلاقة.\nالقاعدة التنفيذية للمادة السادسة والعشرين\nتتولى الإدارة التنفيذية إجراءات إلغاء القيد في الحالات الواردة في البند .)١(\nالمادة السابعة والعشرون:\nيجوز إعادة قيد الطالب الذي ألغي قيده إذا كان الحائل دون مواصلة دراسته ظروفاً يقبلها مجلسا القسم والكلية، وتكون\nإعادة القيد بقرار من اللجنة الدائمة مع مراعاة ما يأني:\n-١ الطالب الذي مضى على إلغاء قيده أكثر من ثلاثة أعوام دراسية؛ يُعامل معاملة الطالب المستجد من حيث إعادة دراسة\nالمقررات؛ بصرف النظر عمًا أنجزه سابقاً من مرحلة الدراسة: ومجلس الجامعة الاستشناء من ذلك؛ وفق ضوابط تصدر من\nمجلس الجامعة بناءً على اقتراح من اللجنة الدائمة.\n؟- الطالب الذي مضى على إلغاء قيده ثلاثة أعوام دراسية أو أقلء يُعيد دراسة بعض المقررات التي يحددها له مجلس\nالقسم: ويوافق عليها مجلس الكلية؛ وتحسب الوحدات التي درسها بعد استثنافه الدراسة ضمن معدله التراكمي؛ كما\nتحسب المدة التي قضاها الطالب في الدراسة قبل إلغاء قيده ضمن المدة القصوى للحصول على الدرجة.\nالقاعدة التنفيذية للمادة السابغة والعشرين\n-١ يُسمح للطالب الذي مضى على إلغاء قيده ثلاثة أعوام دراسية أو أقل؛ وكان في مرحلة دراسة المقررات، بالتقدم\n4 بطلب إعادة القيد إلى القسم المختص.\nلكة العربية السعودية. الباحة (٠ 1988)\nخالل جيل 0 ام شاظفهم امزافك ع0 امنا لك\nلإانوعء/اأوناةداة8 © دك نالع .نط © اعقاممء ا\nك5.نالع.ناط ١","a":["المادة (الرابعة والأربعين) من هذه ال","القاعدة التنفيذية للمادة السادسة والعشري","المادة السابعة والعشرون","القاعدة التنفيذية للمادة السابغة والعشري"]},{"d":"bu1447","p":18,"l":"ar","t":"ا العف كك لمشكؤون ذاقف88 اناك +0 6001 ١اكا\n؟- يعيد الطالب دراسة بعض المقررات والتي يحددها مجلس القسم ويوافق عليها مجلس الكلية.\n#- الطالب الذي أنهى جميع المقررات الدراسية وسجل الرسالة العلمية. ومضى على إلغاء قيده خمنسة أعوام دراسية أو\nأقل؛ بمكنه التقدم بطلب إعادة القيد وفق الشروط التالية:\n** تقديم نسخة مكتملة من الرسالة العلمية.\n*:* توصية من مجلس القسم واعتماد من مجلس الكلية.\n** يتم مناقشة الرسالة وإنماء إجراءات التخرج بعد تسجيل الرسالة في الفصل الدراسي الذي يتم فيه إعادة القيد.\n*#* استيفاء جميع الرسوم المقررة، إن ُجدت.\n4- لا يجوز إعادة قيد الطالب في كلا الحالتين أكثر من مرة واحدة: وللجنة الدائمة الاستثناء من ذلك في حال الضرورة\nالقصوى. بناءً على توصية مجلسي القسم والكلية.\nه- تُحسب المدة التي قضاها الطالب.قبل إلغاء القيد ضمن المدة النظامية للحصول على الدرجة العلمية؛ ويُلزم الطالب\nبسداد الرسوم المالية - إن وجدت -.\nالمادة الثامنة والعشرون:\nمجلس الكلية؛ استغناءً من الفقرة (ج) من البند )١( من المادة (السادسة والعشرين) من هذه اللائحة: منح الطالب فرصة\nاستغنائية واحدة: لا تزيد على عام دراسي كحدٍ أعلى؛ بناءً على توصية مجلس القسم.\n-١ لمجلس القسم أن يُوصي بمنح الطالب فرصة لا تزيد على سنة دراسية؛ لرفع معدَّله التراكمي إذا كان مكناً.\n؟- يجوز إعادة ذزاسة مقرر أو أكثر مما حصل فيه الطالب على تقدير (جيذ مرتفع)؛ لرفع معدَّله التراكمي إلى (جيد جدا).\n*-- ترفع توصية مجلس القسم مرفقة بتقرير الموجه العلمي والسجل الأكاديمي للطالب إلى مجلس الكلية للنظر واتخاذ\nالتوصية المناسبة.\n4 - ترفع طلبات الفرصة الإضافية إلى الإدارة التنفيذية لتنفيذها في نظام الخدمات الإلكترونية المعتمدة في الجامعة.\nالمادة التاسعة والعشرون:\nللجنة الدائمة؛ استثناء من الفقرة (ه) من البند )١( من المادة (السادسة والعشرين) من هذه اللائحة، منح الطالب فرصة\nاستثنائية لا تزيد على عام دراسي؛ بناءً على تقرير من المشرف؛ وتوصية مجلسي القسم والكلية.\nرانم لأولامنام8ج ع ممسال مه هاءمادي ا ١\nهك نالع بنط","a":["المادة الثامنة والعشرون","المادة (السادسة والعشرين) من هذه الل","المادة التاسعة والعشرون","المادة (السادسة والعشرين) من هذه الل"]},{"d":"bu1447","p":19,"l":"ar","t":"ا 3 لآ ذاقف8ثم الاذد +0 600١1 لكا\nالدراسات العليا والدابتعاث\n؟- يُقدّمِ المشرف لرئيس القسم المختصء تقريراً مفصلاً عن سير الطالب الدراسي مقترحاً مدة الفرصة الإضافية.\n**- تتولى الإدارة التنفيذية دراسة الطلبات والرفع بحا إلى اللجنة الدائمة.\nالمادة الثلاثون:\nمع مراعاة المادة (الخامسة عشرة) من هذه اللائحة: للإدارة التنفيذية قبول تحويل الطالب إلى الجامعة من جامعة أو مؤسسة\nتعليمية داخل المملكة أو من خارجها على أن تكون مرخصة من جهة الاختصاص في بلد الدراسة، على ألا يكون مفصولاً\nمنها لأيّ سبب من الأسبابء بناءًٌ على توصية مجلسي القسم والكلية. وتُتبَت المقررات الدراسية التي تم معادلتها في السجل\nالأكاديمي للطالب؛ ويحدد مجلس الجامعة الضوابط المنظمة في ذلكء بما فيها إمكانية احتسابما ضمن المعدل التراكمي\nالقاعدة التنفيذية للمادة الثلاثين\nيكون التحويل إلى الجامعة وفق ما يلي:\n-١ أن يكون الطالب قد اجتاز فصلاً دراسياً على الأقل؛ ولا يقبل تحويل الطالب المستجد.\n؟- إرفاق ما يغبت قبوله وانتظامه في الجامعة المحول منها.\n- إرفاق نسخة معتفدة من السجل الأكاديمي.\n4 - إرفاق وصف تفصيلي معتمد لمفردات المقررات التي درسها الطالب.\nه- إذا كانت الجامعة المحول منها من خارج المملكة فلابد أن تصدَّق الوثائق من الملحقية الثقافية والقنصليات السعودية.\n5- يجوز إضافة ضوابط أخرى تشترطها الإدارة التنفيذية.\nالمادة الحادية والثلاثون:\nيجوز تحويل الطالب من برنامج إلى آخر داخل الجامعة: بناءً على توصية مجلس القسم لمحل إليه؛ وموافقة الكلية، وفقاً\nللشروط والضوابط التي يقرها مجلس الجامعة؛ بناءً على اقتراح اللجنة الدائمة.\nالقاعدة التنفيذية للمادة الحادية والثلاثين\n-١ يشترط أن تتوافر في الطالب شروط التحويل للبرنامج الذي يرغب التحويل إليه؛ ويجوز للقسم المختص\nإضافة أي شروط ضرورية أخرى.\n؟- يجب أن يكون الطالب قد اجتاز فصلاً دراسياً واحداً وبما لا يقل عن ” وحدات معتمدة على الأقل في\nرَ البرنامج الذي يرغب التحويل منه\nملكة العربية السعودية. الباحة (1988)\nاسطم تل 0م 0 اليفك ع0 لاسا 1\nلإانوعء/اأوناهاة8 © هك نالع .ناط 6اء3 ممع 0 لما 0\nهك5.نالع.ناط","a":["المادة الثلاثون","المادة (الخامسة عشرة) من هذه اللائحة","القاعدة التنفيذية للمادة الثلاثين","المادة الحادية والثلاثون","القاعدة التنفيذية للمادة الحادية والثلاث"]},{"d":"bu1447","p":20,"l":"ar","t":"0-5 وقحائعحة | امشحوون ذاقخفم88 الاناذظدك 08 6001ل ذاكا\nالدراسات العليا واللابتعاث ا 1 1\nلا8 جامعة الباحة 85117علاالانا ذناق8- اله امعة لباك نا امجواا له\nم« أن تكون حالته الأكاديية أثناء طلب التحويل منتظماً مؤجا أو معتذراً :\n4- يتقدم الطالب بطلب التحويل إلى القسم العلمي للبرنامج المزاد التحويل إليه؛ مرفقاً بدموذج التحويل\nالداخلي: وكشف درجات معتمد من البرنامج السابق؛ وتوصيف المقررات التي درسها.\nه- يتم التوصية على قبول الطلب من مجلس القسم وتأييد مجلس الكلية؛ ثم يحال إلى عمادة الدراسات العليا\nلاتخاذ القرار النهائي.\n5- يُسمح للطالب بالتحويل مرة واحدة فقط خلال مسيرته الدراسية في الجامعة. وللجنة الدائمة في الدراسات\nالعليا الحق في الاستثناء من هذا الشرط عند الضرورة.\n- متسب المدة التي قضاها الطالب في البرنامج المحول منه ضمن المدة القصوى المسموح بما للحصول على\nالدرجة العلمية؛ ويجوز الاستثناء من ذلك بناءً على توصية مجلس القسم وتأييد مجلس الكلية.\nالمادة الثانية والثلاثون:\nلطالب الدراسات العليا - بناءً على توصية مجلس القسم وموافقة مجلس الكلية - دراسة بعض المقررات في جامعة أو\nمؤسسة تعليمية داخل المملكة أو خارجها على أن تكون مرخصة من جهة الاختصاص في بلد الدراسة؛ وتعادل له الوحدات\nالدراسية التي درسهاء وتُتبّت المقررات الدراسية التي تم معادلتها في السجل الأكاديمي للطالب، ويحدد مجلس الجامعة\nالضوابط المنظمة في ذلك بما فيها إمكانية احتسابما'ضمن المعدل التراكمي للطالب في سجله الأكاديمي.\nالقاعدة التنفيذية للمادة الثانية والثلاثين\nتتم معادلة المقررات الدراسية وفقاً للضوابط المنصوص عليها في القاعدة التنفيذية للمادة .)١9(\nالمادة الثالثة والثلاثون:\nلطالب الدراسات\"العليا من جامعة غير سعودية دراسة بعض المقررات في جامعة سعودية: وفقاً لضوابط. يقرها مجلس الجامعة\nبناءً على اقتراح اللجنة الدائمة.\nالقاعدة التنفيذية للمادة الثالثة والثلاثين\n-١ يطبق على الطالب جميع اللوائح المنظمة للدراسات العليا وقواعدها التنفيذية بجامعة الباحة.\n؟- يجب أن يحصل الطالب على موافقة من الجامعة الأم التي ينتمي إليها الطالب، وكذلك من جامعة الباحة.\n5 *- يتم تقييم 'توافق المقررات الأكاديمية مع المنهج الدراسي للبرنامج الذي يتبعه الطالب في جامعته الأم, بناءً\n7 على توصية مجلس القسم وتأييد مجلس الكلية.\nلكة العربية السعودية. الباحة (1988)\nلحت رت 0م هاه8-ام اي اليفك 3 لام أذ 8 برجا 1\nبإانىىء زناه طة8 © دك نالع نط ها قألمىء 10 1\n55.نالع.ناط","a":["المادة الثانية والثلاثون","القاعدة التنفيذية للمادة الثانية والثلاث","القاعدة التنفيذية للمادة .)١9(","المادة الثالثة والثلاثون","القاعدة التنفيذية للمادة الثالثة والثلاث"]},{"d":"bu1447","p":21,"l":"ar","t":"فعاكع الانتتكاده ا ربكت العلعي و27 2 0\n4- إذا لم تكن لغة التدريس في البرنامج هي اللغة الأم للطالب؛ يُشترط أن يجتاز الطالب اختبار اللغة وفقًا للغة\nالتدريس المعتمدة في البرنامج.\nه- تكون الرسوم الدراسية المحددة للمقررات التي يدرسها الطالب في الجامعة السعودية قابلة للتطبيق.\n5- تلتزم الإدارة التنفيذية لبرامج الدراسات العليا بتزويد الطالب بسجل أكاديمي للمواد التي تم دراستها\nالفصل التاسع: آلية التقييم\nالمادة الرابعة والثلاثون:\nيتم إجراء الاختبارات في مقررات الدراسات العلياء ورصد التقديرات، وفقاً للائحة الدراسة والاختبازات للمرحلة الجامعية،\nفيما عدا الآني:\n-١ لا يُعد الطالب ناجحاً في المقرر إلا إذا حصل فيه على تقدير (جيد مرتفع) على الأقل.\n؟- اجتياز الطالب المقرر التكميلي في المرة الأولى بتقدير لا يقل عن (جيد مرتفع)؛ ولا يقل معدله التراكمي في مجمل\nالمقررات التكميلية عن (جيد جدا):\n*- فيما يتعلق بالاختبارات البديلة والمقررات التي تتطلب دراستها أكثر من فصل دراسي يتخذ مجلسن_الكلية ما يراه\nحيالهاء بناءً على توصية مجلس القسم.\nالقاعدة التنفيذية للمادة الرابعة والثلاثين\n-١ فيما لم برد. فيه نص خاص في هذه اللائحة وقواعدها التنفيذية فيرجع في إجراء الاختبارات ورصدالتقديرات إلى لائحة\nالدراسة والاختبارات للمرحلة الجامعية وقواعدها التنفيذية بالجامعة.\n-٠ يعد الطالب منذراً أكاديمياً إذا انخفض معدله عن (8,؟) من (4)؛ دون الحاجة لإشعار مكتوب.\n*“- يشترط لعقد الاختبار البديل ما يلي:\n< أن يتقدم الطالب إلى رئيس القسم المختص بعذره عن التخلف من وقت بداية العذر حتى تماية الأسبوع الثاني من\nماية الاختبارات؛ ما لم يكن هناك مسوغ لتأخير تقديم العذر.\n<ا موافقة مجلسي القسم والكلية على العذر.\n4- يعقد الاختبار البديل خلال الشهر الأول من بداية الفصل الدراسي التالي.\nلإأأوعء/اأوتاهطة8© 5 نالع .ناطن6اء3 ألم 1","a":["المادة الرابعة والثلاثون","القاعدة التنفيذية للمادة الرابعة والثلاث"]},{"d":"bu1447","p":22,"l":"ar","t":"معاد رتكا وليحث المي 2-02\nكا وخالةا و لشحؤون ة التعليم 7!080معنامع عه 817كالذالا\nالمادة الخامسة والثلاثون:\nيضع مجلس الجامعة القواعد المنظمة للاختبار الشامل - بشقيه التحريري والشفوي - لمرحلتي الماجستير والدكتوراه؛ بناءً\nعلى مقترح اللجنة الدائمة.\nالقاعدة التنفيذية للمادة الخامسة والثلاثين\n-١ يكون الاختبار الشامل إلزاميًا لطالب الدكتوراه بعد اجتيازه لجميع المقررات الدراسية، ولطالب الماجستير إذا اقتضى\nبرنامج دراسته ذلك؛ ويتكون من شقين: تحريري وشفوي.\n-١ يشكل مجلس القسم لجحنة للاختبار الشامل؛ بحيث تتكون من ثلاثة من أعضاء هيئة التدريس في مرحلة الدكتوراه\nوعضوين في مرحلة الماجستير من ذؤي الاختصاص في التخصص الرئيس والتخصصات الفرعية (إن وجدت).\n*- أن يكون أحد الأعضاء على الأقل برتبة أستاذ أو أستاذ مشارك, مع شرط حيادية اللجنة بعدم وجود المرشد الأكاديمي\nللطالب ضمن أعضائها.\n4- تتولى اللجنة إعداد أسئلة الاختبار بشقيه (التحريري والشفوي)؛ وتصحيح الإجابات، وتقديم تقرير بالنتائج إلى مجلس\nالقسم لاعتمادها.\nه- يعقد الاختباز التحريري في موعد يحدده مجلس القسم في الفصل الدراسي التالي لإتمام الطالب مقرزاته الدراسية.\n5- يجوز للطالب طلب تأجيل الاختبار التحريري لموعد الاختبار التالي بعذر يقبله مجلس القسم وتأييد مجلس الكلية.\n/- إذا لم يجتر الطالب الاختبار التحريري؛ يعطى فرصة واحدة لإعادة الاختبار في الفصل الدراسي التالي، وفي حال عدم\nاجتيازه مجددًاء يُلغى قيده بقرار من اللجنة الدائمة بناءً على توصية مجلس القسم وتأييد مجلس الكلية.\n8- يُجرى الاختبار الشفوي بعد نجاح الطالبٍ في الاختبار التحريري؛ وقي.موعد يحدده مجلس القسم.\n9- في حالة عدم اجتياز الطالب للاختبار الشفوي. يعطى فرصة واحدة للإعادة خلال الفصل الدراسي التالي، وإذا لم يجتر\nالاختبار بعد الإعادة؛ يُلغى قيده بقرار من اللجنة الدائمة بناءً على توصية مجلس القسم وموافقة مجلس الكلية.\n-٠ يكون لكل من الاختبار التحريري والاختبار الشفوي درجة مستقلة من ٠١٠١ درجة؛ وفي حال وجود تخصصات فرعية\nيحدد لكل تخنصص 1١٠ درجة.\n-١ يُعتبر الطالب ناجحًا في كل شق من الاختبار إذا حصل على 9/01٠١ فأكثر من الدرجة الكلية.\n-١ يتم اعتماد النتائج في مجلس القسم ومن ثم ترفع إلى الإدارة التنفيذية لبرامج الدراسات العليا.\n-١* يعطى الطالب الراسب فرصة واحدة لإعادة الاختبار الشامل في الفصل الدراسي التالي للإعلان عن النتيجة؛ وفي حال\nعدم اجتيازه للمرة الثانية: يُلغى قيده بقرار من اللجنة الدائمة، بناءً على توصية مجلس القسم وتأيبد مجلس الكلية.\n-١ 4 لا يجوز للطالب تقديم موضوع الرسالة وخطتها البحثية إلا بعد اجتيازة الاختبار الشامل بشقيه التحريري والشفوي.\n[1أىمء/األناةداة8 © 52.نالع .ناط 6اع3 01م أ 0 : أ\n53نالع.ناط 1 |","a":["المادة الخامسة والثلاثون","القاعدة التنفيذية للمادة الخامسة والثلاث"]},{"d":"bu1447","p":23,"l":"ar","t":"3 ”5 ذاقفق8ث الالاذدك 08 /6001١اكا\nا وكالة العماةة لشؤون\n-١ للطالب الحق في التظلم من نتيجة الاختبار الشامل وفقاً لما تنص عليه لائحة الدراسة والاختبارات للمرحلة الجامعية،\nوتقوم اللجنة الدائمة أو من تفوضه بالنظر في التظلمات.\n5- عادةٌ ما يحب تقديم الشكوى في غضون فترة محددة (مثل ٠١ إلى \"٠ يومًا) بعد إعلان نتائج الامتحان.\nالفصل العاشر اللرسائل العلصية والإشراف والمناقسة\nالمادة السادسة والثلاثون:\nيضع مجلس الجامعة القواعد المنظمة لتسجيل مشروع بحث التخرج؛ والرسالة العلمية لطالب الدراسات العليا -إن وجدت-\nوآلية تحديد المشرف على الرسالة العلمية، والمشرف المساعد -إن وجد- وذلك بناء على توصية اللجنة الدائمة.\nالقاعدة التنفيذية للمادة السادسة والثلاثين\n-١ على طالب الدراسات العليا بعد اجتيازه خمسين في المئة على الأقل من المقرزات الدراسية وبمعدل تراكمي لا يقل عن\n(جيد جداً) التقدم بمشروع الرسالة - إن وجد- إلى القسم العلمي.\n؟- يفضل أن تكون الرسائل ضمن الأوليات البحثية التي تحددها الجامعة.\n*“- يعامل مشروع بحث التخرج معاملة المقرر الدراسي, ويراعى في الإشراف عليه ما ورد في المادة الثامنة والثلاثون من\nهذه اللائحة:\n6- يقر عنوان مشروع البحث التخرج من مجلس القسم في الفصل الذي يسبق فصل تسجيل المقرر، ويسجل في الفصل\nالدراسي المحدد حسب الخطة الدراسية.\nه- إقرار عنوان الرسالة العلمية لطالب الدراسات العليا من خلال مخلسي القسم والكلية.\n5- يتم تحديد المشرف الرئيس والمشرف المساعد (إن وجد) على الرسالة العلمية لطالب الدراسات العليا من خلال مجلس\nالقسم مع مراعاة الرتبة الأكاديمية والتخصص.\n/- عرض مقترح مشروع بحث التخرج أو الرسالة العلمية على اللجنة الدائمة لأخلاقيات البحث العلمي إذا كان البحث\n- رفع توصية مجيس الكلية إلى الإدارة التنقيذية لتولى تنفيذها.\nالمادة السابعة والثلاثون:\nتكتب رسائل الماجستير والدكتوراه بلغة الغدريس المقررة للبرنامج هن مجلس الجامعة) على أن تحتوي الرسالة العلمية 5-6\n0 باللغة العربية في حال كانت الرسالة العلمية بغير اللغة العربية.\nلإانوىء/اأوناةداة8 © دك نالع .اط 6اء013مء 11 0\n.نالع .ناط ١ || ذا","a":["المادة السادسة والثلاثون","القاعدة التنفيذية للمادة السادسة والثلاث","المادة الثامنة والثلاثون من","المادة السابعة والثلاثون"]},{"d":"bu1447","p":24,"l":"ar","t":"عا وار 0 0 اس واس ومست رن\n-١ تضع اللجنة الدائمة الأدلة التفصيلية لكتابة الرسائل والبحوث العلمية في التخصصات المختلفة.\nالمادة الثامنة والثلاثون:\nيشرف على الرسائل العلمية الأساتذة والأساتذة المشاركين من أعضاء هيئة الندريس بالجامعة، ويجوز للأستاذ المساعد أن\nيشرف على أبحاث التخرج ورسائل الماجستير: والمساعدة في الإشراف على الرسائل العلمية لمرحلة الدكتوراه؛ إذا كان لديه\nبحثان - في مجال تخصصه - منشوران: أو مقبولان للنشر في مجلة علمية محكمة.\n-١ تكون أولوية الإشراف على الرسائل العلمية خسب الرتبة الأكاديمية بما لا'يقل عن رتبة أستاذ مشارك ويجوز للأستاذ\nالمساعد الإشراف على أبحاث التخرج ورسائل الماجستير إذا كان لدية بحثان - في مجال تخصصه - منشوران، أو\nمقبولان للدشر في مجلة علمية محكمة.\n؟- يجب أن ايتم إسناد الإشراف لأعضاء. هيئة التدريس بناءً على تخصصاتهم وبما يضمن العدالة. في استحقاق توزيع\nالإشراف لجميع أعضاء هيئة التدريس بالقسم.\n- يجوز إسناد الإشراف إلى عضو هيئة تدريس من خارج القسم وفق الآقي:\n< أن تكون أنصبة الإشراف لأعضاء هيئة التدريس بالقسم المختص قد اكتملت ما لم يكن هناك مسوغ مقنع.\n< بيجتسب الإشراف ضمن نصاب عضو هيئة التدريس امحدد في المادة (5 4 ) من هذه اللائحة وقاعدها التنفيذية.\nالمادة التاسعة والثلاثون:\nيجوز أن يقوم بالإشراف أو المساعدة في الإشراف على الرسائل العلمية مشرفون من ذوي الخبرة والكفاءة في مجال بحث\nالرسالة العلمية من غير أعضاء هيئة التدريس، سواء من داخل الجامعة أو من خارجهاء بناءً على توصية مجلس القسم\nوموافقة مجلس الكلية.\n؟- يراعى وجود مسوغات مقنعه للإشراف من خارج القسم أو اجامعة.\n4 *- يراعى اكتمال أنصبة الإشراف لمنسوبي القسم قبل إسناد الإشراف لمشرف من خارج الجامعة.\nرائه،#تولاقنام68 د معن ممه ءمادف 1 ١","a":["المادة الثامنة والثلاثون","المادة (5 4 ) من هذه اللائحة وقاعدها","المادة التاسعة والثلاثون"]},{"d":"bu1447","p":25,"l":"ar","t":"مقاذة ابعر اك لدي ل لم\nتوكالةالعم]إةةلشؤون :\nالمادة الأربعون:\nيضع مجلس الجامعة ضوابط المشرفين المساعدين على الرسائل العلمية، بناءً على اقتراح اللجنة الدائمة.\nالقاعدة التنفيذية للمادة الاربعين\n-١ يُسمح بترشيح مشرف مساعد للرسالة العلمية إذا اقتتضت طبيعة الموضوع ذلك, بناء على توصيّة مجلس القسم ووفقًا\nللمبررات المدعمة التي يقدمها المشرف الرئيسي: مع موافقة مجلس القسم والكلية.\n-٠ يجوز إضافة مشرف مساعد ثاني في مرحلة الدكتوراه إذا استدعت طبيعة الموضوع ذلككء بناءً على توصية مجلس القسم\nووفقًا للمبررات المدعمة التي يقدمها المشرف الرئيسي؛ مع تأييد مجلس الكلية واللجنة الدائمة للدراسات العليا.\n#- يُسمح للمشرف المساعد بالاستمراز في الإشراف على الرسالة العلمية خلال إجازة التفرغ العلمي أو أثناء فترة الندب\nأو الإعارة، وفقًا للأنظمة المعتمدة، وموافقة اللجنة الدائمة للدراسات العليا.\n4- يجوز للمشرف المساعد الاستمرار في الإشراف على الرسالة العلمية بعد انتهاء خدمته بالجامعة (بالتقاعد النظامي أو\nالمبكر أو انتهاء التعاقد)؛ شريطة موافقة مجلس القسم وتأييد مجلس الكلية واللجنة الدائمة للدراسات العليا.\nه- في حال عدم تمكن المشرف المساعد من الاستمرار في الإشراف على الرسالة (بسبب الإجازات أو الانتهاء من الخدمة\nأو لأي سبب آخر)؛ يتم ترشيح مشرف: مساعد بديل بناء على توصية من المشرف الرئيس، وموافقة مجلسي القسم\nوالكلية، ويتم رفع الطلب إلى اللجنة الدائمة للدراسات العليا لإقرار التغيير.\nالمادة الحادية والأربعون:\nيجوز لعضو هيئة التدريس الإشراف على رسائل علمية خارج جامعته - سواء داخل المملكة أو خارجها- بما لا يخل بواجباته\nالوظيفية، وفق ضوابط يقرها مجلس الجامعة, بناء على اقتراح اللجنة الدائمة.\nالقاعدة التنفيذية للمادة الحادية والأربعين\n-١ يجب التأكد من قبل مجلس القسم أن الالتزامات الخارجية للمشرف لا تتداخل مع أدوارهم الأساسية في الجامعة، تجنباً\nل \"تضارب الالتزامات.\"\n؟- يمكن للمشرف -سواء أكان منفرداً أو مشتركاً مع غيره - أن يشرف بحد أقصى على سبع رسائل , وبما لا يتجاوز 4\nرسائل دكتوراه.\n*- يجب على أعضاء هيئة التدريس الحصول على موافقة مسبقة من-الجامعة للإشراف على الرسائل العلمية بناءً على\nك6 توصية مجلسي القسم والكلية.\nلكة العربية السعودية. الباخة.ص ي(988)\nلإانوعءازمتاقطة8 © دك نالع نط ©3216 أ0مء 11","a":["المادة الأربعون","القاعدة التنفيذية للمادة الاربعين","المادة الحادية والأربعون","القاعدة التنفيذية للمادة الحادية والأربع"]},{"d":"bu1447","p":26,"l":"ar","t":"2 لك ولرقث العلمبي خاقهعم الناخ5 ع0 /01م6 لكا\n4- يُطلب من أعضاء هيئة التدريس الإفصاح عن أي تضارب محتمل في المصالح يتعلق بالعمل الخارجيء مثل الحوافز\nالمالية أو الانتماءات لمؤسسات أكاذيية أخرى.\nه- عدم تحمل الجامعة لأي تبعات مالية مرتبظة بالتزامات أعضاء هيئة التدزيس في الإشراف الخارجي.\n5- يجوز أن تكون مدة الإشراف محددة بفترة زمنية معينة، ويتطلب تمديدها موافقة إضافية بناءً على توصيات مجلسي\nالقسم والكلية.\nالمادة الثانية والأربعون:\nيقوم المشرف بتقييم أداء الطالب في نهاية كل فصل دراسيء وتحديد مدى تقدمه في الرسالة العلمية، وفقاً للآليات التي تقرها\nاللجنة الدائمة.\nالقاعدة التنفيذية للمادة الثانية والأرنعين\n-١ يقدم المشرف تغذية راجعة دورية بناءً على تقارير الطالب وعروضه ومسوداته؛ للتأكد من تحقيقه تقدم مرضيء وفق\nغماذج يحددها القسم العلمي\n؟\"- يتم الاستناد إلى تقارير التغذية الراجعة الدورية في إكمال تقرير عن التقدم البحثي في نحاية الفصل الدراسي وذلك\nخلال الاجتماع الحضوري الذي يجمع بين الطالب والمشرف.\n*- يشترك المشرف الرئيس والمشرف المساعد - إن وجد - في إعداد تقرير التقييم الفصلي لأداء الطالب في نهاية كل\nفصل دراسيء ويعباً النموذج المعد لذلك من قبل القسم العلمي ويسلم إلى رئيس القسم\n5- ترفع التقارير الفصلية لطلبة الدراسات العليا عن طريق رئيس القسم إلى اللجنة التنفيذية للدراسات العليا وذلك\nلاستمرار تسجيل الرسالة للفصل الدراسي التالي.\nالمادة الثالثة والأربعون:\nلا يقل عدد الطلاب المسجلين في الشعبة لمقرر بحث التخرج عن خمسة. طلابء ومجلس الكلية الاستغناء من الحد الأدنى،\nوفق ضوابط يقرها مجلس الجامعة: بناء على اقتراح اللجنة الدائمة.\nالقاعدة التنفيذية للمادة الثالثة والأربعين\nيجوز مجلس الكلية بناء على توصية مجلس القسم وإقرار مجلس الكلية الاستثناء من هذا العدد عند عدم اكتماله؛ أو عند\nاقتضاء طبيعة بحث التخر ج في بعض البرامج.\nلإانوىءنازومتاقطة8 © دك نالع اط © اءقاممء 1\n53.نالع.ناط","a":["المادة الثانية والأربعون","القاعدة التنفيذية للمادة الثانية والأرنع","المادة الثالثة والأربعون","القاعدة التنفيذية للمادة الثالثة والأربع"]},{"d":"bu1447","p":27,"l":"ar","t":"0 5-6 ال ل لاس ذاقههم النامك ع0 /ا0م6 لاما\nالمادة الرابعة والأربعون:\nإذا ثبت عدم جدية الطالب في مرحلة الرسالة العلمية، بناءً على تقرير المشرف على الرسالة العلمية؛ يتم إنذار الطالب\nنطاب من القسم المختصء وإذا أنذر الطالب مرتين ول يتلاف أسباب الإنذار يُلغى قيده؛ بناءً على توصية مجلسي القسم\nوالكلية.\nالقاعدة التنفيذية للمادة الرابعة والأربعين\n-١ يعد الطالب غير جاد في دراسته في إحدى الحالات التالية على سبيل المثال لا الحصر:\n<ا إذا انقطع الطالب عن التواصل مع مشرفه فصلاً كاملاً دون عذر مقبول.\n<ا إذا لم يعاسب إنجازه مع المدة التي أمضاها وفق تقرير المشرف مالم يكن هناك عذر مقبول.\n9- يتولى رئيس القسم العلمي المختص إنذار الطالب بخطاب سري بناء على تقرير من المشرف, ويحفظ التقرير في ملف\nالطالب، وتزود الإدارة التنفيذية بنسخة منه.\n*“- إذا لم يتلاف الطالب أسباب الإنذار بعد إنذاره مرتين في فصلين دراسيين، فتعرض حالته على مجلس القسمء فإن\nأوصى مجلس القسم بإلغاء القيد ترفع التوصية إلى اللجنة الدائمة.\nالمادة الخامسة والأربعون:\nيق للمشرف - سواء كان منفرداً أو مشتركاً مع غيره - أن يشرف بحد أقصى على سبع رسائل علمية في وقت واحدء\nوللجنة الدائمة الاستثناء من ذلكء بناءً على توصية مجلسي القسم والكلية، وفق ضوابط يقرها مجلس الجامعة بناءً على\nاقتراح اللجنة الدائمة.\nالقاعدة التنفيذية للمادة الخامسة والأربعين\n-١ يراعى التوزيع العادل للإشراف على الرسائل العلمية بين أعضاء هيئة التدريس بالقسم مع الأخذ في الاعتبار بالتخصص\nوالدرجة العلمية.\n؟- يطبق الحد الأقصى على الإشراف على الرسائل داخل القسم وخارجه.\nلانوعءأوتاقطة8 © وكدالة .نط ه6اء3أممء 1 أ .أ","a":["المادة الرابعة والأربعون","القاعدة التنفيذية للمادة الرابعة والأربع","المادة الخامسة والأربعون","القاعدة التنفيذية للمادة الخامسة والأربع"]},{"d":"bu1447","p":28,"l":"ar","t":"2 0 ع 0 ذاقههم اماك ع0 /ا0م6 لاا\nلسوؤون\n!؟ آذآ بببببببيببيبيببيبيببيبببإإييي يبب يج[ [آ[آ آ# #آ ك0\nالمادة السادسة والأربعون:\nبحسب نصاب الإشراف لعضو هيئة التدريس - سواء كان رئيساً أو مساعداً - على كل رسالة ضمن العبء التدريسي،\nوفق ضوابط يقرها مجلس الجامعة بناءً على اقتراح اللجنة الدائمة.\nالقاعدة التنفيذية للمادة السادسة والأربعين\n-١ تحسب ساعة واحدة لكل رسالة علمية في مرحلة الماجستير.\n؟٠- تحسب ساعتين لكل رسالة علمية في مرحلة الدكتوراه.\n#- تحسب ساعة واحدة للمشرف المساعد في كلا المرحلتين.\nالمادة السابعة والأربعون:\nيُقدم المشرف على الرسالة العلمية: بعد انتهاء الطالب من إعدادهاء تقريراً عن اكتمالها إلى رئيس القسم.ء مرفقاً به نسخة\nمن الرسالة العلمية؛ تمهيداً لاستكمال إجراءات المناقشة:؛ التي يحددها مجلس الكلية.\nالمادة الثامنة والأربعون:\nُكوّن جنة لمناقشة الرسالة العلمية بقرار من مجلس الكلية؛ بناءً على توصية مجلس القسم.\nالقاعدة التنفيذية للمادة الثامنة والأربعين\n-١ يشترط لتكوين ججنة المناقشة ما يلي:\nا صلاحية الرسالة للمناقشة بناء على تقرير المشرف.\nا .اجتياز طالب الماجستير والدكتوراه لكافة المقررات والاختبار الشامل (إذا اقتضى برنامج دراسته ذلك).\n<ا أن يكون تسليم المشرف للتقرير قبل فهاية المدة النظامية للطالب.\n؟- يجب الحصول على موافقة مبدئية من المرشح لعضوية لجنة المناقشة قبل التوصية بعضويته في اللجنة.\n*“- يقدم عضو لجنة المناقشة إلى رئيس القسم العلمي تقريراً عن الرسالة ينص فيه على صلاحية الرسالة للمناقشة أو\nعدمهاء على ألا تزيد مدة فحص الرسالة من قبل عضو جنة المناقشة عن شهر لرسالة الماجستير وشهرين لرسالة\nالدكتوراه من تاريخ تسلمها ويحق للقسم في حال تأخر المناقش عن المدة القصوى ترشيح مناقش بديل.\nم 4- يجب ألا تعجاوز المدة ما بين قرار مجلس الكلية بتكوين لجنة المناقشة للطآلب وعقد المناقشة أربعة أشهرَكحد أقصى.\n(82)988 20 مناد8-امة ,فاكفهعمْ المزيفك ع0 !)١/6001/ 0 يريج\nلإأنوعع/أوتاقحاة8 © هك نالع .ناط 6اعقأممء ل 6 ٠\n5.نالع.ناط","a":["المادة السادسة والأربعون","القاعدة التنفيذية للمادة السادسة والأربع","المادة السابعة والأربعون","المادة الثامنة والأربعون","القاعدة التنفيذية للمادة الثامنة والأربع"]},{"d":"bu1447","p":29,"l":"ar","t":"2 . فاع > ذاقخه8هم اللاةك ع0 /6001 كا\nالدراسات العليا واللبتعاث\nه- إذا تقرر عدم صلاحية الرسالة للمناقشة وعدم قبوها للتعديل بالإجماع فيطبق على الطالب ما ورد في البند (؟) فقرة\n(ج) من المادة (7). فإن لم يتحقق الإجماع فيحال الأمر إلى مجلس القسم لاتخاذ ما يراه مناسباً بشرط أن يكون\nتقرير عدم صلاحية الرسالة بالأغلبية المنصوص عليها في الفقرة (4) من المادة ٠( 8ه) من هذه اللائحة.\n5- يستكمل المشرف الرئيس نموذج تحديد موعد مناقشة الرسالة المعتمد من الإدارة التنفيذية؛ ويعتمده من رئيس القسم\nويعلن القسم عن موعد المناقشة مع تزويد الإدارة التنفيذية بنسخة منه.\n/ا- يصدر حكم اللجنة مباشرة بعد المناقشة.\nالمادة التاسعة والأربعون:\nيضع مجلس الجامعة ضوابط اختيار أعضاء لجان مناقشة رسائل الماجستير والدكتوراه وآلية إجراء تلك المناقشات, بناءً على\nاقتراح اللجنة الدائمة.\nالقاعدة التنفيذية للمادة التاسعة والأربعين\n-١ يجب أن تتكون اللجنة من ثلاثة أعضاء على الأقل (بما في ذلك المشرف وأي مشرف مشارك إن وجد) ولا تزيد عن\nخحمسة أعضاء.\n؟- يجب أن يكؤن رئيس اللجنة معيَّئًا في بزنامج الطالب. وني حالات: الإشراف المشترك على الأبحاث التي تتضمن '\nتخصصات في أكثر من برنامج.\n*- يجب ألا يشكل المشرف والمشرف المشارك (إن وجد) أغلبية في اللجنة.\n4 - يجب أن يكون في اللجنة على الأقل عضو واحد بدرجة أستاذ أو أستاذ مشارك؛ على الأقل لمرحلة الماجستير\nه- يمكن الاستعانة بالأساتذة المساعدون كمشرفين على أن يكون لدى العضو ما لا يقل عن بحثين منشورين في مجلات\n*- يجب على ججنة أطروحة الدكتوراه أن يكون أعضاء اللجنة بدرجة أستاذ أو أستاذ مشارك؛ أحدهم على الأقل بدرجة\n-٠ يجب أن يكون أعضاء اللجنة متخضصين في نفس مجال البحث أو في امجالات القريبة ذات الصلة؛ لضمان فهم\nكامل للموضوع وأبعاده العلمية.\n8- أن يكون أحد أعضاء اللجنة لمرحلة الدكتوراه من خارج الجامعة وليس لديه أي ارتباط حالي او سابق بالجامعة؛ ول\nيحصل على الدكتوراه منهاء ولا ينتمي لنفس جهة عمل الطالب\n4- يُشترط ألا يكون هناك تعارض مصالح بين عضو اللجنة والطالب (مثل العلاقات العائلية أو الشخصية القوية)،\n2 لضمان النزاهة والحيادية\nبزانوعء/توتافطة8© © دكسلع بط هءقامى 1 16 ١\nهك5.نالع.ناط","a":["المادة (7). فإن لم يتحقق الإجماع فيح","المادة ٠( 8ه) من هذه اللائحة.","المادة التاسعة والأربعون","القاعدة التنفيذية للمادة التاسعة والأربع"]},{"d":"bu1447","p":30,"l":"ar","t":"سعد ام لح عد و-- 1 01١1\nها وخالةا دة لشؤون التعليم 080 كتمع نامع عه 7807والزالر\n# الدراسات العليا والابتعاث وزارة النهليم\n- ألا يكون هناك نشر علمي مشترك بين المناقش والطالب خلال فترة دراسته بمرحلة الماجستير، ويستثنى من ذلك\nالمشرف والمشرف المساعد إن وجد.\n- يجب أن يحصل الطالب على موافقة مبدئية من المشرف الأكاديمي الرئيسي قبل تحديد موعد مناقشة الرسالة،\nويلزم استيفاء متطلبات التقديم الخاصة بالقسم.ء بما يشمل الالتزام بإرشادات الجامعة بخصوص ترتيب المحتوى،\nالاستشهادات, وترقيم الصفحات.\n7- يجب إرسال الرسالة إلى المناقشين قبل موعد المناقشة بما لا يقل عن ثلاثة أسابيع.\n-١ يعلن القسم.عن موعد المناقشة في الأماكن المخصصة داخل القسم والكلية، بالإضافة إلى القنوات الأخرى\nالمتاحة.\n-١ عقد مناقشة الرسائل بشكل علني, إلا إذا قرر مجلس الكلية: بناءً على توصية من القسمء أن تكون المناقشة\n6- لا يحوز عققد المناقشة أو البدء فيها في:غياب أي عضو من أعضاء اللجنة. وفي حال حدوث ذلكء يقوم مقرر\nاللجنة بإبلاغ رئيس القسم لتحديد موعد جديد للمناقشة؛ على أن يتم اعتماد الموعد الجديد من القسم وعميد\nالكلية.\n- في حال اعتذار أحد أعضاء لجنة المناقشة أو انسحابه, يتم ترشيح عضو بديل بناءً على توصية مجلس القسم\nوموافقة مجلس الكلية؛ مع إرفاق أسباب الاعتذار ضمن الطلب.\n-١7 بعد انتهاء المناقشة العلنية، تعقد اللجنة اجتماعًا مغلقًا (بدون حضوز الطالب أو الحضور العام) لتقييم الرسالة\nوالاتفاق على القرار النهائي.\n- تتخذ اللجنة قرارها النهائي بالإجماع أو بأغلبية الأعضاء ويشمل القرار أحد الخيارات التالية:\n** :إجازة الرسالة دون تعديلات: :في حال كانت الرسالة مستوفية لجميع المتطلبات.\n** إجازة الرسالة مع تعديلات بسيطة :إذا كانت التعديلات المطلوبة شكلية أو محدودة.\n* إجازة الرسالة بعد تعديلات جوهرية :في حال كانت التعديلات المطلوبة ضرورية وأساسية.\n** رفض الرسالة :إذا لم تكن الرسالة تلبي المعايير الأكاديمية المطلوبة.\nالمادة الخمسسون:\nتعد لجنة المناقشة تقريراً يُوقع من جميع أعضائهاء يُقدم إلى رئيس القسم خلال أسبوع من تاريخ المناقشة متضمناً إحدى\nالتوصيات الآتية:\nور -١ قبول الرسالة العلمية والتوصية بمنخ الدرجة.\nبإانىمء تناه طة8 © دكنالء اط ه36 أممء 31\n5.نالع.ناط","a":["المادة الخمسسون"]},{"d":"bu1447","p":31,"l":"ar","t":"-٠ قبول الرسالة العلمية مع إجراء بعض التعديلات: دون مناقشتها مرة أخرىء وِيُفوّض أحد أعضاء لجنة المناقشة\nبالتوصية بمنح الدرجة بعد التأكد من الأخذ بمذه التعديلات في مدة لا تتجاوز ثلاثة أشهر من تاريخ المناقشة،\nومجلس الكلية الاستثناء من ذلك على ألا يتجاوز ستة أشهر من تاريخ المناقشة.\n#- استكمال أوجه النقص في الرسالة العلمية، وتُعيد اللجنة مناقشتها خلال الفترة التي يحددها مجلس الكلية: بناءً على\nتوصية مجلس القسم المختص. على ألا تزيد عن سنة واحدة من تاريخ المناقشة.\n4- عدم قبول الرسالة العلمية.\nولكل عضو من جنة المناقشة على الرسالة العلمية الحق في أن يقدم ما لديه من مرئيات مغايرة أو تحفظات في تقرير منفصل\nإلى رئيس القسم في مدة لا تتجاوز أسبوعاً من تاريخ المناقشة, ويُرفع إلى عميد الكلية مع تقرير مجنة المناقشة.\n-١ تكون إعادة مناقشة الرسالة لمرة واحدة فقط.\n؟- تحسب الدرجة بمتوسط الدرجات الممنوحة من الأعضاء على ألا تقل عن (75) في حال التوصية بقبول الرسالة ومنح\nالدرجة.\n'#- لا يعد إعلان نتيجة المناقشة منحاً للدرجة.\n4- إذا انخفض معدل الطالب التراكمي بعد مناقشة الرسالة عن (7,98 من 4) فيمنح فرصة إضافية لرفع معدله إذا لم\nيسبق منحه هذه الفرصة من قبل؛ مع مراعاة ما ورد في المادة الثامنة والعشرين وقواعدها التنفيذية.\nه- يرفع تقربر المناقشة مع توصية مجلس القسم العلمي بمنح الدرجة.\nالمادة الحادية والخمسون:\n-١ يُصرف للمشرف على رسالة الماجستير من خارج الجامعة مكافأة مقطوعة مقدارها )5:٠٠( خمسة آلاف ريال،\nكما يصرف للمشرف على رسالة الدكتوراه من خارج الجامعة مكافأة مقطوعة مقدارها )٠٠٠( سبعة آلاف ريال.\n؟- يجوز إذا استدعى الأمر مقابلة الأستاذ المشرف الخارجي للطلبة المشرف عليهم وبموافقة اللجنة الدائمة، بناءً على\nطلب من الجامعة التي يتبع ها الطالب انتداب المشرف الخارجي على رسائل الماجستير أو الدكتوراه، وفق ما يلي:\nأ- ألا يتجاوز مرتين في كل عام دراسي لكل جامعة خارجية يشرف على رسائل طلبة فيها.\nب- ألا يتجاوز عدد الجامعات التي ينتدب ها جامعتين في كل عام دراسي.\nج- ألا تتجاوز مدة الانتداب في كل مرة ثلاثة أيام.\n4 د ألا يتجاوز مجموع أيام الانتداب عشرة أيام في العام الدراسي لجميع الجامعات.\n53.نالع.ناط","a":["المادة الثامنة والعشرين وقواعدها الت","المادة الحادية والخمسون"]},{"d":"bu1447","p":32,"l":"ar","t":"ه- تتحمل الجامعة المستفيدة نفقات عضو هيئة التدريس المنتدب للإشراف على رسائل طلبتها وفق ما هو مقرر\n- للجامعة تعديل المكافأة المقطوعة المشار إليها في الفقرة )١( من هذه المادة بعد صدور قرار بالموافقة من مجلس\nشؤون الجامعات.\nالقاعدة التنفيذية للمادة الحادية والخمسين\n-١ تشمل المكافأة المشرف الرئيس والمشرف المساعد من خارج الجامعة.\n؟- يشترط للحصول على مكافأة الإشراف اكتمال الرسالة بموجب تقرير اكتمالهاء وتصرف المكافأة بعد رصد درجة\nالرسالة على النظام الإلكتروني بالجامعة.\nالمادة الثانية والخمسون:\nيصرف لمن يشترك في مناقشة رسالة ماجستير أو ذكتوراه مكافأة مقطوعة مقدارها )١١٠١٠( ألف ريال إذا كان المناقش\nعضواً في هيئة التدريس بنفس الجامعة التي تقدم لها الرسالة.\nأما إذاكان المناقش من غير أعضاء هيئة التدريس في الجامعة التي تناقش فيها الرسالة سواء كان من موظفي تلك الجامعة, أو\nمن يُدعى من خارجها؛ فتصرف له مكافأة مقطوعة مقدارها )١6٠٠( ألف وخمسمائة ريال، لمناقشة رسالة الدكتوراه\nو(١٠٠٠) ألف ريال لمناقشة رسالة الماجستير, وتزاد المكافأة لتصبح (. ٠ 5 ؟١) ألفين وخمسمائة ريال إذا كان المناقش من\nخارج المملكة.\nوإذا كان المناقش من خارج المدينة التي بما مقر الجامعة التي تناقش فيها الرسالة سِواء كان من داخل المملكة أو خارجها\nفيصرف له بالإضافة إلى المكافأة المشار إليها أعلاه تذكرة إركاب من مقر إقامته وإليه وأجرة السكن المناسب والإعاشة بحد\nأقصى لا يتجاور ليلتين، كما تصرف تذكرة إركاب لرافق المناقش إذا كان المناقش كفيفاً. ومحرم المناقشة بالإضافة إلى أجرة\nالسكن المناسب بحد أقصى لا يتجاوز ليلتين:\nويجوز للجنة الدائمة إضافة ليلة أو ليلتين في حالات الضرورة, وإذا ما اقتضت ذلك طبيعة الدراسة، وذلك بناء على توصية\nمن مجلسي القسم والكلية المختصين مع إيضاح المبررات للبقاء مدة تزيد عن ليلتين.\n2 وللجامعة تعديل المكافأة المقطوعة المشار إليها في هذه المادة بعد صدور قرار بالموافقة من مجلس شؤون الجامعات.\n001007 مدع لغ مغلم لازي لعا لاسبعرا 1 ا\nلإاندمعنازمتاقطة8 © مك نالع نط © اءقاممىء ا\nد5.نالع.ناط","a":["المادة بعد صدور قرار بالموافقة من مج","القاعدة التنفيذية للمادة الحادية والخمسي","المادة الثانية والخمسون","المادة بعد صدور قرار بالموافقة من مج"]},{"d":"bu1447","p":33,"l":"ar","t":"اع هف ب له وج اي 0\nا وكالة العماآدة لشؤون\nالدراسات العليا والذبتعات\nالقاعدة التنفيذية للمادة الثانية والخمسين\n-١ يتم رفع طلب صرف المكافأة المقررة نظاماً لمناقشة رسالة الماجستير أو الدكتوراه من الكلية المعنية إلى الجهة المختصة\nبالجامعة ويشمل أسماء المستحقين لصرف مكافأة لجنة المناقشة (المشرف - مساعد المشرف إن وجد - المناقش\nالداخلي > المناقش الخارجي) .\n-٠ إذا كان المناقش من خارج المدينة التي بما مقر الجامعة التي تناقش فيها الزسالة سواء كان من داخل المملكة أو خارجها\nيحق للجامعة أن تقرر طبيعة المناقشة حضوري او عن بعدء\n*- إذا كانت المناقشة عن بعد بُصرف فقط المكافأة المقررة للمناقش الخارجي بحسب المادة الثانية والخمسون.\nالفصل الحادي عشر: التخرج ومنح الدرجة\nالمادة الثالثة والخمسون:\nيرفع رئيس القسيم المختص تقرير لجنة المناقشة إلى عميد الكلية في مدة لا تتجاور أسبوعين من تاريخ المناقشة؛ لرفعه إلى\nالإدارة التنفيذية.\nالمادة الرابعة والخمسون:\nيتخرج الطالب بعد إتماء متطلبات التخرج ببجاح حسب خطة البرنامج، على ألا يقل معدله التراكمي عن المعدل الذي\nيحدده مجلس الجامعة لكل برنامج؛ على ألا يقل في كل الأحوال عن تقدير (جيد جداً).\nالقاعدة التنفيذية للمادة الرابعة والخمسين\n-١ يتخرج الطالب بعد إنماء كافة المتطلبات وفق الخطة الدراسية المعتمدة على ألا يقل معدله التراكمي عن (78,؟) من\n(4) وتقدير جيد جدًا.\n؟- مجلس الكلية بناءً على توصية مجلس القسم تحديد مقررات دراسية يدرسها الطالب لرفع معدله في حال نجاحه في\nالمقررات وعدم تحقيقه المعدل المحدد للتخرج مع مراعاة ما ورد في المادة (4؟).\nلكة العربية السيعود ل ) اب(1988) 33\nاسطتدوة؟ مم ميم فاقفهم 6 0 ا 4 د\nلإانعىعازمتاقطة8 © هك نالع .ناط 6ا013ء 0 1\n53.نالع .ناط","a":["القاعدة التنفيذية للمادة الثانية والخمسي","المادة الثانية والخمسون.","المادة الثالثة والخمسون","المادة الرابعة والخمسون","القاعدة التنفيذية للمادة الرابعة والخمسي","المادة (4؟)."]},{"d":"bu1447","p":34,"l":"ar","t":"عمادة الأبتكااهزنبحت القلمى المملكة.العربية السعودينة\nلظ وكتالة 1 أدة تحؤوه ذاقفهثم الالاذدك 08 /6001لذاكا\nالدراسات العليا والابتعاث 1 0 م 0\nلأ8 2« جامعة اباحة ا7ادععلاللانا منطم8حام ا 9\nالمادة الخامسة والخمسون:\nفي حال وفاة الطالب قبل تمكنه من المناقشة يمنح الدرجة، وفق ضوابط يقرها مجلس الجامعة بناءً على اقتراح اللجنة الدائمة.\nالقاعدة التنفيذية للمادة الخامسة والخمسين\n١-الا يكون قد صدر بحقة قرارات تأديبية خلال مدة دراسته\n؟-الا يكون مطوي:قيده بسبب انخفاض المعدل\n“يجب أن يكون الطالب قد اقترب من استيفاء متطلبات الحصول على الدرجة، حيث يكون قد أكمل جزءًا كبيرا من\nرسالته أو أغلب المقررات الدراسية.\n4 -توصية مجلسي القسم والكلية على منح الدرجة العلمية، وتوصية اللجنة الدائمة للدراسات العليا.\nالمادة السادسة والخمسون:\nيرفع النائب أو الوكيل المختص التوصية بمنح الدرجة العلمية إلى مجلس الجامعة؛ لاتخاذ القرار.\nالقاعدة التنفيذية للمادة السادسة والخمسين\n-١ يرفع النائب أو الوكيل المختص بناءً على توصية مجلسي القسم والكلية وتأييد اللجنة الدائمة إلى مجلس الجامعة بمنح\nالدرجة العلمية خلال فصل دراسي من إتمام متطلبات التخرج.\n؟- لا يعد الطالب متخرجًا إلا بعد موافقة مجلس الجامعة على منحه الدرجة العلمية.\nالفصل الثاني عشر: أحكام عامة\nالمادة السابعة والخمسون:\n-١ مع عدم الإخلال بما ورد في التصنيف والإطار، ووفق ضوابط يقرها مجلس الجامعة: بناءً على اقتراح اللجنة الدائمة,\nمجلس الجامعة بناءً على تأييد من النائب أو الوكيل المختص وتوصية مجلسي القسم والكلية منح الطالب:\nأ- درجة دبلوم عالي عند اجتيازه عدداً من مقررات برنامج الماجستيرء دون أن تكون بمجموعها مؤهلة لحصوله على\nدرجة: الماجستير.\nب- درجة الماجستير عند اجتيازه عدداً من مقررات برنامج الدكتوراه، ذون أن تكون بمجموعها مؤهلة لحصوله على\nو درجة الدكتوراه.\nبرانوعءازومناهطة8 © دكنالع .نط 6اءعهأممء لذ زه\nدك5.نالع.ناط","a":["المادة الخامسة والخمسون","القاعدة التنفيذية للمادة الخامسة والخمسي","المادة السادسة والخمسون","القاعدة التنفيذية للمادة السادسة والخمسي","المادة السابعة والخمسون"]},{"d":"bu1447","p":35,"l":"ar","t":"0 : 6ه ذاقفعقكم الالاذظدك 08 /6001/١اكا\nوكالة العماوة! ؤون 5\n© الذرزاسات العليا ##ينتفاث وزارة لتعليم 08 7معبامع عه لاسوالاالا\nلا8 جامعة الباحة 85117علاالانا هااه8- الهم جالع اباك اانا مام\n؟- مع عدم الإخلال بما ورد في الفقرة )١( من هذه المادة؛ للإدارة التنفيذية بناءً على توصية مجلسي القسم والكلية\nمنح الطالب ما يُثبت اجتيازه عدداً من مقررات الدراسات العليا دون أن تكون بمجموعها مؤهلة لحصوله على\nدرجة علمية؛ وفق ضوابط يقرها مجلس الجامعة بناءً على اقتراح اللجنة الدائمة.\nالقاعدة التنفيذية للمادة السابعة والخمسين\n-١ يجب إكمال مالا يقل عن 4 ؟ ساعة معتمدة من المقررات الدراسية لمرجلة الماجستير\n؟- وأن يكون منتظماً في البرنامج لمدة لا تقل عن سنة دراسية\n*- أن تكون المقررات من مقررات المستوى السادس وفق الإطار الوطني: المقررات الأساسية المطلوبة\n0-4 ضمن برنامج الماجستير.\nه- يجب على الطالب الحصول على معدل تراكمي لا يقل عن جيد\n5- أن يقدم الطالب ظلباً رسمياً للحصول على الدبلوم العالي، والذي قد يتضمن تقديم السجلات الأكادعية وملء غماذج\nتقديم تحددها الإدارة التنفيذية بالدراسات العليا.\n-٠ بمنح الطالب درجة الماجستير عند اجتيازه عدداً من مقررات برنامج الدكتوراه، دون أن تكون بمجموعها مؤهلة لحصوله\nعلى درجة الدكتوراه.\n8- يجب إكمال ما لا يقل عن 7” ساعة معتمدة من المقررات الدراسية لمرحلة الدكتوراه.\n9- وأن يكون منتظما في البرنامج لمدة لا تقل عن سنتين دراسية.\n-٠ أن تكون المقررات من مقررات المستوى (السادس) على الأقل، وتشمل المقررات الأساسية المطلوبة للحصول على\nدرجة ا ماجستير.\n١ يجب على الطالب الحصول على معدل تراكمي لا يقل عن جيد جداً:\n؟- أن يقدم الطالب ظلباً رسمياً للحصول على ال ماجستير، والذي قد يتضمن تقديم السجالات الأكاديعية وملء نماذج\nتقديم تحددها الإدارة التنفيذية بالدراسات العليا\n-١ أن يقدم الطالب طلباً رسمياً للحصول على ما يُثبت اجتيازه عدداً من مقررات الدراسات العليا دون أن تكون\nبمجموعها مؤهلة لحصوله على درجة علمية، وفق ضوابط يقرها مجلس الجامعة بناءً على اقتراح اللجنة الدائمة.\n-١ 4 ألا يكون قد صدر بحقة قرارات تأديبية خلال مدة دراسته.\nبإأأىمء/أولاةلاة8 © دك5.نالع.ناط نهاءة أامء ! 18 !|\n53.الع.ناط","a":["المادة؛ للإدارة التنفيذية بناءً على ","القاعدة التنفيذية للمادة السابعة والخمسي"]},{"d":"bu1447","p":36,"l":"ar","t":"اخ 9 ا ب عي\" فاقظ فم الاذد 08 6001 (اكا\nالدراسات العليا والاآبتعاث\nالحادة الشامفد والخعسون.:\nفي حال حصول الطالب على الدرجة العلمية ذاتًا من مؤسستين تعليميتين في إطار برنامج مشترك يجوز أن تصدر وثيقة تخرج\nمشتركة بين المؤوسستين التعليميتين، أو وثيقة تخرج مستقلة من إحدى أو كلتا المؤوسستين التعليميتين، ويحدد مجلس الجامعة\nالضوابط والإجراءات المنظمة في ذلك بناءً على اقتراح من اللجنة الدائمة.\nالقاعدة التنفيذية للمادة الثامنة والخمسين\n١-يجب على المؤسسات وضع اتفاقيات رسمية تحدد الأدوار والمسؤوليات وآلية إدارة برنامج الدرجة المشتركة.\n؟-تشمل هذه الاتفاقيات سياسات تحويل الساعات الدراسية؛ والرسوم الدراسية، وخدمات دعم الطلاب.\n#-يجب أن يتوافق البرنامج مع معايبر الاعتماد والمتطلبات القانونية في كل دولة توجد يما المؤسسات المشاركة.\nالمادة الشاسعة والشمسون:\nيستثنى من أحكام هذه اللائحة الدبلومات الصحية والزمالات الصحية؛ فيطبق عليهما اللوائح والقواعد الصادرة من مجلس\nالجامعة.\nالمادة الستون:\nيقر مجلس كل جامعة القواعد التنفيذية لهذه اللائحة.\nالمادة الحادية والستون:\nما لم يرد فيه نص خاص في هذه اللائحة يُطبق بشأنه نظام مجلس التعليم العالي والجامعات الصادر بالمزسوم الملكي رقم (م/8)\nوتاريخ 4 4١ ١ه للجامعات المشمولة بتطبيق هذا النظام؛ ونظام الجامعات الصادر بالمرسوم الملكي رقم (م/7؟) وتاريخ\n١ه للجامعات المشمولة بكذا النظام؛ ولوائحهماء والأنظمة واللوائح والقرارات المعمول جما في المملكة.\nالمادة الثانية والستون:\nتحل هذه اللائحة محل اللائحة الموحدة للدراسات العليا في الجامعات الصادرة بقرار مجلس التعليم العالي رقم(411//5/7١)\nوتاريخ 5 امه وتلغي ما يتعارض معها من أحكام.\nالمادة الثالثة والستون:\nمجلس شؤون الجامعات تفسير هذه اللائحة.\nالمادة الرابعة والستون:\n2 يُعمل بمذه اللائحة اعتبارا من تاريخ بداية العام الدراسي 5 أآه.\nناندع اتمتاقطة8© يا دكنلع نط هاءقامى ا\nهك5نالع.ناط","a":["القاعدة التنفيذية للمادة الثامنة والخمسي","المادة الشاسعة والشمسون","المادة الستون","المادة الحادية والستون","المادة الثانية والستون","المادة الثالثة والستون","المادة الرابعة والستون"]},{"d":"buguide","p":1,"l":"ar","t":"0ا68 لا أكرع ارلا حطج8-ام\nاخ . حتاشس لساطشاهرة_ جد 91111\nاللائحة المنظعة للدر اسات العهليا :\nفي الجامعات والقواعد ١1\nوحدة الإدارة التنفيخية للدراسات العليا","a":[]},{"d":"buguide","p":2,"l":"ar","t":"0ا68 لاأونع/أولا قطدت8-ام\nالفصل السابع\nتتولى الادارة التنطيذيت تنفيذ الإجراءات الأكاديميت؛ بما في ذلك قبول الطلاب وتسجيلهم:\nوفق أحكام هذه اللائحتّ والضوابط المقرة من مجلس الجامعير.\n-١ تتولى الإدارة التنفيذية للدراسات العليا تطبيق شروط القبول المقرة من مجلس الجامعة: وعلى الأقسام\nالعلمية التأكد من استيفاء كل متقدم للشروط.\n؟- تتولى الإدارة التنفيذية اعتماد إعلان نتائج القبول النهائي.\n- تتولى الإدارة التنفيذية بالتنسيق مع الأقسام العلمية وعمادة القبول والتسجيل تسجيل المقررات وإصدار\nالجداول الدراسية.\n؛- يشترط تقديم طلب القبول ببرامج الدراسات العليا خلال الأوقات المحددة من الإدارة التنفيذية والمعلنة\nفي الموقع الرسجمي.\nمع مراعاة ما ورد في المادة (الخامستّ عشرة) من هذه اللائحت، يجوز قبول الطالب في غير مجال\nتخصصه بناء على توصيتّ من مجلس القسم المختص؛ وموافقيّ من مجلس الكلين.\nعلى الأقسام العلمية الراغبة في قبول الطلاب في غير مجال تخصصاتهم تحديد التخصصات التي يمكنهم القبول\nفيها بدقة وتحديد المقررات التكميلية المطلوب اجتيازها.\nللقسم المختص أن يشترط لقبول الطالب في مرحلتي الماجستير والدكتوراه اجتياز عدد من\nالمقررات التكميليت من مرحلتّ سابقت: أو تجاوز اختبار نواتج تعلم متصلت بها؛ ليصبح الطالب\nمؤهلا للالتحاق بالبرنامج؛ وفق ضوابط تقرها اللجن” الدائمت؛ بناء على اقتراح من مجلس القّسم\nوتأييد من مجلس الكليت.","a":["المادة (الخامستّ عشرة) من هذه اللائح"]},{"d":"buguide","p":3,"l":"ar","t":"0ا68 لاأونع/أولا قطدت8-ام\nالفصل السابع\nالقاعدة التنة ذية ١ ة ال اب 4 0 3\nتقر اللجنة الدائمة الضوابط اللازمة لاجتياز المقررات التكميلية بناءً على اقتراح مجلس القسم وتأييد\nمجلس الكلية.\nيجوز قبول التحاق الطالب ببرنامجين للدراسات العليا في وقت واحد؛ على أن يكون البرنامجان\nمن نفس المرحلت أومن مرحلت سابقت؛ وفق ضوابط يقرها مجلس الجامعت؛ بناء على توصي\nاللجنتّ الدائمي.\nيجوز معادليّ مقررات دراسي سيق للطالب اجتيازها في جامعة أو مؤسست تعليميتّ داخل\nالمملكة؛ أومن خارج المملكت3 على أن تتكون مرخصت من جه الاختصاص في بلد الدراست،\nبناء على توصيت مجلس القسمء وموافقت من مجلس الكليت؛ وتثبّت المقررات الدراسينّ الني تم\nمعادلتها في السجل الأكاديمي للطالب؛ ويحدد مجلس الجامعتّ الضوابط المنظمت3 لذلك؛ بما\nفيها إمكانيت احتسابها ضمن المعدل التراكمي للطالب في سجله الأكاديمي.\nالقامدة التفينية اماد التاسعة مشرة\nيوز احتساب عدد الوحدات الدراسية التي درسها الطالب طبقا للآقي:\n-١ ألا يكون قد مضى على دراسته للوحدات المعادلة أكثر من ثلاثة سنوات دراسية.\n؟- أن تكون مفردات المقررات متشابحة أو متكافئة بما لا يقل عن ٠١ م9.\n+- ألا يقل تقديره في الوحدات المعادلة عن (جيد جداً).\n- لا تحتسب الوحدات المعادلة ضمن المعدل التراكمي إذا كانت من خارج الجامعة ويجوز احتسابجا إذا\nكانت من داخل اجامعة.\nتكون المعادلة بتوصية من مجلس القسم الذي يتبع له المقرر وموافقة مجلس الكلية.\nيجوز بموافق3 مجلس القسم المختص وعميد الكليت تأجيل الطالب قبوله؛ ويكون لمرة\nواحدة؛ ولا يمكن قبول التأجيل بعد بدء الطالب دراسته؛ وفق ضوابط يقرها مجلس الجامعيض،\nبناء على اقتراح اللجنتّ الدائمن-","a":[]},{"d":"buguide","p":4,"l":"ar","t":"لا8 لاأأورع الملا قطج8-ام\nتقترزح اللجنة الدائمة آليات وضوابط تأجيل القبول وترفع توصيتها مجلس الجامعة.\nمع مراعاة ما يصدر من مجلس شؤون الجامعات من قرارات، يجوز أن تتقاضى الجامعت،\n-١ رسوماً دراسيت أو مقابلأ مالياً؛ لتقديم برامج أو مقررات الدراسات العلياء على أن تكون\nتلك البرامج حاصلت على الاعتماد البرامجي؛ وبعدد طلاب لا يتجاوز عدد الطلاب\nالمقبولين - لنضس البرامج أو المقررات- بدون رسوم أو مقابل مالي؛ ويضع مجلس\nالجامعت الضوابط المنظم3 لذلك: بناء على توصيتٌّ من اللجنيّ الدائمش.\n\"- مابلا ماليآ للخدمات المرتبطت بالدراسات العليا والمساندة لهاء وفق ضوابط يقرها\nمجلس الجامعت: بناء على توصيّ اللجنت الدائم2-\nتقترح اللجنة الدائمة آليات تحديد المقابل المالي - إن وجد - لبرامج الدراسات العليا والخدمات المرتبطة\nبالدراسات العليا والمساندة لها وترفع توصياتًا مجلس الجامعة.","a":[]},{"d":"buguide","p":5,"l":"ar","t":"لا8 /اأورع لوملا قطد8-ام\nالفصل الثامن\nيجوز للطالب تأجيل الدراسة بتوصيت من مجلس القسم المختص وموافقتّ مجلس الكليت؛ وفق\nضوابط يقرها مجلس الجامعت؛ بناء على اقتراح اللجنيّ الدائم2-\nيجوز للطالب الاعتذارعن الاستمرارفي دراس” مقرر أو أكثر؛ أو جميع مقررات الفصل الدراسي،\nوذلك بعد انتهاء فترة التسجيل؛ بتوصيت من مجلس القسم المختص، وموافق7 من عميد\nالكليتّ؛ وفق ضوابط يقرها مجلس الجامعت بناء على اقتراح اللجنتّ الدائمت.\nإذا انسحب طالب الدراسات العليا من الجامعت ثم أراد الالتحاق بها مجددآ يجوز للجامعة أن تطبق\nعليه شروط القبول وقت التقديم الجديد.\nيعد الطالب منقطعاً عن الدراسة إذا لم يسجل خلال المترة المحددة للتسجيل في كل فصل\nدراسي متاح له التسجيل فيه.\n١ يُِلفَى قيد الطالب شي الحالات الآتيتّ:\nأ- إذا انقطع عن الدراست، وفقاً لأحكام المادة (الخامستّ والعشرين) من هذه اللائحت.\nب- إذا لم يجتز المقررات التكميليت: وفق الضوابط التي تقرها اللجننّ الدائمت.\nج- إذا انخفض معدله التراكمي عن تقدير (جيد جدآ) في فصلين دراسيين متتاليين.\nد-إذا اتضح أن قبوله مبني على تقديمه معلومات أو وثائق غير صحيحتّ كلياً أو جزئياً.\nه- إذا لم يحصل على الدرجت العلميتّ خلال المدة المحددة للبرنامج.\n--١ يلفى قيد الطالب بقرار من اللجنتّ الدائمت؛ بناء على توصي مجلس القسمء وتأييد\nمن مجلس الكليتّ في الحالات الآتين:","a":["المادة (الخامستّ والعشرين) من هذه ال"]},{"d":"buguide","p":6,"l":"ar","t":")8 /اأومع/اأصلنا قطد8-ام\nالفصل الثامن\nأ- إذا ثبت عدم جديته في مرحلت الرسالت العلميتّ وفقاً لأحكام المادة (الرابعي\nوالأربعين) من هذه اللائحة.\nب-إذا لم يجتز الاختبار الشامل بعد السماح له بإعادته مرة واحدة.\nج- إذا قررت لجن الحكم على الرسالت العلميتّ عدم صلاحيتها للمناقشت؛ أو عدم\nقبولها بعد المناقشت.\nد- إذا أخل بالأمانتّ العلميتّ سواء في مرحلتّ دراسته للمقررات، أو خلال إعداده للرسال2\nالعلميت: أو أخل بالأنظمة: أو اللوائح؛ أو القرارات ذات العلاق2.\nتعولى الإدارة التنفيذية إجراءات إلغاء القيد في الحالات الواردة في البند .)١(\nيجوز إعادة قيد الطالب الذي ألغي قيده إذا كان الحائل دون مواصلت دراسته ظروفاً يقبلها مجلسا\nالقسم والكليت؛ وتكون إعادة القيد بقرار من اللجنتّ الدائمتّ مع مراعاة ما يأتي:\n-١ الطالب الذي مضى على إلغاء قيده أكثر من ثلاثيّ أعوام دراسيت؛ يُعامل معامليّ الطالب\nالمستجد من حيث إعادة دراست المقررات؛ بصرف النظر عمًا أنجزه سابقاً من مرحلت الدراست،\nولمجلس الجامعت الاستثناء من ذلك؛ وفق ضوابط تصدر من مجلس الجامعت بناء على اقتراح\nمن اللجنتّ الدائمثش.\n\"- الطالب الذي مضى على إلغاء قيده ثلاثيّ أعوام دراسية أو أقل؛ يُعيد دراسيّ بعض المقررات\nالتي يحددها له مجلس القسمء ويوافق عليها مجلس الكليتّ؛ وتحسب الوحدات التي درسها\nبعد استثنافه الدراست ضمن معدله التراكمي؛ كما تحسب المدة التي قضاها الطالب في\nالدراست قبل إلغاء قيده ضمن المدة القصوى للحصول على الدرجي.\nالقاعدة التنفيذية للمادة السابعة والعشرين\nتقترح اللجنة الدائمة ضوابط إعادة القيد وترفع توصيتها مجلس الجامعة لإقرارها.","a":["المادة (الرابعي","القاعدة التنفيذية للمادة السابعة والعشري"]},{"d":"buguide","p":7,"l":"ar","t":"0ا68 لاأونع/أولا قطدت8-ام\nالفصل الثامن\nلمجلس الكليت؛ استثناء من الفقرة (ج) من البند )١( من المادة (السادست والعشرين) من هذه\nاللائحت، منح الطالب فرصت استثنائيت واحدة، لا تزيد على عام دراسي كحد أعلى؛ بناء على\nتوصيتّ مجلس القسم.\n-١ المجلس القسم أن يُوصي بمنح الطالب فرصة لا تزيد على سنة دراسية: لرفع معدّله التراكمي إذا كان\n؟- يجوز إعادة دراسة مقرر أو أكثر ثما حصل فيه الطالب على تقدير (جيد مرتفع): لرفع معدّله التراكمي\nإلى (جيد جدا).\n+- رفع توصية مجلس القسم مرفقة بتقرير الموجه العلمي والسجل الأكاديمي للطالب إلى مجلس الكلية\nللنظر واتخاذ التوصية المناسبة.\n؛- ترفع طلبات الفرصة الإضافية إلى الإدارة التنفيذية لتنفيذها في نظام الخدمات الإلكترونية المعتمدة في\nالجامعة.\nللجنت الدائمت؛ استثناء من الطقرة (ه) من البند )١( من المادة (السادس” والعشرين) من هذه\nاللائحت؛ منح الطالب فرصت استثنائي3 لا تزيد على عام دراسيء بناء على تقرير من المشرف،\nوتوصييّ مجلسي القسم والكلين.\n-١ يتقدّم الطالب إلى القسم بطلب فرصة إضافية: لإتمام متطلبات الحصول على الدرجة العلمية.\n؟- يُقدّم المشرف لرئيس القسم المختصء تقريراً مفصلاً عن سير الطالب الدراسي مقترحاً مدة الفرصة\nالإضافية.\n+- تتولى الإدارة التنفيذية دراسة الطلبات والرفع بما إلى اللجنة الدائمة.\nمع مراعاة المادة (الخامسّ عشرة) من هذه اللائحت، للإدارة التنطيذيت قبول تحويل الطالب إلى\nالجامعءت من جامعت أو مؤسست تعليمي داخل المملكة أو من خارجها على أن تكون مرخصة3 من","a":["المادة (السادست والعشرين) من هذه","المادة (السادس” والعشرين) من هذه","المادة (الخامسّ عشرة) من هذه اللائحت"]},{"d":"buguide","p":8,"l":"ar","t":")8 /اأومع/اأصلنا قطد8-ام\nجهت الاختصاص في بلد الدراست، على ألا يكون مفصولا منها لأيّ سبب من الأسباب، بناء على\nتوصيت مجلسي القسم والكليت. وتثبت المقررات الدراسيت التي تم معادلتها في السجل\nالأكاديمي للطالب، ويحدد مجلس الجامعتّ الضوابط المنظمت في ذلك،: بما فيها إمكانير\nاحتسابها ضمن المعدل التراكمي للطالب في سجله الأكاديمي.\nالقاعدة التنفيذية للمادة الثلاثين\nيكون التحويل إلى الجامعة وفق ما يلي:\n-١ أن يكون الطالب قد اجتاز فصلاً دراسياً على الأقل: ولا يقبل تحويل الطالب المستجد.\n؟- إرفاق ما يثبت قبوله وانتظامه في الجامعة المحول منها.\n+- إرفاق نسخة معتمدة من السجل الأكاديمي.\n+- إرفاق وصف تفصيلي معتمد لمفردات المقررات التي درسها الطالب.\nد إذا كانت الجامعة المحول منها من خارج المملكة فلابد أن تصدق الوثائق من الملحقية الثقافية\nوالقنصليات السعودية.\n+- يجوز إضافة ضوابط أخرى تشترطها الإدارة التنفيذية.\nيجوز تحويل الطالب من برنامج إلى آخر داخل الجامعت؛ بناء على توصيتّ مجلس القسم المحول\nإليه؛ وموافق الكليت، وفقاً للشروط والضوابط التي يقرها مجلس الجامعت؛ بناء على اقتراح\nاللجنتّ الدائمت.\nلطالب الدراسات العليا - بناء على توصيتّ مجلس القسم وموافقتّ مجلس الكلينّ - دراسة بعض\nالمقررات في جامعت أو مؤسس”3 تعليميت داخل المملك” أو خارجها على أن تكون مرخص” من\nجهت الاختصاص في بلد الدراست:؛ وتعادل له الوحدات الدراسيتّ التي درسهاء وتثبّت المقررات\nالدراسيت التي تم معادلتها في السجل الأكاديمي للطالب، ويحدد مجلس الجامعيّ الضوابط\nالمنظمتّ في ذلك؛ بما فيها إمكانيت احتسابها ضمن المعدل التراكمي للطالب في سجله\nالأكاديمي.\nالقاعدة التنفيذبة للمادة الثانية والثلاثين\nتتم معادلة المقررات الدراسية وفقاً للضوابط المنصوص عليها في القاعدة التنفيذية للمادة .)١9(","a":["القاعدة التنفيذية للمادة الثلاثين","القاعدة التنفيذية للمادة .)١9("]},{"d":"buguide","p":9,"l":"ar","t":"0ا68 لاأونع/أولا قطدت8-ام\nالفصل الثامن\nلطالب الدراسات العليا من جامع غير سعوديتّ دراست بعض المقررات في جامع سعوديت، وفقآ\nلضوابط يقرها مجلس الجامعت بناء على اقتراح اللجنيّ الدائمت.\nتقترح اللجنة الدائمة الضوابط اللازمة لدراسة الطالب من جامعة غير سعودية لبعض المقررات بجامعة سعودية\nوترفع توصيتها مجلس الجامعة.\nالفصل التاسع\nيتم إجراء الاختبارات في مقررات الدراسات العلياء ورصد التقديرات؛ وفقاً للائحت الدراست\nوالاختبارات للمرحلت الجامعيت، فيما عدا الآتي:\n0-١ الا يُعد الطالب ناجحآ في المقرر إلا إذا حصل فيه على تقدير (جيد مرتذع) على الأقل.\n١ -\" اجتياز الطالب المقرر التكميلي في المرة الأولى بتقدير لا يقل عن (جيد مرتضع)؛ ولا\nيقل معدله التراكمي في مجمل المقررات التكميليتّ عن (جيد جدا).\n\"- 2 فيما يتعلق بالاختبارات البديلت والمقررات التي تتطلب دراستها أكثر من فصل دراسي\nيتخذ مجلس الكلية ما يراه حيالها بناء على توصيتّ مجلس القسم.\n-١ فيما لم يرد فيه نص خاص في هذه اللائحة وقواعدها التنفيذية فيرجع في إجراء الاختبارات ورصد\nالتقديرات إلى لائحة الدراسة والاختبارات للمرحلة الجامعية وقواعدها التنفيذية بالجامعة.\n؟- يعد الطالب منذراً أكاديمياً إذا انخفض معدله عن (7,؟) من(4): دون الحاجة لإشعار مكتوب.\n+- يشترط لعقد الاختبار البديل ما يلي:\nالأسبوع الثاني من نهاية الاختبارات: ما لم يكن هناك مسوغ لتأخير تقديم العذر.\n<ز موافقة مجلسي القسم والكلية على العذر.\n+- يعقد الاختبار البديل خلال الشهر الأول من بداية الفصل الدراسي التالي.","a":[]},{"d":"buguide","p":10,"l":"ar","t":")8 /اأومع/اأصلنا قطد8-ام\nالفصل الثامن\nيضع مجلس الجامعت القواعد المنظمت للاختبار الشامل - بشقيه التحريري والشنوي - لمرحلتي\nالماجستير والدكتوراه؛ بناء على مقترح اللجننّ الدائمة.\nتقترح اللجنة الدائمة القواعد المنظمة للاختبار الشامل بشقيه التحريري والشفوي - لمرحلتي الماجستير\nوالدكتوراه- وترفع توصيتها مجلس الجامعة.\nالفصل العاشر\nيضع مجلس الجامعت القواعد المنظمتّ لتسجيل مشروع بحث التخرج:؛ والرسالت العلميت لطالب\nالدراسات العليا -إن وجدت- وآلييّ تحديد المشرف على الرسالت العلمييّ؛ والمشرف المساعد -إن\nوجد- وذلك بناء على توصيت اللجنن الدائم2.\n-١ على طالب الدراسات العليا بعد اجتيازه خمسين في المثة على الأقل من المقررات الدراسية ومعدل\nتراكمي لا يقل عن (جيد جدأ) التقدم بمشروع الرسالة - إن وجد- إلى القسم العلمي.\n؟- يفضل أن تكون الرسائل ضمن الأوليات البحثية التي تحددها الجامعة.\n*- يعامل مشروع بحث التخرج معاملة المقرر الدراسي: ويراعى في الإشراف عليه ما ورد في المادة الثامنة\nوالثلاثون من هذه اللائحة.\n4- يقر عنوان مشروع البحث التخرج من مجلس القسم في الفصل الذي يسبق فصل تسجيل المقرر,\nويسجل في الفصل الدراسي المحدد حسب الخطة الدراسية.\nه- إقرار عنوان الرسالة العلمية لطالب الدراسات العليا من خلال مجلسي القسم والكلية.\n5- يتم تحديد المشرف الرئيس والمشرف المساعد (إن وجد) على الرسالة العلمية لطالب الدراسات العليا\nمن خلال مجلس القسم مع مراعاة الرتبة الأكاديمية والتخصص.","a":["المادة الثامنة"]},{"d":"buguide","p":11,"l":"ar","t":"0ا68 لاأونع/أولا قطدت8-ام\nالفصل العاشر\n-١ عرض مقترح مشروع بحث التخرج أو الرسالة العلمية على اللجنة الدائمة لأخلاقيات البحث العلمي\nإذا كان البحث يتطلب ذلك.\n- رفع توصية مجلس الكلية إلى الإدارة التنفيذية لتعولى تنفيذها.\nتكتب رسائل الماجستير والدكتوراه بلغي التدريس المقررة للبرنامج من مجلس الجامعت؛ على\nأن تحتوي الرسالت العلميتّ على ملخص واف باللفت العربييّ في حال كانت الرسال3 العلمية بغير\nاللغيّ العربيتث.\n-١ تضع اللجنة الدائمة الأدلة التفصيلية لكتابة الرسائل والبحوث العلمية في التخصصات المختلفة.\n+- يجب أن تحتوي الرسائل والبحوث العلمية المكتوبة باللغة العربية على ملخص باللغة الإنجليزية.\nيشرف على الرسائل العلميت الأساتذة والأساتذة المشاركين من أعضاء هيثتّ التدريس بالجامعة،\nويجوز للأستاذ المساعد أن يشرف على أبحاث التخرج ورسائل الماجستير؛ والمساعدة في الاشراف\nعلى الرسائل العلميتّ لمرحلّ الدكتوراه؛ إذا كان لديه بحثان - في مجال تخصصه - منشوران؛\nأو مقبولان للنشر في مجلنّ علمييّ محكمة.\n-١ يكون أولوية الإشراف على الرسائل العلمية حسب الرتبة الأكاديمية بما لا يقل عن رتبة أستاذ مشارك\nويجوز للأستاذ المساعد الإشراف على أبحاث التخرج ورسائل الماجستير إذا كان لدية بحثان - في\nمجال تخصصه - منشوران: أو مقبولان للدشر في مجلة علمية محكمة.\n؟- يجب أن يتم إسناد الإشراف لأعضاء هيئة التدريس بناءً على تخصصاتهم وبما يضمن العدالة في استحقاق\nتوزيع الإشراف لجميع أعضاء هيئة التدريس بالقسم.\n+- يجوز إسناد الإشراف إلى عضو هيئة تدريس من خارج القسم وفق الآني:\nخا أن تكون أنصبة الإشراف لأعضاء هيئة التدريس بالقسم المختص قد أكتملت ما لم يكن هناك\nمسوغ مقنع.","a":[]},{"d":"buguide","p":12,"l":"ar","t":"0ا68 لا أكرع ارلا حطج8-ام\nالفصل العاشر\nخا يحتسب الإشراف ضمن نصاب عضو هيئة التدريس المحدد في المادة (48) من هذه اللائحة\nوقاعدكا التنفيذية.\nيجوزأن يقوم بالإشراف أو المساعدة في الاشراف على الرسائل العلميت مشرفون من ذوي الخبرة\nوالكذاءة في مجال بحث الرسالتّ العلمييّ من غير أعضاء هيئت التدريس، سواء من داخل\nالجامعت أو من خارجهاء بناء على توصي مجلس القسم وموافقت مجلس الكليت.\n؟١- يراعى وجود مسوغات مقنعه للإشراف من خارج القسم أو الجامعة.\n+- يراعى اكتمال أنصبة الإشراف لمدسوبي القسم قبل إسناد الإشراف لمشرف من خارج الجامعة.\nيضع مجلس الجامع ضوابط المشرفين المساعدين على الرسائل العلميت؛ بناء على اقتراح\nاللجنت الدائمات.\nيجوز لعضو هيثّ التدريس الاشراف على رسائل علميتّ خارج جامعته - سواء داخل المملكة أو\nخارجها- بما لا يخل بواجباته الوظينيت: وفق ضوابط يقرها مجلس الجامعت؛ بناء على اقتراح\nاللجننّ الدائمي.\nيقوم المشرف بتقييم أداء الطالب في نهايي كل فصل دراسي؛ وتحديد مدى تقدمه في الرسالي\nالعلميت: وفقآً للآليات التي تقرها اللجنتّ الدائمة.\nلا يقل عدد الطلاب المسجلين في الشعبة لمقرر بحث التخرج عن خمستّ طلاب، ولمجلس\nالكليت الاستثناء من الحد الأدنى؛ وفق ضوابط يقرها مجلس الجامعت؛ بناء على اقتراح اللجنيٌ\nالدائمت.","a":["المادة (48) من هذه اللائحة"]},{"d":"buguide","p":13,"l":"ar","t":"0ا68 لاأونع/أولا قطدت8-ام\nالفصل العاشر\nإذا ثبت عدم جديت الطالب في مرحلت الرسالتّ العلميت؛ بناء على تقرير المشرف على الرسال3\nالعلميت، يتم إنذار الطالب بخطاب من القسم المختص؛ وإذا أنذر الطالب مرتين ولم يتلاف أسباب\nالانذاريُلغى قيده؛ بناء على توصينّ مجلسي القسم والكليت.\n-١ يعد الطالب غير جاد في دراسته في إحدى الحالات التالية على سبيل المثال لا الحصر:\nا إذا انقطع الطالب عن التواصل مع مشرفه فصل اً كاملاً دون عذر مقبول.\nخا إذا لم يتعاسب إنجازه مع المدة التي أمضاها وفق تقرير المشرف ما لم يكن هناك عذر مقبول.\n؟- يتولى رئيس القسم العلمي المختص إنذار الطالب بمخطاب سري بناء على تقرير من المشرف؛ ويحفظ\nالتقرير في ملف الطالبء وتزود الإدارة التنفيذية بنسخة منه.\n+- إذا لم يتلافَ الطالب أسباب الإنذار بعد إنذاره مرتين في فصلين دراسيين، فتعرض حالته على مجلس\nالقسمء فإن أوصى مجلس القسم بإلغاء القيد ترفع التوصية إلى اللجنة الدائمة.\nيحق للمشرف - سواء كان منضردا أو مشتركا مع غيره - أن يشرف بحد أقصى على سبع رسائل\nعلميتّ في وقت واحد؛ وللجن2 الدائمي الاستثناء من ذلك؛ بناء على توصيتّ مجلسي القسم\nوالكليت؛ وفق ضوابط يقرها مجلس الجامعتّ بناء على اقتراح اللجن”ّ الدائمت-\n-١ يراعى التوزيع العادل للإشراف على الرسائل العلمية بين أعضاء هيئة التدريس بالقسم مع الأخذ في\nالاعتبار بالتخصص والدرجة العلمية.\n؟- يطبق الحد الأقصى على الإشراف على الرسائل داخل القسم وخارجه.\nيُحسب نصاب الاشراف لعضو هيئ3 التدريس - سواء كان رئيساً أو مساعدآ - على كل رسال\nضمن العبء التدريسي؛ وفق ضوابط يقرها مجلس الجامعنّ بناء على اقتراح اللجنتّ الدائمة-","a":[]},{"d":"buguide","p":14,"l":"ar","t":"0ا68 لا أكرع ارلا حطج8-ام\n-١ تحسب ساعة واحدة لكل رسالة علمية في مرحلة الماجستير.\n؟- تحسب ساعتين لكل رسالة علمية في مرحلة الدكتوراه.\n+- تحسب ساعة واحدة للمشرف المساعد في كلا المرحلتين.\nال الطالب من إعدادها؛ تقريراً عن اكتمالها إلى\nرئيس القسمء مرفقاً به نسخت3 من الرسالت العلميت؛ تمهيد1 لاستكمال إجراءات المناقشت؛ التي\nيحددها مجلس الكليت.\nتكون لجن3 لمناقش” الرسالتّ العلمييّ بقرار من مجلس الكليت؛ بناء على توصي مجلس\nالقاعدة التنفيذية للمادة الثامنة والأربعين\n-١ يشترط لتكوين لجنة المناقشة ما يلي:\nخا صلاحية الرسالة للمناقشة بناء على تقرير المشرف.\nخا اجتياز طالب الماجستير والدكتوراه لكافة المقررات والاختبار الشامل (إذا اقتضى برنامج\nدراسته ذلك).\nخا أن يكون تسليم المشرف للتقرير قبل نهاية المدة النظامية للطالب.\n؟- يجب الحصول على موافقة مبدئية من المرشح لعضوية لجنة المناقشة قبل التوصية بعضويته في اللجنة.\n+- يقدم عضو جنة المناقشة إلى رئيس القسم العلمي تقريراً عن الرسالة ينص فيه على صلاحية الرسالة\nللمناقشة أو عدمهاء على ألا تزيد مدة فحص الرسالة من قبل عضو لجنة المناقشة عن شهر لرسالة\nالماجستير وشهرين لرسالة الدكتوراه من تاريخ تسلمها ويحق للقسم في حال تأخر المناقش عن المدة\nالقصوى ترشيح مناقش بديل.\n4- يجب ألا تتجاوز المدة ما بين قرار مجلس الكلية بتكوين لجنة المناقشة للطالب وعقد المناقشة أربعة أشهر\nكحد أقصى.\nه- إذا تقرر عدم صلاحية الرسالة للمناقشة وعدم قبوها للتعديل بالإجماع فيطبق على الطالب ما ورد في\nالبند (؟) فقرة (ج) من المادة (5؟). فإن لم يتحقق الإجماع فيحال الأمر إلى مجلس القسم لانخاذ ما","a":["القاعدة التنفيذية للمادة الثامنة والأربع","المادة (5؟). فإن لم يتحقق الإجماع في"]},{"d":"buguide","p":15,"l":"ar","t":"0ا68 لاأونع/أولا قطدت8-ام\nالفصل العاشر\nيراه مناسباً بشرط أن يكون تقرير عدم صلاحية الرسالة بالأغلبية المنصوص عليها في الفقرة (4) من\nالمادة ٠( ه) من هذه اللائحة.\n- يستكمل المشرف الرئيس فوذج تحديد موعد مناقشة الرسالة المعتمد من الإدارة التنفيذية، ويعتمده من\nرئيس القسم ويعلن القسم عن موعد المناقشة مع تزويد الإدارة التنفيذية بنسخة منه.\n-٠ يصدر حكم اللجنة مباشرة بعد المناقشة.\nيضع مجلس الجامعت ضوابط اختيار أعضاء لجان مناقشتّ رسائل الماجستير والدكتوراه وآليي\nإجراء تلك المناقشات:، بناء على اقتراح اللجنثّ الدائمث-\nتعد لجن المناقشة تقريرآ يُوقع من جميع أعضائها؛ يُقدم إلى رئيس القسم خلال أسبوع من\nتاريخ المناقشتّ متضمناً إحدى التوصيات الآتين:\n-١ قبول الرسالت العلميت والتوصيت بمنح الدرجي.\n\"- ققبول الرسالتّ العلمييّ مع إجراء بعض التعديلات؛ دون مناقشتها مرة أخرى:؛ ويُوض أحد\nأعضاء لجنت المناقشت بالتوصيتّ بمنح الدرجة بعد التأكد من الأخذ بهذه التعديلات\nفي مدة لا تتجاوزثلاث5 أشهرمن تاريخ المناقشتّ، ولمجلس الكليت الاستثناء من ذلك\nعلى ألا يتجاوز ست أشهر من تاريخ المناقشت.\n\"- استكمال أوجه النقص في الرسالت العلميت: وتعيد اللجنيّ مناقشتها خلال الطترة التي\nيحددها مجلس الكليت:؛ بناء على توصي مجلس القسم المختص:؛ على ألا تزيد عن\nسنت واحدة من تاريخ المناقشت.\n؟- عدم قبول الرسالتّ العلميش.\nولكل عضو من لجن المناقشتّ على الرسالتّ العلمييتّ الحق في أن يقدم ما لديه من مرئيات\nمغايرة أوتحفظات في تقرير منفصل إلى رئيس القسم في مدة لا تتجاوز أسبوعآ من تاريخ المناقشتق،\nويُرفع إلى عميد الكليتّ مع تقرير لجنتّ المناقشت.","a":["المادة ٠( ه) من هذه اللائحة."]},{"d":"buguide","p":16,"l":"ar","t":")8 لاأورع اونا قطد8-ام\n0-1 تحسب الدرجة بمتوسط اللدرجات الممنوحة من الأعضاء على ألا تقل عن (1/8) في حال التوصية بقبول\nالرسالة ومنح الدرجة.\n+- لا يعد إعلان نتيجة المناقشة منحاً للدرجة.\n؛- إذا انخفض معدل الطالب التراكمي بعد مناقشة الرسالة عن (18,؟ من 4) فيمنح فرصة إضافية لرفع\nمعدله إذا لم يسبق منحه هذه الفرصة من قبل: مع مراعاة ما ورد في المادة الثامنة والعشرين وقواعدها\nالتنفيذية.\n-- يرفع تقرير المناقشة مع توصية مجلس القسم العلمي بمنح الدرجة.\n-١ يُصرف للمشرف على رسالت الماجستير من خارج الجامعتّ مكافأة مقطوعتّ مقدارها\n)0٠( خمست آلاف ريال،؛ كما يصرف للمشرف على رسال الدكتوراه من خارج\nالجامعت مكافأة مقطوعت مقدارها )7٠٠١( سبعت آلاف ريال.\n\"- يجوزإذا استدعى الأمر مقابليّ الأستاذ المشرف الخارجي للطلب”ّ المشرف عليهم وبموافق2\nاللجنت الدائمت، بناء على طلب من الجامعت التي يتبع لها الطالب انتداب المشرف\nالخارجي على رسائل الماجستير أو الدكتوراه؛ وفق ما يلي:\nأ- ألا يتجاوزمرتين في كل عام دراسي لكل جامعتّ خارجيةّ يشرف على رسائل\nطلبن فيها.\nب- ألا يتجاوز عدد الجامعات التي ينتدب لها جامعتين في كل عام دراسي.\nج- ألا تتجاوزمدة الانتداب في كل مرة ثلاثة3 أيام.\nد- ألا يتجاوز مجموع أيام الانتداب عشرة أيام في العام الدراسي لجميع الجامعات.\nه- تتحمل الجامعتّ المستطيدة نطقات عضو هيئةٌ التدريس المنتدب للإشراف على\nرسائل طلبتها وفق ما هو مقرر نظاماً حسب رتبته.\n\"- للجامعت تعديل المكافأة المقطوعت المشار إليها في الغقرة )١( من هذه المادة بعد صدور\nقرار بالموافقت من مجلس شؤون الجامعات.\n02020202000 القاصةالتنفيذية لسماءةالحاديةوالخمسين___ |\n-١ تشمل المكافأة المشرف الرئيس والمشرف المساعد من خارج الجامعة.\n؟- يشترط للحصول على مكافأة الإشراف اكتمال الرسالة بموجب تقرير اكتمالاء وتصرف المكافأة بعد\nرصد درجة الرسالة على النظام الإلكتروني بالجامعة.","a":["المادة الثامنة والعشرين وقواعدها","المادة بعد صدور"]},{"d":"buguide","p":17,"l":"ar","t":")8 /اأومع/اأصلنا قطد8-ام\nالفصل العاشر\nيصرف لمن يشترك في مناقشت رسالتّ ماجستير أودكتوراه مكافأة مقطوعت مقدارها )1٠٠١(\nألف ريال إذا كان المناقش عضواً في هيئنّ التدريس بنطضس الجامعة التي تقدم لها الرسالت.\nأما إذا كان المناقش من غير أعضاء هيئت التدريس في الجامعتّ التي تناقش فيها الرساليّ سواء\nكان من موظفني تلك الجامعة؛ أو من يُدعى من خارجها؛ فتصرف له مكافأة مقطوعت3 مقدارها\n)12٠١( ألف وخمسمائتة ريال؛ لمناقشت” رسالتّ الدكتوراه و(١٠٠٠) ألف ريال لمناقشت رسال3\nالماجستيرء وتزاد المكافأة لتصبح )١0٠١( ألفين وخمسمائثة ريال إذا كان المناقش من خارج\nالمملكة.\nوإذا كان المناقش من خارج المدينة التي بها مقر الجامعت التي تناقش فيها الرساليّ سواء كان\nمن داخل المملكت أو خارجها فيصرف له بالإضافت إلى المكافأة المشار إليها أعلاه تذكرة\nإركاب من مقر إقامته وإليه وأجرة السكن المناسب والاعاش” بحد أقصى لا يتجاور ليلتين،\nكما تصرف تذكرة إركاب لمرافق المناقش إذا كان المناقش كذيفاً: ولمحرم المناقشر\nبالإضافت إلى أجرة السكن المناسب بحد أقصى لا يتجاوز ليلتين.\nويجوز للجنت الدائمت إضافت ليل أو ليلتين في حالات الضرورة؛ وإذا ما اقتضت ذلك طبيع3\nالدراست؛ وذلك بناء على توصي من مجلسي القسم والكلينّ المختصين مع إيضاح المبررات\nاللبقاء مدة تزيد عن ليلتين.\nوللجامعت تعديل المكافأة المقطوعت المشار إليها في هذه المادة بعد صدور قرار بالموافقي من\nمجلس شؤون الجامعات.","a":["المادة بعد صدور قرار بالموافقي من"]},{"d":"buguide","p":18,"l":"ar","t":"0ا68 لا أكرع ارلا حطج8-ام\nيرفع رئيس القسم المختص تقرير لجنت المناقشيّ إلى عميد الكليت في مدة لا تتجاور أسبوعين\nمن تاريخ المناقشة؛ لرفعه إلى الادارة التنطيذيت.\nيتخرج الطالب بعد إنهاء متطلبات التخرج بنجاح حسب خطت البرنامج؛ على ألا يقل معدله\nالتراكمي عن المعدل الذي يحدده مجلس الجامع لكل برنامج؛ على ألا يقل في كل الأحوال\nعن تقدير (جيد جدآ).\nالقاعدة التنفيذية للمادة الرابعة والنمسين\n-١ يتخرج الطالب بعد إنحاء كافة المتطلبات وفق الخطة الدراسية المعتمدة على ألا يقل معدله التراكمي عن\n(97,؟) من (4) وتقدير جيد جدًا.\n؟- مجلس الكلية بناءً على توصية مجلس القسم تحديد مقررات دراسية يدرسها الطالب لرفع معدله في حال\nنجاحه في المقررات وعدم تحقيقه المعدل المحدد للتخرج مع مراعاة ما ورد في المادة (؟).\nفي حال وفاة الطالب قبل تمكنه من المناقش ”2 يمنح الدرجت؛ وفق ضوابط يقرها مجلس\nالجامعّ بناء على اقتراح اللجنت الدائمت.\nيرفع النائب أو الوكيل المختص التوصيت بمنح الدرجت العلمييّ إلى مجلس الجامعة؛ لاتخاذ\nالقرار.\n-١ يرفع النائب أو الوكيل المختص بناءً على توصية مجلسي القسم والكلية وتأييد اللجنة الدائمة إلى مجلس\nالجامعة بمنح الدرجة العلمية خلال فصل دراسي من إتمام متطلبات التخرج.\n؟- لا يعد الطالب متخرجًا إلا بعد موافقة مجلس الجامعة على منحه الدرجة العلمية.","a":["القاعدة التنفيذية للمادة الرابعة والنمسي","المادة (؟)."]},{"d":"buguide","p":19,"l":"ar","t":"0ا68 لا أكرع ارلا حطج8-ام\nالفصل الحادي عشر\n-١ مع عدم الإخلال بما ورد في التصنيف والاطار؛ ووفق ضوابط يقرها مجلس الجامعت: بناء\nعلى اقتراح اللجنت الدائمت، لمجلس الجامعتّ بناء على تأييد من النائب أو الوكيل\nالمختص وتوصيتّ مجلسي القسم والكلينّ منح الطالب:\nأ- درجت دبلوم عالي عند اجتيازه عدداً من مقررات برنامج الماجستير؛ دون أن\nتكون بمجموعها مؤهلنّ لحصوله على درجت الماجستير.\nب- درجت الماجستير عند اجتيازه عدداً من مقررات برنامج الدكتوراه؛ دون أن\nتكون بمجموعها مؤهلنّ لحصوله على درجت الدكتوراد.\n\"- مع عدم الاخلال بما ورد في الغفقرة )١( من هذه المادة؛ للإدارة التنطيذيت بناء على توصيتقّ\nمجلسي القسم والكليت منح الطالب ما يُثبت اجتيازه ع  وضع الإطار العام للخطط البحثية؛ والقواعد المنظمة لكيفية كتابة\nالرسائل العلمية وطباعتها وإخراجها وتقديمهاء وإعداد نماذج تقارير لجنة\nالمناقشة؛ والحكم على الرسائل.\n5 دراسة التقارير الدورية المتعلقة بالدراسات العلياء التي تقدمها الأقسام\nالعلمية 4 الجامعة.\n/اا. اقتراح تقديم برامج دراسات عليا خارج مقرالجامعة والرفع بدذلك إلى\nمجلس الجامعة؛ لاتخاذ ما يراه مناسبا يشأنها.\n.التوصية بالموافقة على مقترحات الكليات بشأن المبادرات التطويرية المتعلقة\nبالدراسات العليا؛ لتنمية الموارد المالية للجامعة.\nاللائحة المنظمة للدراسات العليا ْ الجامعات\n.)١1444/9/؟( الصادرة بقرار مجلس شؤون الجامعات رقم\nم٠١71/8/١ هه الموافق ١444/1/7 المتخن 2# الاجتماع التاسع المعقود بتاريخ","a":[]},{"d":"cua","p":13,"l":"ar","t":"4. التوصية بتحديد المقابل المالي للتقديم على برامج الدراسات العلياء\nوالمقابل المالي أو الرسوم الدراسية للبرامج.؛ والمقابل المالي للخدمات\nالمساندة والمرتبطة بالدراسات العلياء بناءً على مقترحات مجالس الأقسام\nوالكليات.\n٠ التوصية بتخصيص منح مجانية للطلاب -كاملة أو جزئية-،. حسب\nالضوابط التي يقرها مجلس الجامعة.\n.،١ التوصية بإغلاق أو إيقاف برامج الدراسات العلياء التي لا تتوافق مع المعايير\nالنوعية: أو مع استراتيجية الجامعة.\n؟\". النظرفيما يحال إليها من رئيس اللجنة الدائمة: أو رئيس الجامعة، أو\nمجلس الجامعة للدراسة وإبداء الرأي.\nوللجنة الدائمة تفويض بعض صلاحياتها إلى رئيسهاء ولها كذلك تكوين لجان\nدائمة أو مؤقتة من بين أعضائها أو من غيرهم؛ لدراسة ما تكلفها به.\nالمادة الثامنة\nتجتمع اللجنة الدائمة بدعوة من رئيسها مرة واحدة كل شهر على الأقل؛ ولا\nيصح الاجتماع إلا بحضور ثلثي أعضائها على الأقل بمن فيهم الرئيس أو من\nينيبه من بين أعضاء اللجنة الدائمة، وتصدر قراراتها بأغلبية أصوات الأعضاء\nالحاضرينء وعند التساوي يُرَجّح الجانب الذي صوت معه رئيس الاجتماع؛\nوتعد قرارات اللجنة الدائمة نافذة؛ ما لم يرد عليها اعتراض من رئيس الجامعة\nخلال خمسة عشر يوماً من تاريخ وصولها إليه؛ فإن اعترض عليها رئيس\nالجامعة أعادها إلى اللجنة الدائمة - مشفوعة بوجهة نظره - لدراستها من\nجديد, فإن بقيت اللجنة الدائمة على رأيها فتحال القرارات المعترض عليها إلى\nمجلس الجامعة للبت فيها 4# أول جلسة عادية أو استثنائية؛ ولمجلس الجامعة\nتصديق القرارات أو تعديلها أو إلغاؤهاء ويكون قرار مجلس الجامعة 4# ذلك\nنهائياً. ولرئيس اللجنة الدائمة دعوة من يرى ضرورة حضوره لبعض جلسات\nاللجنة الدائمة، دون أن يكون له حق التصويت.\nاللائحة المنظمة للدراسات العليا 2 الجامعات\nتخد ب الاجتماع التاسع قود تاريخ 1444/0 ه الوافق 1.01/00","a":["المادة الثامنة"]},{"d":"cua","p":14,"l":"ar","t":"المادة التاسعة\nيجوز استحداث برامج مشتركة للدراسات العليا بين الأقسام,؛ أو بين الكليات، أو\nالمعاهد داخل الجامعة:؛ أو بين الجامعة ومؤسسات تعليمية أو بحثية من داخل\nالمملكة أو من خارجهاء وفق قواعد يُقَرُها مجلس الجامعة بناءً على توصية\nاللجنة الدائمة: بعد التنسيق مع الكليات والأقسام, أو الجهات المعنية.\nالمادة العاشرة\nلا تقل عدد الوحدات الدراسية التي يدرسها طالب الدراسات العليا 4 الجامعة\nالتي ستمنحه الدرجة العلمية عن خمسين 4# المئة من إجمالي عدد الوحدات\nالمطلوبة لمنح الدرجة العلمية؛ ويجب أن يُنجز الطالب بحث التخرج أو رسالته\nالعلمية -إن وجدا- بالكامل تحت إشرافهاء ويستثنى من هذه المادة طلاب\nالبرامج المشتركة.\nالمادة الحادية عشرة\nتكون الدراسة للدبلوم العالي بالمقررات الدراسية والأعمال الميدانية والتطبيقية\nوالمعملية، على أن تكون مدة دراسة البرنامج وعدد الوحدات الدراسية وفق ما هو\nمحدد 4 التصنيف والإطار, وللجلس الجامعة بناءً على اقتراح اللجنة الدائمة\nزيادة مدة دراسة أي برنامج؛ يما لا يتجاوز نصف المدة المقررة.\nالمادة الثانية عشرة\nتكون الدراسة للماجستير إما بالمقررات الدراسية فقطء أو بالمقررات الدراسية\nوالرسالة العلمية, أو بالمقررات الدراسية والاختبار الشاملء أو بالمقررات الدراسية\nويحث التخرج:، على أن تكون مدة دراسة البرنامج وعدد الوحدات الدراسية وفق\nماهو محدد 4 التصنيف والإطار؛ ولجلس الجامعة بناءً على اقتراح اللجنة\nالدائمة زيادة مدة دراسة أي برنامج: بما لا يتجاوز نصف المدة المقررة.\nاللائحة المنظمة للدراسات العليا ب الجامعات\nالخد الجاع الشاس اعقو بارج 1041/0/7 الاق 1000م","a":["المادة التاسعة","المادة العاشرة","المادة طلاب","المادة الحادية عشرة","المادة الثانية عشرة"]},{"d":"cua","p":15,"l":"ar","t":"المادة التثالتة عشرة\nيقر مجلس الجامعة بناءً على توصية اللجنة الدائمة أسلوب دراسة الدكتوراه،\nعلى أن تكون مدة دراسة البرنامج وعدد الوحدات الدراسية المقررة، وفق ما هو\nمحدد 4 التصنيف والإطار ولملجلس الجامعة بناءً على اقتراح اللجنة الدائمة\nزيادة مدة دراسة أي برنامج, بمالا يتجاوز نصغ المدة المقررة.\nالمادة الرابعة عشرة\nتُحسب مدة الحصول على الدرجة العلمية من بداية التسجيل 2 مقررات\nالدراسات العليا للبرنامج الملتحق به الطالب حتى تاريخ استكمال متطلبات\nالبرنامج؛ أو تقديم المشرف على الطالب تقريراً إلى رئيس القسم مرفقاً به\nنسخة من الرسالة العلمية -إن وجدت -.\nالفصل السابع: القبول\nالمادة الخامسة عشرة\nتتولى الإدارة التنفيذية تنفين الإجراءات الأكاديمية: بما 4 ذلك قبول الطلاب\nوتسجيلهم: وفق أحكام هذه اللائحة والضوابط المقرّة من مجلس الجامعة.\nالمادة السادسة عشرة\nمع مراعاة ما ورد لك المادة (الخامسة عشرة) من هذه اللائحة، يجوز قبول\nالطالب 4 غير مجال تخصصه بناءً على توصية من مجلس القسم المختص،\nوموافقة من مجلس الكلية.\nالمادة السابعة عشرة\nللقسم المختص أن يشترط لقبول الطالب 4 مرحلتي الماجستير والدكتوراه\nاجتيازعدد من المقررات التكميلية من مرحلة سابقة؛ أو تجاوزاختبار نواتج تعلم\nمتصلة بها؛ ليصبح الطالب مؤهلاً للالتحاق بالبرنامج؛ وفق ضوابط تقرها\nاللجنة الدائمة) بناءً على اقتراح من مجلس القسم وتأييد من مجلس الكلية.\nاللائحة المنظمة للدراسات العليا 4 الجامعات\nالصادرة بقرار مجلس شؤون الجامعات رقم (؟1544/9/1١)\nالمتخن # الاجتماع التاسع المعقود بتاريخ ١444/1/+ ه الموافق ١/17/8١1م","a":["المادة التثالتة عشرة","المادة الرابعة عشرة","المادة الخامسة عشرة","المادة السادسة عشرة","المادة (الخامسة عشرة) من هذه اللائحة","المادة السابعة عشرة"]},{"d":"cua","p":16,"l":"ar","t":"المادة الثامنة عشرة\nيجوز قبول التحاق الطالب ببرنامجين للدراسات العليا 2 وقت واحد؛ على أن\nيكون البرنامجان من نفس المرحلة أو من مرحلة سابقة: وفق ضوابط يُقرها\nمجلس الجامعة: بناءً على توصية اللجنة الدائمة.\nالمادة التاسعة عشرة\nيجوز معادلة مقررات دراسية سبق للطالب اجتيازها 2 جامعة أو مؤسسة تعليمية\nداخل المملكة: أو من خارج المملكة على أن تكون مرخصة من جهة الااختصاص\nبلد الدراسة؛ بناءً على توصية مجلس القسم؛ وموافقة من مجلس الكلية,\nوتّثيّت المقررات الدراسية التي تم معادلتها 4 السجل الأكاديمي للطالب؛ ويحدد\nمجلس الجامعة الضوابط المنظمة لذلكء؛ بما فيها إمكانية احتسابها ضمن\nالمعدل التراكمي للطالب 4 سجله الأكاديمي.\nالمادة العشرون\nيجوز بموافقة مجلس القسم المختص وعميد الكلية تأجيل الطالب قبوله،\nويكون لمرة واحدة, ولا يمكن قبول التأجيل بعد بدء الطالب دراسته؛ وفق ضوابط\nيقرها مجلس الجامعة: بناءً على اقتراح اللجنة الدائمة.\nالمادة الحادية والعشرون\nمع مراعاة ما يصدر من مجلس شؤون الجامعات من قرارات: يجوز أن تتقاضى\nالجامعة:\n.١ رسوماً دراسية أو مقابلاً مالياً؛ لتقديم برامج أو مقررات الدراسات العلياء\nعلى أن تكون تلك البرامج حاصلة على الاعتماد البرامجي؛ ويعدد طلاب\nلا يتجاوز عدد الطلاب المقبولين - لنفس البرامج أو المقررات - بدون رسوم\nأو مقابل مالي؛ ويضع مجلس الجامعة الضوابط المنظمة لذلكء بناءً على\nتوصية من اللجنة الدائمة.\n؟. مقابلاً مالياً للخدمات المرتبطة بالدراسات العليا والمساندة لهاء وفق ضوابط\nيقرها مجلس الجامعة: بناءً على توصية اللجنة الدائمة.\nالصادة بقرار مجلس شؤون الجامحات رقم (11/:/1)\nالمتخن # الاجتماع التاسع المعقود بتاريخ 1444/1/7 هه الموافق ١/1077/8م","a":["المادة الثامنة عشرة","المادة التاسعة عشرة","المادة العشرون","المادة الحادية والعشرون"]},{"d":"cua","p":17,"l":"ar","t":"الفصل التامن: الإجراءات الأكاديمية\nالمادة الثانية والعشرون\nيجوز للطالب تأجيل الدراسة بتوصية من مجلس القسم المختص وموافقة\nمجلس الكلية؛ وفق ضوابط يقرها مجلس الجامعة: بناءً على اقتراح اللجنة\nالدائمة.\nالمادة الثالتة والعشرون\nيجوز للطالب الاعتذار عن الاستمرار 4 دراسة مقرر أو أكثرء أو جميع مقررات\nالفصل الدراسي، وذلك بعد انتهاء فترة التسجيل، بتوصية من مجلس القسم\nالملختص،؛ وموافقة من عميد الكلية، وفق ضوابط يقرها مجلس الجامعة بناءً\nعلى اقتراح اللجنة الدائمة.\nالمادة الرابعة والعشرون\nإذا انسحب طالب الدراسات العليا من الجامعة ثم أراد الالتحاق بها مجدداً\nيجوز للجامعة أن تطبق عليه شروط القبول وقت التقديم الجديد.\nالمادة الخامسة والعشرون\nيُعد الطالب منقطعاً عن الدراسة إذا لم يُسجل خلال الفترة المحددة للتسجيل\nكل فصل دراسي متاح له التسجيل فيه.\nالمادة السادسة والعشرون\n.١ يُلغى قيد الطالب 4# الحالات الآتية:\nأ. إذا انقطع عن الدراسة:؛ وفقاً لأحكام المادة (الخامسة والعشرون) من\nهذه اللائحة.\nب. إذا لم يجتز المقررات التكميلية؛ وفق الضوابط التي تقرها اللجنة\nالدائمة.\nج. إذا انخفض معدله التراكمي عن تقدير (جيد جداً) فصلين دراسيين\nاللائحة المنظمة للدراسات العليا 4 الجامعات\nالصادرة بقرار مجلس شؤون الجامعات رقم (؟1544/9/1١)\nالمتخن # الاجتماع التاسع المعقود بتاريخ /1414/1 هه الموافق ١1071/4/1م","a":["المادة الثانية والعشرون","المادة الثالتة والعشرون","المادة الرابعة والعشرون","المادة الخامسة والعشرون","المادة السادسة والعشرون","المادة (الخامسة والعشرون) من"]},{"d":"cua","p":18,"l":"ar","t":"د. إذا اتضح أن قبوله مبني على تقديمه معلومات أووثائق غير صحيحة\nكليا أو جزئيا.\nه. إذا لم يحصل على الدرجة العلمية خلال المدة المحددة للبرنامج.\n؟. يُلفى قيد الطالب بقرار من اللجنة الدائمة بناءً على توصية مجلس\nالقسم وتأييد من مجلس الكلية 4 الحالات الآتية:\nأ. إذا ثبت عدم جديته 4 مرحلة الرسالة العلمية وفقاً لأحكام المادة\n(الرابعة والأريعون) من هذه اللائحة.\nب. إذا لم يجتزالاختبارالشامل بعد السماح له بإعادته مرة واحدة.\nج. إذا قررت لجنة الحكم على الرسالة العلمية عدم صلاحيتها للمناقشة\nأوعدم قبولها يعد المناقشة.\nد. إذا أخل بالأمانة العلمية سواء ث4 مرحلة دراسته للمقررات، أو خلال إعداده\nللرسالة العلمية؛ أوأخل بالأنظمة: أو اللوائح: أوالقرارات ذات العلاقة.\nالمادة السابعة والعشرون\nيجوز إعادة قيد الطالب الذي ألغي قيده إذا كان الحائل دون مواصلة دراسته\nظروفاً يقبلها مجلسا القسم والكلية: وتكون إعادة القيد بقرار من اللجنة\nالدائمة مع مراعاة ما يأتي:\n.١ الطالب الذي مضى على إلغاء قيده أكثر من ثلاثة أعوام دراسية:؛ يُعامل\nمعاملة الطالب المستجد من حيث إعادة دراسة المقررات، بصرف النظر عمًا\nأنجزه سابقاً من مرحلة الدراسة: ولجلس الجامعة الاستثناء من ذلك؛ وفق\nضوابط تصدر من مجلس الجامعة بناءً على اقتراح من اللجنة الدائمة.\n؟. الطالب الذي مضى على إلغاء قيده ثلاثة أعوام دراسية أو أقل؛ يُعيد\nدراسة بعض المقررات التي يُحددها له مجلس القسم ويوافق عليها مجلس\nالكلية، وتحسب الوحدات التي درسها بعد استثنافه الدراسة ضمن معدله\nالتراكمي؛ كما تُحسب المدة التي قضاها الطالب ع الدراسة قبل إلغاء قيده\nضمن المدة القصوى للحصول على الدرجة.\nالمادة الثّامنة والعشرون\nلمجلس الكلية؛ استثناءً من الفقرة (ج) من البند )١( من المادة (السادسة\nوالعشرون) من هذه اللائحة؛ منح الطالب فرصة استثنائية واحدة: لا تزيد على\nعام دراسي كحدٌ أعلى؛ بناءٌ على توصية مجلس القسم.\nالصادة بقرار مجلس شؤون الجامحات رقم (11/:/1)\nالمتخن # الاجتماع التاسع المعقود بتاريخ 1444/1/7 هه الموافق ١11/8/1١٠م","a":["المادة","المادة السابعة والعشرون","المادة الثّامنة والعشرون","المادة (السادسة"]},{"d":"cua","p":19,"l":"ar","t":"المادة التاسعة والعشرون\nللجنة الدائمة؛ استثناءً من الفقرة (ه) من البند )١( من المادة (السادسة\nوالعشرون) من هذه اللائحة؛ منح الطالب فرصة استثنائية لا تزيد على عام\nدراسي، بناءً على تقرير من المشرف وتوصية مجلسي القسم والكلية.\nالمادة التلاتون\nمع مراعاة المادة (الخامسة عشرة) من هذه اللائحة؛ للإدارة التنفيذية قبول\nتحويل الطالب إلى الجامعة من جامعة أو مؤسسة تعليمية داخل المملكة\nأو من خارجها على أن تكون مرخصة من جهة الاختصاص #ي بلد الدراسة،\nعلى ألا يكون مفصولا منها لأي سبب من الأسبابء بناء على توصية مجلسي\nالقسم والكلية؛ وتّثيّت المقررات الدراسية التي تم معادلتها 4# السجل الأكاديمي\nللطالب؛ ويحدد مجلس الجامعة الضوابط المنظمة ذلك، بما فيها إمكانية\nاحتسابها ضمن المعدل التراكمي للطالب 4 سجله الأكاديمي.\nالمادة الحادية والتلاتون\nيجوز تحويل الطالب من برنامج إلى آخر داخل الجامعة:؛ بناءً على توصية\nمجلس القسم المحوّل إليه وموافقة الكلية؛ وفقاً للشروط والضوابط التي\nيقرها مجلس الجامعة:؛ بناء على اقتراح اللجنة الدائمة.\nالمادة الثانية والتلاثون\nلطالب الدراسات العليا -بناءً على توصية مجلس القسم وموافقة مجلس\nالكلية- دراسة بعض المقررات شْ جامعة أو مؤسسة تعليمية داخل المملكة أو من\nخارجها على أن تكون مرخصة من جهة الاختصاص 4# بلد الدراسة: وتعادل له\nالوحدات الدراسية التي درسهاء وتثبّت المقررات الدراسية التي تم معادلتها 2\nالسجل الأكاديمي للطالب؛ ويحدد مجلس الجامعة الضوابط المنظمة 4 ذلك،\nبما فيها إمكانية احتسابها ضمن المعدل التراكمي للطالب 4# سجله الأكاديمي.\nالمادة الثالتة والتلاثون\nلطالب الدراسات العليا من جامعة غير سعودية دراسة بعض المقررات 4 جامعة\nسعودية؛ وفقاً لضوابط يُقرها مجلس الجامعة بناءًٌ على اقتراح اللجنة الدائمة.\nاللائحة المنظمة للدراسات العليا 2 الجامعات\nتخد ب الاجتماع التاسع قود تاريخ 1444/0
