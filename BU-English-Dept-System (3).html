<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>النظام المتكامل لإدارة قسم اللغة الإنجليزية — جامعة الباحة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
<style>:root,html[data-theme=dark]{
  --bg:#060D22;--bg2:#0A1630;--paper:#060D22;--surface:rgba(255,255,255,.035);--surface2:rgba(255,255,255,.06);--solid:#0D1A38;--glass:rgba(10,22,48,.72);
  --ink:#EAF0FA;--ink2:#B9C6DC;--muted:#8393B0;--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.06);
  --navy:#1A97D4;--navy2:#2E408D;--navy-soft:rgba(26,151,212,.14);--green:#94C83D;--green-soft:rgba(148,200,61,.14);--indigo:#2E408D;--sky:#1A97D4;--lime:#94C83D;
  --good:#7BD389;--good-bg:rgba(76,175,80,.16);--warn:#F2C062;--warn-bg:rgba(242,192,98,.14);--crit:#FF8A80;--crit-bg:rgba(255,82,82,.14);--ai:#B8A6FF;--ai-bg:rgba(140,120,255,.14);
  --inbg:rgba(255,255,255,.04);--shadow:0 1px 0 rgba(255,255,255,.04) inset,0 10px 30px rgba(0,0,0,.25);--kan:rgba(255,255,255,.03);
  --grad:linear-gradient(135deg,#2E408D 0%,#1A97D4 55%,#94C83D 100%);--r:16px;
  --f:'IBM Plex Sans Arabic','IBM Plex Sans',system-ui,sans-serif;--fd:'IBM Plex Sans Arabic','IBM Plex Sans',sans-serif;--fe:'IBM Plex Sans',system-ui,sans-serif;
}
html[data-theme=light]{
  --bg:#F3F6FC;--bg2:#E9EFF9;--paper:#F3F6FC;--surface:#FFFFFF;--surface2:#F6F8FD;--solid:#FFFFFF;--glass:rgba(255,255,255,.78);
  --ink:#121C3A;--ink2:#3A4766;--muted:#6B7895;--line:#E1E7F2;--line2:#EDF1F8;
  --navy:#2E408D;--navy2:#1F2D6B;--navy-soft:#E8ECF8;--green:#5E8F1F;--green-soft:#EEF6E2;
  --good:#2E7D32;--good-bg:#E7F3E8;--warn:#9A6400;--warn-bg:#FBF1DC;--crit:#B3261E;--crit-bg:#FBE7E5;--ai:#5B3FA8;--ai-bg:#F0ECFA;
  --inbg:#fff;--shadow:0 1px 2px rgba(18,28,58,.05),0 8px 24px rgba(18,28,58,.06);--kan:#EEF2F9;
}
html[lang=en]{--f:'IBM Plex Sans',system-ui,sans-serif;--fd:'IBM Plex Sans',sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.65}
html[data-theme=dark] body{background:radial-gradient(1200px 700px at 85% -10%,rgba(46,64,141,.45),transparent 60%),radial-gradient(900px 600px at 0% 100%,rgba(26,151,212,.12),transparent 60%),var(--bg);background-attachment:fixed}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--navy)}
::selection{background:rgba(26,151,212,.35)}
#bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.55}
html[data-theme=light] #bgfx{opacity:.35}
#root{position:relative;z-index:1}
.app{display:grid;grid-template-columns:272px 1fr;min-height:100vh}
/* sidebar */
.side{background:var(--glass);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px);border-inline-end:1px solid var(--line);color:var(--ink2);position:sticky;top:0;height:100vh;overflow:auto;padding:18px 14px 24px;scrollbar-width:thin}
.brand{position:relative;padding:6px 6px 16px;margin-bottom:10px}
.brand:after{content:"";position:absolute;inset-inline:6px;bottom:0;height:1px;background:linear-gradient(90deg,transparent,var(--sky),var(--lime),transparent);opacity:.7}
.brand .lgo{display:block;height:46px;width:auto;max-width:100%;filter:drop-shadow(0 4px 18px rgba(26,151,212,.35));animation:logoIn 1s cubic-bezier(.2,.8,.2,1) both}
.brand b{display:block;font-size:14px;color:var(--ink);margin-top:10px}
.brand small{display:block;font-size:11.5px;color:var(--muted)}
.nav a{position:relative;display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:11px;color:var(--ink2);text-decoration:none;font-size:14px;margin:2px 0;transition:background .2s,color .2s,transform .2s}
.nav a:hover{background:var(--surface2);color:var(--ink);transform:translateX(calc(var(--dirx,1)*-2px))}
.nav a.on{background:linear-gradient(90deg,rgba(26,151,212,.18),rgba(46,64,141,.10));color:var(--ink);font-weight:600;box-shadow:inset 0 0 0 1px rgba(26,151,212,.25)}
.nav a.on:before{content:"";position:absolute;inset-inline-start:-14px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--grad);box-shadow:0 0 12px var(--sky)}
.nav a svg{width:18px;height:18px;flex:none;opacity:.9}
.nav a.on svg{color:var(--sky)}
.nav .grp{font-size:10.5px;color:var(--muted);margin:16px 11px 5px;letter-spacing:.6px;text-transform:uppercase}
.badge{margin-inline-start:auto;background:var(--grad);color:#fff;border-radius:20px;font-size:11px;padding:0 8px;font-weight:700;font-family:var(--fe);box-shadow:0 0 12px rgba(26,151,212,.45)}
.whoami{margin-top:18px;padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:13px}
.whoami b{color:var(--ink);display:block}
.main{min-width:0}
.top{display:flex;align-items:center;gap:10px;padding:10px 26px;background:var(--glass);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px);position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line)}
.top .crumb{font-weight:600;color:var(--ink)}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:12.5px;color:var(--ink2);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#aaa;display:inline-block;box-shadow:0 0 0 0 currentColor;animation:pulse 2s infinite}
.iconbtn{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:11px;width:38px;height:36px;display:grid;place-items:center;cursor:pointer;color:var(--ink2);transition:.2s}
.iconbtn:hover{color:var(--ink);border-color:var(--sky)}
.iconbtn .cnt{position:absolute;top:-6px;inset-inline-end:-6px;background:#FF5252;color:#fff;border-radius:10px;font-size:10.5px;padding:0 5px;font-family:var(--fe);font-weight:700;animation:pop .4s}
.view{padding:26px 28px 70px;max-width:1360px}
h1{font-family:var(--fd);font-size:34px;line-height:1.25;margin:0 0 6px;font-weight:700;color:var(--ink);letter-spacing:-.2px}
h1:after{content:"";display:block;width:64px;height:3px;border-radius:3px;margin-top:10px;background:var(--grad);background-size:200% 100%;animation:shimmer 4s linear infinite}
.login h1:after{margin-inline:auto}
h2{font-family:var(--fd);font-size:22px;margin:0 0 12px;color:var(--ink)}
h3{font-size:15.5px;margin:0 0 8px;font-weight:600;color:var(--ink)}
.sub{color:var(--muted);margin:0 0 18px}
.en{font-family:var(--fe)}
.muted{color:var(--muted)} .small{font-size:12.5px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0;transition:border-color .25s,transform .25s,box-shadow .25s;isolation:isolate}
html[data-theme=dark] .card{backdrop-filter:blur(8px)}
.card:before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(420px circle at var(--mx,50%) var(--my,0%),rgba(26,151,212,.10),transparent 45%);opacity:0;transition:opacity .3s;pointer-events:none;z-index:-1}
.card:hover:before{opacity:1}
.card:hover{border-color:rgba(26,151,212,.28)}
.card.flat{box-shadow:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.mt{margin-top:14px}.mt2{margin-top:22px}.mb{margin-bottom:12px}
hr.sep{border:0;border-top:1px solid var(--line2);margin:14px 0}
.tile{overflow:hidden}
.tile:after{content:"";position:absolute;inset-inline-end:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,rgba(26,151,212,.18),transparent 70%);pointer-events:none}
.tile .lbl{font-size:13px;color:var(--muted)}
.tile .num{font-family:var(--fe);font-size:32px;font-weight:700;line-height:1.1;margin:6px 0 4px;background:linear-gradient(120deg,var(--ink),var(--ink) 40%,var(--sky));-webkit-background-clip:text;background-clip:text;color:transparent}
html[data-theme=light] .tile .num{background:linear-gradient(120deg,#121C3A,#2E408D 60%,#1A97D4);-webkit-background-clip:text;background-clip:text}
.tile .note{font-size:12.5px;color:var(--ink2)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:7px 14px;cursor:pointer;font-weight:500;display:inline-flex;gap:6px;align-items:center;white-space:nowrap;text-decoration:none;color:var(--ink);transition:transform .15s,border-color .2s,box-shadow .2s,background .2s;position:relative;overflow:hidden}
.btn:hover{border-color:rgba(26,151,212,.45);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.pri{background:var(--grad);background-size:160% 100%;border-color:transparent;color:#fff;box-shadow:0 6px 18px rgba(26,151,212,.28)}
.btn.pri:hover{background-position:100% 0;box-shadow:0 8px 26px rgba(26,151,212,.4)}
.btn.pri:after,.btn.ai:after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);transition:left .6s}
.btn.pri:hover:after,.btn.ai:hover:after{left:120%}
.btn.grn{background:linear-gradient(135deg,#5E9A20,#94C83D);border-color:transparent;color:#fff}
.btn.red{background:linear-gradient(135deg,#B3261E,#E35A4F);border-color:transparent;color:#fff}
.btn.ai{background:linear-gradient(135deg,#5B3FA8,#8C6CF0);border-color:transparent;color:#fff;box-shadow:0 6px 18px rgba(140,108,240,.3)}
.btn.wa{background:#1F9D55;border-color:#1F9D55;color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--sky)}
html[data-theme=light] .btn.ghost{color:var(--navy)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn svg{width:16px;height:16px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 10px;border-radius:999px;background:var(--surface2);color:var(--ink2);white-space:nowrap;border:1px solid var(--line2)}
.chip.navy{background:var(--navy-soft);color:var(--sky);border-color:transparent}
html[data-theme=light] .chip.navy{color:var(--navy)}
.chip.ai{background:var(--ai-bg);color:var(--ai);border-color:transparent}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;white-space:nowrap}
.st.good{background:var(--good-bg);color:var(--good)} .st.warn{background:var(--warn-bg);color:var(--warn)} .st.crit{background:var(--crit-bg);color:var(--crit)} .st.info{background:var(--navy-soft);color:var(--sky)} .st.ai{background:var(--ai-bg);color:var(--ai)}
html[data-theme=light] .st.info{color:var(--navy)}
.bar{height:8px;background:var(--line2);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--grad);border-radius:999px;transform-origin:var(--orig,right);animation:grow 1s cubic-bezier(.2,.8,.2,1) both}
.hbar{display:grid;grid-template-columns:170px 1fr 44px;gap:10px;align-items:center;font-size:13px;padding:5px 0}
.hbar .t{height:18px;background:var(--line2);border-radius:5px;overflow:hidden}
.hbar .t i{display:block;height:100%;background:var(--grad);border-radius:4px}
.hbar b{font-family:var(--fe);font-weight:600;text-align:end}
table.tb{width:100%;border-collapse:collapse;font-size:13.5px}
.tb th{text-align:start;font-weight:600;color:var(--muted);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line)}
.tb td{padding:10px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tb tr.click{cursor:pointer;transition:background .15s} .tb tr.click:hover td{background:var(--surface2)}
label.f{display:block;font-size:13px;color:var(--ink2);margin:10px 0 4px;font-weight:500}
.in{width:100%;border:1px solid var(--line);background:var(--inbg);border-radius:11px;padding:8px 11px;outline:none;transition:border-color .2s,box-shadow .2s;color:var(--ink)}
.in:focus{border-color:var(--sky);box-shadow:0 0 0 3px rgba(26,151,212,.18)}
select.in option{background:var(--solid);color:var(--ink)}
textarea.in{min-height:90px;resize:vertical}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--surface);padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 12px;cursor:pointer;font-size:13px;border-radius:8px;color:var(--ink2);transition:.2s}
.seg button.on{background:var(--grad);color:#fff;box-shadow:0 4px 12px rgba(26,151,212,.3)}
.kan{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:14px;overflow:auto;padding-bottom:6px}
.col{background:var(--kan);border:1px solid var(--line2);border-radius:14px;padding:10px;min-height:280px}
.col.over{outline:2px dashed var(--sky);outline-offset:-4px}
.col h4{margin:2px 4px 10px;font-size:13.5px;display:flex;justify-content:space-between;color:var(--ink)}
.tk{background:var(--solid);border:1px solid var(--line);border-radius:12px;padding:10px 11px;margin-bottom:8px;cursor:grab;transition:transform .2s,box-shadow .2s}
.tk:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.2)}
.tk .tt{font-weight:500;font-size:13.5px;line-height:1.5}
.tk .mm{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;font-size:11.5px;color:var(--muted);align-items:center}
.tk.late{border-inline-start:3px solid var(--crit)}
.steps{display:flex;overflow:auto;padding:6px 0 4px}
.stp{flex:1;min-width:104px;position:relative;text-align:center;font-size:12px;color:var(--muted);padding-top:30px}
.stp:before{content:"";position:absolute;top:11px;inset-inline:0;height:3px;background:var(--line)}
.stp:first-child:before{inset-inline-start:50%} .stp:last-child:before{inset-inline-end:50%}
.stp i{position:absolute;top:2px;left:50%;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;background:var(--solid);border:3px solid var(--line);font-style:normal;font-size:11px;line-height:16px;font-family:var(--fe);font-weight:700}
.stp.done{color:var(--ink2)} .stp.done i{background:var(--lime);border-color:var(--lime);color:#0A1630} .stp.done:before{background:var(--lime)}
.stp.cur{color:var(--sky);font-weight:600} .stp.cur i{border-color:var(--sky);background:var(--sky);color:#fff;box-shadow:0 0 0 5px rgba(26,151,212,.2);animation:pulseRing 1.8s infinite}
.stp.rej i{background:#E35A4F;border-color:#E35A4F;color:#fff}
.chk{display:flex;gap:9px;align-items:flex-start;padding:7px 10px;border-radius:10px;font-size:13.5px;margin:5px 0}
.chk.ok{background:var(--good-bg)} .chk.no{background:var(--crit-bg)} .chk.na{background:var(--surface2)}
.chk b.ic{font-family:var(--fe);flex:none;width:18px;text-align:center}
.chk .art{margin-inline-start:auto;font-size:11.5px;color:var(--sky);cursor:pointer;white-space:nowrap;text-decoration:underline dotted}
.modal-bg{position:fixed;inset:0;background:rgba(3,8,22,.6);backdrop-filter:blur(6px);z-index:60;display:none;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow:auto}
.modal-bg.on{display:flex;animation:fade .2s}
.modal{background:var(--solid);border-radius:20px;width:min(900px,100%);box-shadow:0 30px 80px rgba(0,0,0,.45);border:1px solid var(--line);animation:rise .35s cubic-bezier(.2,.8,.2,1)}
.modal .mh{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);border-radius:20px 20px 0 0}
.modal .mh h3{margin:0;font-size:17px;flex:1}
.modal .mb{padding:18px 20px}
.modal .mf{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;border-radius:0 0 20px 20px}
.x{border:0;background:transparent;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
.toast{position:fixed;bottom:22px;inset-inline-start:22px;background:var(--solid);color:var(--ink);border:1px solid var(--line);padding:11px 16px;border-radius:14px;z-index:90;font-size:13.5px;opacity:0;transform:translateY(14px);transition:.3s;pointer-events:none;max-width:440px;box-shadow:0 16px 40px rgba(0,0,0,.35)}
.toast.on{opacity:1;transform:none}
.toast:before{content:"";position:absolute;inset-inline-start:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--grad)}
.li{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2);align-items:flex-start}
.li:last-child{border-bottom:0}
.av{width:34px;height:34px;border-radius:11px;background:var(--navy-soft);color:var(--sky);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
html[data-theme=light] .av{color:var(--navy)}
.av.ai{background:var(--ai-bg);color:var(--ai)}
details.acc{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;transition:border-color .2s}
details.acc[open]{border-color:rgba(26,151,212,.3)}
details.acc summary{cursor:pointer;padding:12px 16px;display:flex;gap:10px;align-items:center;list-style:none}
details.acc summary::-webkit-details-marker{display:none}
details.acc[open] summary{border-bottom:1px solid var(--line2)}
details.acc .bd{padding:12px 16px;animation:rise .3s}
.exec{background:var(--navy-soft);border:1px solid rgba(26,151,212,.2);border-radius:12px;padding:10px 14px;margin-top:10px}
.exec ol{margin:6px 0 0;padding-inline-start:20px}
.cm{cursor:pointer}
.cm:hover{transform:translateY(-3px)}
.cm .ico{width:42px;height:42px;border-radius:12px;background:var(--navy-soft);color:var(--sky);display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(26,151,212,.25)}
.score{font-family:var(--fe);font-size:26px;font-weight:700}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs img{width:76px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.stars button{border:0;background:none;font-size:22px;cursor:pointer;color:var(--line);padding:0 1px;transition:transform .15s}
.stars button:hover{transform:scale(1.2)}
.stars button.on{color:#F2C062}
.aicard{background:linear-gradient(135deg,rgba(140,108,240,.12),rgba(26,151,212,.08));border:1px solid rgba(140,108,240,.28);border-radius:14px;padding:12px 14px;position:relative;overflow:hidden}
.aicard:after{content:"";position:absolute;top:0;bottom:0;width:30%;left:-40%;background:linear-gradient(90deg,transparent,rgba(184,166,255,.10),transparent);animation:scan 3.5s ease-in-out infinite}
.aicard .h{font-weight:600;color:var(--ai);display:flex;gap:6px;align-items:center;margin-bottom:6px}
.report{background:#fff;color:#13213A;border:1px solid var(--line);border-radius:14px;padding:26px 30px;font-size:14px}
.report h2,.report h3{color:#0A2C4E}
.report h2{border-bottom:2px solid #2E408D;padding-bottom:6px}
.report .muted{color:#6B7385}.report .tb th{color:#6B7385;border-color:#E3DFD3}.report .tb td{border-color:#EEEBE2}
.empty{color:var(--muted);text-align:center;padding:26px 10px;font-size:13.5px}
.inbox{display:grid;grid-template-columns:380px 1fr;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-height:calc(100vh - 230px)}
.tl{border-inline-end:1px solid var(--line);overflow:auto;max-height:calc(100vh - 230px)}
.th{padding:12px 14px;border-bottom:1px solid var(--line2);cursor:pointer;display:block;color:var(--ink);text-decoration:none;transition:background .15s}
.th:hover{background:var(--surface2)}.th.on{background:linear-gradient(90deg,rgba(26,151,212,.16),transparent)}
.th .s{font-weight:500;font-size:13.5px;display:flex;gap:6px;align-items:center}
.th.unread .s{font-weight:700}
.th.unread .s:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--sky);flex:none;box-shadow:0 0 8px var(--sky)}

.pcard .grid,.pcard .pc-info,.pcard>p{padding:0 22px}
.pc-info{display:flex;flex-wrap:wrap;gap:8px}
.pc-info a,.pc-info div{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:9px;background:var(--surface2);border:1px solid var(--line2);color:var(--ink);text-decoration:none;font-size:13.5px}
.pc-info a:hover{border-color:var(--sky)}
.pedit{display:flex;gap:22px;align-items:flex-start}
.pe-ph{display:flex;flex-direction:column;align-items:center;width:160px;flex:none;text-align:center}
.pe-ph label{cursor:pointer}
@media(max-width:700px){.pedit{flex-direction:column;align-items:stretch}.pe-ph{width:auto}}
.owrap{overflow:auto;border:1px solid var(--line);border-radius:12px;padding:18px 12px 24px;background:radial-gradient(circle at 50% 0,rgba(26,151,212,.10),transparent 60%),var(--solid);background-image:radial-gradient(circle at 50% 0,rgba(26,151,212,.10),transparent 60%),radial-gradient(var(--line) 1px,transparent 1px);background-size:auto,18px 18px}
.otree{direction:ltr;width:max-content;margin:0 auto;--ol:rgba(26,151,212,.55)}
html[data-theme=light] .otree{--ol:rgba(46,64,141,.35)}
.otree ul{position:relative;display:flex;justify-content:center;margin:0;padding:24px 0 0}
.otree>ul{padding-top:0}
.otree li{list-style:none;position:relative;padding:24px 8px 0;display:flex;flex-direction:column;align-items:center;animation:orgIn .6s cubic-bezier(.2,.8,.2,1) both}
.otree>ul>li{padding-top:0}
.otree li:before,.otree li:after{content:"";position:absolute;top:0;right:50%;width:50%;height:24px;border-top:2px solid var(--ol)}
.otree li:after{right:auto;left:50%;border-left:2px solid var(--ol)}
.otree li:only-child:before,.otree li:only-child:after{display:none}
.otree li:only-child{padding-top:0}
.otree li:first-child:before,.otree li:last-child:after{border:0}
.otree li:last-child:before{border-right:2px solid var(--ol);border-radius:0 10px 0 0}
.otree li:first-child:after{border-radius:10px 0 0 0}
.otree ul ul:before{content:"";position:absolute;top:0;left:50%;height:24px;border-left:2px solid var(--ol)}
.otree ul ul:after{content:"";position:absolute;top:0;left:calc(50% - 3px);width:8px;height:8px;border-radius:50%;background:#94C83D;box-shadow:0 0 10px #94C83D;animation:flow 2.4s ease-in infinite}
@keyframes flow{0%{transform:translateY(-4px);opacity:0}20%{opacity:1}100%{transform:translateY(20px);opacity:0}}
@keyframes orgIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.otree ul ul li{animation-delay:.15s}.otree ul ul ul li{animation-delay:.3s}.otree ul ul ul ul li{animation-delay:.45s}.otree ul ul ul ul ul li{animation-delay:.6s}
.onode{display:flex;align-items:center;gap:10px;min-width:190px;max-width:230px;padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:var(--ink);cursor:pointer;text-align:start;position:relative;transition:transform .25s,box-shadow .25s,border-color .25s,opacity .25s;box-shadow:0 6px 18px rgba(0,0,0,.18)}
html[data-theme=light] .onode{background:#fff;box-shadow:0 6px 18px rgba(46,64,141,.10)}
.onode:hover{transform:translateY(-3px);border-color:var(--sky);box-shadow:0 12px 30px rgba(26,151,212,.28)}
.onode .on-t{display:flex;flex-direction:column;min-width:0;line-height:1.35}
.onode b{font-size:13.5px}.onode small{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.onode .on-m{color:var(--sky)}
.onode.lg{min-width:240px;padding:12px 16px;background:linear-gradient(135deg,#2E408D,#1E2C6B);color:#fff;border-color:rgba(255,255,255,.15)}
.onode.lg small{color:rgba(255,255,255,.75)}.onode.lg .on-m{color:#94C83D}
.onode.head{background:linear-gradient(135deg,#1A97D4,#2E408D 70%);box-shadow:0 0 0 0 rgba(148,200,61,.6);animation:pulseRing 2.6s infinite}
@keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(148,200,61,.55)}70%{box-shadow:0 0 0 14px rgba(148,200,61,0)}100%{box-shadow:0 0 0 0 rgba(148,200,61,0)}}
.onode .on-me{position:absolute;top:-8px;inset-inline-end:10px;font-style:normal;font-size:10px;font-weight:700;background:#94C83D;color:#14204d;border-radius:8px;padding:0 7px}
.onode.dim{opacity:.28}.onode.hit{border-color:#94C83D;box-shadow:0 0 0 3px rgba(148,200,61,.45)}
.ocouncil{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:14px;cursor:pointer;background:var(--surface);border:1px dashed var(--sky);color:var(--ink);transition:.25s}
.ocouncil:hover{background:var(--navy-soft)}
.ocouncil b{display:block;font-size:14px}.ocouncil small{color:var(--muted);font-size:11.5px}
.oc-i{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--grad);color:#fff;flex:none}
.ostack{display:flex;margin-inline-start:8px}.ostack .pav{margin-inline-start:-8px}
.ocomm{display:flex;align-items:center;gap:8px;width:200px;padding:10px 12px;border-radius:12px;background:linear-gradient(135deg,hsl(var(--h) 55% 40% / .22),transparent),var(--surface);border:1px solid hsl(var(--h) 60% 55% / .45);color:var(--ink);position:relative}
.ocomm .oc-i{background:hsl(var(--h) 55% 45%)}
.ocomm b{font-size:12.5px;line-height:1.35;flex:1}
.oc-go{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:14px;padding:2px 4px;border-radius:6px}
.oc-go:hover{background:var(--surface2);color:var(--sky)}
.otree .ocomm+ul .onode{min-width:180px;max-width:200px}
.omem{display:flex;align-items:center;gap:4px;margin-top:8px;padding:5px 8px;border-radius:20px;background:var(--surface2);border:1px solid var(--line2)}
.omem span{cursor:pointer;margin-inline-start:-6px;transition:transform .2s}.omem span:first-child{margin-inline-start:0}.omem span:hover{transform:translateY(-3px) scale(1.12);z-index:1}
.omem small{font-size:11px;color:var(--muted);margin-inline-start:4px}
.ostu{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ostu .onode{flex:1;max-width:none}
@media (prefers-reduced-motion:reduce){.otree ul ul:after{display:none}}
.ovl{display:block;width:2px;height:26px;background:var(--ol)}
.ospine{position:relative;display:flex;flex-direction:column;gap:14px;padding:4px 0 6px}
.ospine:before{content:"";position:absolute;top:0;bottom:40px;left:50%;width:2px;margin-left:-1px;background:linear-gradient(var(--ol),var(--ol) 85%,transparent)}
.osr{display:grid;grid-template-columns:330px 56px 330px;align-items:center;animation:orgIn .6s cubic-bezier(.2,.8,.2,1) both}
.osd{position:relative;height:2px;background:var(--ol)}
.osd:after{content:"";position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#94C83D;box-shadow:0 0 0 4px rgba(148,200,61,.2),0 0 12px #94C83D}
.ocard{background:var(--surface);border:1px solid hsl(var(--h) 60% 55% / .45);border-radius:14px;overflow:hidden;transition:transform .25s,box-shadow .25s,opacity .25s;box-shadow:0 6px 18px rgba(0,0,0,.18)}
html[data-theme=light] .ocard{background:#fff;box-shadow:0 6px 18px rgba(46,64,141,.10)}
.ocard:hover{transform:translateY(-3px);box-shadow:0 14px 34px hsl(var(--h) 60% 45% / .35)}
.ocard.dim{opacity:.28}.ocard.hit{box-shadow:0 0 0 3px rgba(148,200,61,.5)}
.ocard-h{display:flex;align-items:center;gap:9px;padding:9px 12px;background:linear-gradient(135deg,hsl(var(--h) 55% 42% / .35),hsl(var(--h) 55% 42% / .08))}
.ocard-h .oc-i{background:hsl(var(--h) 55% 45%);width:30px;height:30px}
.ocard-h b{flex:1;font-size:13.5px;line-height:1.35}
.ocard-ch{position:relative;display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;background:transparent;border:0;border-top:1px solid var(--line2);color:var(--ink);cursor:pointer;text-align:start}
.ocard-ch:hover{background:var(--surface2)}
.ocard-ch span{display:flex;flex-direction:column;min-width:0;line-height:1.35}
.ocard-ch b{font-size:13.5px}.ocard-ch small{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ocard-ch .on-m{color:var(--sky)}
.ocard-m{display:flex;align-items:center;gap:2px;padding:7px 12px 9px;border-top:1px dashed var(--line2);min-height:22px}
.ocard-m span{cursor:pointer;margin-inline-start:-6px;transition:transform .2s}.ocard-m span:first-child{margin-inline-start:0}.ocard-m span:hover{transform:translateY(-3px) scale(1.12)}
.ocard-m small{font-size:11px;color:var(--muted);margin-inline-start:6px}
.pc-main{align-items:flex-start}.pc-main>div{padding-top:58px}
@media(max-width:900px){.osr{grid-template-columns:1fr;gap:10px}.osd{display:none}.ospine:before{display:none}}
/* ===== academic modules ===== */
.wlbar{height:8px;border-radius:6px;background:var(--surface2);overflow:hidden;margin-bottom:3px}.wlbar i{display:block;height:100%;border-radius:6px;transition:width .6s}
.ttg{display:grid;grid-template-columns:90px repeat(4,1fr);gap:4px}
.ttg.sm{grid-template-columns:80px repeat(4,1fr)}
.tth,.ttd{font-size:12px;color:var(--muted);font-weight:700;display:flex;align-items:center;justify-content:center;padding:6px}
.ttc{min-height:64px;border:1px dashed var(--line2);border-radius:8px;padding:4px;display:flex;flex-direction:column;gap:4px}
.ttc.pick{min-height:34px;align-items:center;justify-content:center;cursor:pointer}
.ttk{display:flex;flex-direction:column;text-align:start;padding:5px 8px;border-radius:7px;border:0;border-inline-start:3px solid hsl(var(--h) 60% 50%);background:hsl(var(--h) 60% 50% / .14);color:var(--ink);cursor:pointer;line-height:1.3}
.ttk b{font-size:12px}.ttk small{font-size:10.5px;color:var(--muted)}
.ttk.clash{background:var(--crit-bg);border-color:var(--crit);animation:shake .5s 2}
@keyframes shake{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.svq{padding:10px 0;border-bottom:1px solid var(--line2)}
.lik{display:flex;gap:6px;margin-top:6px}.lik label{cursor:pointer}.lik input{display:none}
.lik span{display:grid;place-items:center;width:38px;height:34px;border-radius:8px;border:1px solid var(--line);font-family:var(--fe);font-weight:700;transition:.15s}
.lik input:checked+span{background:var(--grad);color:#fff;border-color:transparent}
.thpipe{display:grid;grid-template-columns:repeat(7,minmax(138px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.thcol{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:140px}
.thcol h4{display:flex;justify-content:space-between;align-items:center;margin:0 0 8px;font-size:12.5px}
.thk{display:flex;gap:8px;align-items:center;width:100%;text-align:start;background:var(--surface2);border:1px solid var(--line2);border-radius:9px;padding:7px;margin-bottom:6px;cursor:pointer;color:var(--ink)}
.thk:hover{border-color:var(--sky)}.thk.late{border-color:var(--crit)}
.thk span{display:flex;flex-direction:column;min-width:0;gap:1px}.thk b{font-size:12.5px}.thk small{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb tr.late td{background:var(--crit-bg)}
.ask{display:flex;flex-direction:column}
.asklog{max-height:52vh;min-height:220px;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:4px}
.am{display:flex;gap:10px;align-items:flex-start}.am.me{flex-direction:row-reverse}
.am .ab{max-width:80%;padding:10px 14px;border-radius:12px;background:var(--surface2);white-space:pre-wrap;font-size:14px}
.am.me .ab{background:var(--navy-soft)}
.dep{min-height:150px}.dep.live{border-color:#94C83D}.dep.add{border-style:dashed}
.rlt{white-space:pre-wrap;font-size:13.5px;line-height:1.95;margin-top:8px;color:var(--ink2)}.rlp.open .rlt{color:var(--ink)}.rlt mark{background:rgba(148,200,61,.28);color:inherit;border-radius:3px;padding:0 2px}</style>

const DAYS=[['الأحد','Sun'],['الاثنين','Mon'],['الثلاثاء','Tue'],['الأربعاء','Wed'],['الخميس','Thu']],SLOTS=['08','10','12','14'];
const QUOTA_DEF={prof:10,assoc:12,assist:14,lect:16,headRed:4,chairRed:2};
function QP(){return{...QUOTA_DEF,...(setting('wlParams')||{})}}
function rankKey(k){const r=(acc(k).rank||'');return/مشارك|associate/i.test(r)?'assoc':/مساعد|assistant/i.test(r)?'assist':/محاضر|معيد|lecturer|instructor/i.test(r)?'lect':/أستاذ|professor/i.test(r)?'prof':'assist'}
function quotaOf(k){const q=QP();let v=q[rankKey(k)];const a=acc(k);if(a.role==='head')v-=q.headRed;else if(a.role==='chair')v-=q.chairRed;return Math.max(2,v)}
const loadOf=k=>S.courses.filter(c=>c.inst===k).reduce((a,c)=>a+(+c.cr||0)*(+c.sec||1),0);
function conflicts(){const out=[],by={};S.courses.forEach(c=>(c.slots||[]).forEach(s=>{const key=s.d+'-'+s.h;(by[key]=by[key]||[]).push(c)}));
  Object.entries(by).forEach(([key,cs])=>{for(let i=0;i<cs.length;i++)for(let j=i+1;j<cs.length;j++){const a=cs[i],b=cs[j];const[d,h]=key.split('-');
    if(a.inst&&a.inst===b.inst)out.push({k:'inst',d,h,a,b,t:T(`تعارض مدرّس: ${accName(a.inst)} — ${a.code} و${b.code}`,`Instructor clash: ${accName(a.inst)} — ${a.code} & ${b.code}`)});
    if(a.lvl===b.lvl&&+a.level===+b.level)out.push({k:'lvl',d,h,a,b,t:T(`تعارض مستوى ${a.level} (${a.lvl==='pg'?'دراسات عليا':'بكالوريوس'}): ${a.code} و${b.code}`,`Level ${a.level} clash: ${a.code} & ${b.code}`)})}});return out}
let WL={view:'load',f:''};

  <div class="grid g4"><div class="card tile"><div class="lbl">${T('المقررات / الشعب','Courses / sections')}</div><div class="num">${S.courses.length}</div><div class="note small muted">${tot} ${T('ساعة تدريسية','contact hrs')}</div></div><div class="card tile"><div class="lbl">${T('غير مسندة','Unassigned')}</div><div class="num">${un.length}</div></div><div class="card tile"><div class="lbl">${T('تجاوز النصاب','Over quota')}</div><div class="num" style="color:${over.length?'var(--crit)':'inherit'}">${over.length}</div></div><div class="card tile"><div class="lbl">${T('تعارضات الجدول','Clashes')}</div><div class="num" style="color:${cf.length?'var(--crit)':'inherit'}">${cf.length}</div></div></div>
  <div class="row mt"><div class="seg">${[['load',T('العبء','Load')],['grid',T('الجدول الأسبوعي','Weekly grid')],['list',T('المقررات','Courses')]].map(([k,l])=>`<button class="${WL.view===k?'on':''}" data-act="wlv" data-k="${k}">${l}</button>`).join('')}</div><span class="sp" style="flex:1"></span>${isHead()?`<button class="btn ai" data-act="wlAuto">${ic('robot',14)} ${T('توزيع ذكي للمقررات غير المسندة','Smart-assign unassigned')}</button><button class="btn pri" data-act="courseForm">${ic('plus',14)} ${T('مقرر','Course')}</button>`:''}</div>
  ${cf.length?`<div class="card flat mt" style="border-color:var(--crit)"><h3 style="color:var(--crit)">⚠ ${T('تعارضات تحتاج معالجة','Clashes to resolve')}</h3>${cf.map(c=>`<div class="small">• ${esc(c.t)} — ${tx(DAYS[c.d])} ${c.h}:00</div>`).join('')}</div>`:''}`;
  let body='';
  if(WL.view==='load'){body=`<div class="card mt"><table class="tb"><thead><tr><th>${T('العضو','Member')}</th><th>${T('الرتبة','Rank')}</th><th>${T('المقررات','Courses')}</th><th style="width:34%">${T('العبء / النصاب','Load / quota')}</th></tr></thead><tbody>${staff.map(k=>{const l=loadOf(k),q=quotaOf(k),p=Math.min(130,Math.round(l/q*100));return`<tr class="click" data-act="prof" data-id="${k}"><td><div class="row" style="gap:8px;flex-wrap:nowrap">${avatar(k,30)}<b>${esc(accName(k))}</b></div></td><td class="small">${esc(acc(k).rank||'—')}</td><td class="small en">${S.courses.filter(c=>c.inst===k).map(c=>c.code).join(' · ')||'—'}</td><td><div class="wlbar"><i style="width:${Math.min(100,p)}%;background:${l>q?'var(--crit)':p>=80?'#94C83D':'var(--sky)'}"></i></div><span class="small en">${l} / ${q}</span> ${l>q?`<span class="st crit">${T('تجاوز','over')}</span>`:l<q*.5?`<span class="st warn">${T('منخفض','low')}</span>`:''}</td></tr>`}).join('')}</tbody></table><p class="small muted">${T('النصاب حسب الرتبة: أستاذ','Quota by rank: Prof')} ${QP().prof} · ${T('مشارك','Assoc.')} ${QP().assoc} · ${T('مساعد','Asst.')} ${QP().assist} · ${T('محاضر','Lect.')} ${QP().lect} — ${T('تخفيض رئيس القسم','head reduction')} ${QP().headRed}، ${T('رئيس اللجنة','chair')} ${QP().chairRed}. ${T('قيم افتراضية قابلة للتعديل من الإعدادات وفق قرار الجامعة.','Defaults, editable in Settings per university policy.')}</p></div>`}
  else if(WL.view==='grid'){const opts=[['',T('الكل','All')],...staff.map(k=>['i:'+k,accName(k)]),...[1,2,3,4,5,6,7,8].map(n=>['u:'+n,T('بكالوريوس م','BA L')+n]),['p:1',T('دراسات عليا','Graduate')]];
    const fil=c=>!WL.f||(WL.f.startsWith('i:')?c.inst===WL.f.slice(2):WL.f.startsWith('u:')?c.lvl==='ug'&&+c.level===+WL.f.slice(2):c.lvl==='pg');
    const clashKeys=new Set(cf.flatMap(c=>[c.a.id+c.d+c.h,c.b.id+c.d+c.h]));
    body=`<div class="card mt"><div class="row"><select class="in" style="width:auto" data-act-change="wlf">${opts.map(([v,l])=>`<option value="${v}" ${WL.f===v?'selected':''}>${esc(l)}</option>`).join('')}</select></div><div class="ttg mt"><div></div>${SLOTS.map(h=>`<div class="tth en">${h}:00</div>`).join('')}${DAYS.map((d,di)=>`<div class="ttd">${tx(d)}</div>${SLOTS.map(h=>{const cs=S.courses.filter(c=>fil(c)&&(c.slots||[]).some(s=>+s.d===di&&s.h===h));return`<div class="ttc">${cs.map(c=>`<button class="ttk ${clashKeys.has(c.id+di+h)?'clash':''}" style="--h:${hueOf(c.code)}" data-act="courseForm" data-id="${c.id}"><b class="en">${esc(c.code)}</b><small>${esc(tx(c.name))}</small><small>${c.inst?esc(accName(c.inst)):T('غير مسند','unassigned')}</small></button>`).join('')}</div>`}).join('')}`).join('')}</div></div>`}
  else body=`<div class="card mt"><table class="tb"><thead><tr><th>${T('الرمز','Code')}</th><th>${T('المقرر','Course')}</th><th>${T('المرحلة','Level')}</th><th>${T('س.م × شعب','Cr × sec')}</th><th>${T('المدرّس','Instructor')}</th><th>${T('المواعيد','Slots')}</th></tr></thead><tbody>${S.courses.map(c=>`<tr class="click" data-act="courseForm" data-id="${c.id}"><td class="en"><b>${esc(c.code)}</b></td><td>${esc(tx(c.name))}</td><td class="small">${c.lvl==='pg'?T('دراسات عليا','Grad'):T('م','L')+c.level}</td><td class="en">${c.cr} × ${c.sec}</td><td>${c.inst?esc(accName(c.inst)):`<span class="st warn">${T('غير مسند','unassigned')}</span>`}</td><td class="small">${(c.slots||[]).map(s=>tx(DAYS[s.d])+' '+s.h).join('، ')||'—'}</td></tr>`).join('')}</tbody></table></div>`;
  return head+body;

const TH_ST=[['تسجيل الموضوع','Topic registered'],['إعداد الخطة','Proposal'],['جمع البيانات','Data collection'],['الكتابة','Writing'],['الإجازة للمناقشة','Cleared for defence'],['المناقشة','Defence'],['منح الدرجة','Degree awarded']];

  const late=list.filter(thRepLate),near=list.filter(t=>t.stage<6&&THP().maxSem-semUsed(t)<=1);
  return `<h1>${T('متابعة رسائل الدراسات العليا','Graduate thesis tracking')}</h1><p class="sub">${T('مراحل الرسالة من تسجيل الموضوع حتى منح الدرجة، تقارير تقدم دورية من المشرف، وتنبيه آلي عند تأخر التقرير أو اقتراب الحد الأعلى للمدة.','Thesis stages from topic registration to award, periodic supervisor progress reports, and alerts when a report is late or the maximum duration nears.')}</p>

function archiveAll(){const auto=[...S.letters.filter(l=>l.signed).map(l=>({id:'L'+l.id,k:'let',no:l.no,date:l.date,title:l.subject,auto:true,act:'openLetter',ref:l.id})),...S.meetings.map(m=>({id:'M'+m.id,k:'min',no:m.no,date:m.date,title:T('محضر مجلس القسم ','Council minutes ')+m.no,desc:m.minutes,auto:true})),...S.deanReports.map(r=>({id:'R'+r.id,k:'rep',no:r.no,date:r.issuedAt,title:T('التقرير الشامل للعميد ','Dean report ')+r.no,auto:true})),...S.requests.filter(r=>['approved','rejected'].includes(r.status)).map(r=>({id:'D'+r.id,k:'dec',no:r.no,date:r.history.slice(-1)[0].at,title:tx(RT[r.type].n)+' — '+(r.status==='approved'?T('موافقة','approved'):T('رفض','rejected')),auto:true,act:'openReq',ref:r.id}))];
  return[...S.archive,...auto].sort((a,b)=>(a.date||'')<(b.date||'')?1:-1)}
function vArchive(){const all=archiveAll(),q=ARF.q.trim().toLowerCase(),years=[...new Set(all.map(a=>(a.date||'').slice(0,4)).filter(Boolean))];
  const f=all.filter(a=>(!ARF.k||a.k===ARF.k)&&(!ARF.y||(a.date||'').startsWith(ARF.y))&&(!q||(a.title+' '+(a.no||'')+' '+(a.desc||'')+' '+(a.tags||'')).toLowerCase().includes(q)));
  return `<h1>${T('الأرشيف الإلكتروني','E-archive')}</h1><p class="sub">${T('كل الخطابات الموقّعة والمحاضر والقرارات والتقارير تُؤرشف تلقائياً، مع رفع الوثائق القديمة وتصنيفها والبحث في نصوصها.','Signed letters, minutes, decisions and reports are archived automatically; upload and classify older documents and search them.')}</p>
  <div class="card flat"><div class="row"><input class="in" id="arQ" style="flex:1;min-width:200px" value="${esc(ARF.q)}" placeholder="${T('بحث بالعنوان أو الرقم أو الوسم…','Search title, number, tag…')}"><select class="in" style="width:auto" data-act-change="arK"><option value="">${T('كل الأنواع','All types')}</option>${Object.entries(ARK).map(([k,l])=>`<option value="${k}" ${ARF.k===k?'selected':''}>${tx(l)}</option>`).join('')}</select><select class="in" style="width:auto" data-act-change="arY"><option value="">${T('كل السنوات','All years')}</option>${years.map(y=>`<option ${ARF.y===y?'selected':''}>${y}</option>`).join('')}</select><button class="btn" data-act="arSearch">${T('بحث','Search')}</button>${isStaff()?`<button class="btn pri" data-act="arNew">${ic('plus',14)} ${T('أرشفة وثيقة','Archive a document')}</button>`:''}</div></div>
  <div class="grid g4 mt">${Object.entries(ARK).slice(0,4).map(([k,l])=>`<div class="card tile"><div class="lbl">${tx(l)}</div><div class="num">${all.filter(a=>a.k===k).length}</div></div>`).join('')}</div>
  <div class="card mt" style="padding:0"><table class="tb"><thead><tr><th>${T('النوع','Type')}</th><th>${T('الرقم','No.')}</th><th>${T('العنوان','Title')}</th><th>${T('التاريخ','Date')}</th><th>${T('الملفات','Files')}</th></tr></thead><tbody>${f.map(a=>`<tr ${a.act?`class="click" data-act="${a.act}" data-id="${a.ref}"`:''}><td><span class="chip">${tx(ARK[a.k])}</span>${a.auto?` <span class="st info" title="${T('مؤرشف تلقائياً','auto-archived')}">${ic('bolt',11)}</span>`:''}</td><td class="en small">${esc(a.no||'—')}</td><td>${esc(a.title)}${a.tags?`<div class="small muted">#${esc(a.tags).replace(/[,،]\s*/g,' #')}</div>`:''}</td><td class="small">${a.date?fmtG(a.date):'—'}</td><td>${a.files?.length?attChips(a.files,'archive',a.id):'—'}</td></tr>`).join('')||`<tr><td colspan="5" class="empty">${T('لا نتائج','No results')}</td></tr>`}</tbody></table></div>`}
function arNew(){modal(T('أرشفة وثيقة','Archive a document'),`<div class="grid g3"><div><label class="f">${T('النوع','Type')}</label><select class="in" id="anK">${Object.entries(ARK).map(([k,l])=>`<option value="${k}">${tx(l)}</option>`).join('')}</select></div><div><label class="f">${T('الرقم','Number')}</label><input class="in" id="anN"></div><div><label class="f">${T('التاريخ','Date')}</label><input class="in" id="anD" type="date"></div></div><label class="f">${T('العنوان','Title')}</label><input class="in" id="anT"><label class="f">${T('وسوم (مفصولة بفاصلة)','Tags (comma-separated)')}</label><input class="in" id="anG"><label class="f">${T('وصف / نص مختصر للبحث','Description / searchable text')}</label><textarea class="in" id="anS" rows="3"></textarea><label class="f">${T('الملف','File')}</label><input type="file" class="in" id="anF" multiple accept="application/pdf,image/*">`,`<button class="btn pri" data-act="arSave">${T('حفظ في الأرشيف','Save')}</button>`)}
async function arSave(){if(!$('#anT').value.trim())return toast(T('العنوان مطلوب','Title required'));const files=[];for(const f of $('#anF').files){const r=await storeFile(f);if(r)files.push(r)}
  put('archive',{id:'ar'+uid(),k:$('#anK').value,no:$('#anN').value.trim(),date:$('#anD').value?new Date($('#anD').value).toISOString():new Date().toISOString(),title:$('#anT').value.trim(),tags:$('#anG').value.trim(),desc:$('#anS').value.trim(),files,by:ME});closeModal();toast(T('تمت الأرشفة','Archived'))}

const IMP_COLS=['الاسم','الاسم بالإنجليزي','الرتبة','البريد','الجوال','اللجنة','النوع','المرحلة','المعدل'];
function parseImport(txt){const rows=txt.trim().split(/\r?\n/).map(l=>l.split(/\t|,|؛|;/).map(x=>x.trim()));if(!rows.length)return[];const h=rows[0].some(x=>/الاسم|name/i.test(x))?rows.shift():null;
  const cm=v=>{v=(v||'').trim();if(!v)return'';return CK.find(c=>c===v||COMM[c].n[0].includes(v)||v.includes(COMM[c].n[0].replace('لجنة ',''))||COMM[c].n[1].toLowerCase().includes(v.toLowerCase()))||''};
  return rows.filter(r=>r[0]).map(r=>{const stu=/طالب|student/i.test(r[6]||'');return{nameAr:r[0],nameEn:r[1]||'',rank:r[2]||'',email:r[3]||'',phone:r[4]||'',c:stu?'':cm(r[5]),role:stu?'student':'member',lvl:/عليا|ماجستير|pg|grad/i.test(r[7]||'')?'pg':'ug',gpa:r[8]?+r[8]:null}})}
function impOpen(){modal(T('استيراد جماعي للأعضاء والطلاب','Bulk import members & students'),`<p class="small">${T('الصق من Excel (أعمدة مفصولة بـ Tab) أو CSV بالترتيب:','Paste from Excel (tab-separated) or CSV in this order:')}</p><div class="small en" style="direction:rtl"><code>${IMP_COLS.join(' | ')}</code></div><p class="small muted">${T('النوع: عضو أو طالب · المرحلة للطلاب: بكالوريوس أو دراسات عليا · اللجنة باسمها.','Type: member/student · Stage for students: UG/PG · Committee by name.')}</p><textarea class="in" id="impT" rows="8" placeholder="د. سارة الغامدي	Dr. Sara Alghamdi	أستاذ مساعد	salghamdi@bu.edu.sa	05xxxxxxxx	الدراسات العليا	عضو"></textarea><div class="row mt"><button class="btn" data-act="impPrev">${T('معاينة','Preview')}</button></div><div id="impP"></div>`,`<button class="btn pri" data-act="impRun">${T('استيراد','Import')}</button><button class="btn ghost" data-act="close">${T('إلغاء','Cancel')}</button>`)}
function impPrev(){const r=parseImport($('#impT').value);$('#impP').innerHTML=`<table class="tb mt"><thead><tr><th>${T('الاسم','Name')}</th><th>${T('النوع','Type')}</th><th>${T('اللجنة/المرحلة','Committee/stage')}</th><th>${T('البريد','Email')}</th></tr></thead><tbody>${r.map(x=>`<tr><td>${esc(x.nameAr)}</td><td>${x.role==='student'?T('طالب','Student'):T('عضو','Member')}</td><td>${x.role==='student'?(x.lvl==='pg'?T('دراسات عليا','PG'):T('بكالوريوس','UG')):x.c?tx(COMM[x.c].n):`<span class="st warn">${T('لجنة غير معروفة','unknown committee')}</span>`}</td><td class="en small">${esc(x.email)}</td></tr>`).join('')}</tbody></table><div class="small muted">${r.length} ${T('سجل','rows')}</div>`}
async function impRun(){const r=parseImport($('#impT').value);if(!r.length)return toast(T('لا بيانات','No data'));for(const x of r){const id=(x.role==='student'?'s':'m')+uid().slice(0,6);const{gpa,...rest}=x;await put('accounts',{id,custom:true,...rest,c:rest.c||(rest.role==='member'?'community':'')});if(gpa!=null&&!isNaN(gpa))await put('advising',{id,gpa})}syncCustomAccounts();closeModal();toast(T(`تم استيراد ${r.length} حساب`,`Imported ${r.length} accounts`));render()}

const REGLIB=[{"d":"bu1447","p":1,"l":"ar","t":"لظ 8 ع ذاقفمث الالاذد5 08 /ا600ذاكا\nاللائحة المنظه. للدراسات الهعليا في الجامعات\nوالشواعه التنفيدية لها بشامهة الساهة\nالفصل الأول: التعريفات\nالمادة الأولى:\nيقصد بالألفاظ والعبارات الآتية - أينما وردت في هذه اللائحة - المعاني المبينة أمام كل منهاء ما لم يقتض السياق غير\nالدراسات العليا: مرحلة دراسية أعلى من مرحلة البكالوريوس كالدبلوم العالي، أو ا ماجستير، أو الدكتوراه.\nالتصنيف: التصنيف السعودي الموحد للمستويات والتخصصات التعليمية الصادر بقرار مجلس الوزراء رقم (78) وتاريخ\n17 ؟١ه وما يطرأ عليه من تعديلات أو تحديئات.\nالإطار: الإطار الوطني للمؤهلات في المملكة.العربية السعودية؛ الصادر بقرار مجلس إدارة هيئة تقويم التعليم والتدريب في\nاجتماعه الأول للدورة الثانية المنعقد بتاريخ 5 52 ؟١ه وما يطرأ عليه من تعديلات أو تحديئات.\nالنائب أو الوكيل المختص: نائب رئيس الجامعة: أو وكيل الجامعة المعني بشؤون الدراسات العليا في الجامعة، وفق المميكل\nالتنظيمي المقر للجامعة.\nالإدارة التنفيذية: العمادة أو الإدارة أو الوحدة:المسؤولة في الجامعة عن تنفيذ الإجراءات الأكاديمية المتعلقة بالدراسات\nالعلياء وفقاً للهيكل التنظيمي المقر للجامعة.\nالبرنامج: مجموعة المقررات الدراسية: والرسالة العلمية، وبحث التخرج., والاختبار الشامل؛ أو بعضهاء التي يدرسها الطالب\nخلال مدة زمنية محددة؛ لنيل درجة علمية؛ أو شهادة عليا في مجال التخصص.\nالبرنامج المشترك: برنامج علمي يشترك فيه أكثر من قسم أو كلية من داخخل الجامعة؛ أو من خارجها من الموأسسات\nالتعليمية، أو المؤوسسات البحفية داخل المملكة: أو خارجهاء بنواتج تعلم محددة.\nالوحدة الدراسية: المحاضرة النظرية الأسبوعية: أو الندوة العلمية الأسبوعية: أو الدرس السريريء أو درس التمارين التي لا\nتقل مدته عن خمسين دقيقة: أو الدرس العملي الذي لا تقل مدته عن مئة دقيقة: أو الدرس الميداني المحدد في الخطة\nبإانوىع نوناق طة8 © دك نالع اط ©6اءةأممء 1 ||\n5.نالع.ناط","a":["المادة الأولى"]},{"d":"bu1447","p":2,"l":"ar","t":"ل ليد اه ذاقفعهم اللناذد ع0 /01م6 لاا\nالمقرر: المادة الدراسية في خطة كل برنامج، وتشتمل على رقم ورمز ووصف للمحتوى، و تخضع في كل قسم للمتابعة والتقييم\nوالتطوير، ويجوز أن درس مستقلة: أو أن يكون ها متطلب سابق أو متزامن معهاء ويمكن الإعفاء من المتطلب السابق أو\nالمتزامن بناء على اختبار لنواتج تعلم محددة.\nتأجيل القبول: إرجاء تاريخ بدء دراسة الطالتٍ بعد صدور رقمه الجامعي، وقبل تسجيله أي مقرر دراسي؛ ويكون ذلك مرة\nواحدة: ولا يمكن حدوثه بعد بدء الدراسة.\nتأجيل الدراسة: إيقاف الطالب سريان المدة المقررة - بحسب هذه اللائحة - للحصول على الدرجة العلمية بعد بدء\nدراسته.\nالانسحاب: إنهاء الطالب علاقته بالجامعة المقيد ما بشكل غائي. قبل إكمال برنامجه الدراسي.\nإلغاء القيد: إنماء الجامعة علاقتها بالطالب؛ قبل إكمال برنامجه الدراسي؛ لأسباب مخددة نصّت عليها هذه اللائخة.\nإعادة القيد: إعادة الجامعة علاقتها بالطالب الذي ألغي قيده.\nالاختبار الشامل: اختبار المعارف والمهارات المتطلبة للحصول على درجات برامج الدراسات العليا (الدبلوم العالي،\nالماجستير, الدكتوراه): وقد يكون الاختبار الشامل هو المؤهل النهائي لبعض هذه الدرجات عدا درجة الدكتوراه.\nبحث التخرج: بحث قد يستغرق فصلاً دراسياً أو فصلين دراسيين، ويكون محدد الموضوع, ويؤهل للدرجة العلمية، ويكون\nمقرراً ضمن مقررات البرنامج.\nالرسالة العلمية: الأطروحة العلمية, التي تمثل البحث ونتائجه. والتي أعدها الطالب وقدمها لغرض الحصول على الدرجة\nوز العلمية.\nبرانومء/توتافطة8 © ا مكسلع نط هاعقاوى 1\n5.نالع.ناط","a":["المادة الدراسية في خطة كل برنامج» وت"]},{"d":"bu1447","p":3,"l":"ar","t":"عََآدَة اليفك لو]ئنْفَت ؟ المملكة.العربية السعودية\nعدا وكحاحةا بللشحؤون ذاقفعم اناةظ5 08 /6001ذاكا\nالدراسات العليا والابتعاث\nالفصل الثاني: أهداف وسريان اللائحة\nالمادة الثانية:\nمع مراعاة أحكام لائحة الدراسة والاختبارات للمرحلة الجامعية في الجامعات، تحدف هذه اللائحة إلى تنظيم الدراسات العليا\nفي الجامعات، بما يحقق رفع كفاءة وجودة العملية التعليمية، والإجراءاتالأكاديمية لمراحل الدراسات العليا في الجامعة.\nالمادة الثالشة:\nتسري أحكام هذه اللائحة على الجامعات التي تطبق نظام مجلس التعليم العالي والجامعات؛ الصادر بالمرسوم الملكي رقم\n(م/8) وتاريخ 41١4/5/4 ١هء والجامعات التي تطبق نظام الجامعات المادر بالمرسوم الملكي رقم (م/77) وتاريخ\nالفصل الثالث: أهداف الدراسات العليا\nالمادة الرابعة:\nتمدف الدراسات العليا إلى تحقيق الآني:\n0-١ العناية بالدراسات والأبحاث المتقدمة؛ التي تخدم الأهداف الوطنية، والتوسع فيهاء والعمل على نشرها.\n20-7 الإسهام في إثراء المعرفة الإنسانية بكافة فروعهاء عن طريق الدراسات المتخصصة والبحث العلمي؛ للوصول إلى\nإضافات علمية وتطبيقية مبتكرة،. والكشف عن حقائق جديدة.\n0# إتاحة الفرضة التعليمية؛ لمواصلة الطللات دراساتهم العليا محلياً.\n5- تقديم المواد والبرامج المؤهلة للطلاب؛ للرفع من مستوى تأهيلهم وكفاء هم ؛ لتقديم الدراسات والأبحاث التي\nتخدم الوطن؛ وتسهم في إثراء تخصصاهم.\nه- استقطاب نخبة من الطلاب المتميزين من مختلف أنحاء العالم في أهم المجالات البحفية؛ للارتقاء بمخرجات البحث\nالعلمي. وإثراء التنوع الثقاني المطلوب في برامج الدراسات العليا.\n20-5 إعداد وتأهيل الكفاءات العلمية والمهنية المتخصصة التي يحتاجها امجتمع.\nاله التشجيع على الإبداع والابتكار لمسايرة متطلبات التطور المعرني والتقني: والارتقاء بمستوى البحث العلمي،\nوتوجيهه لمعالجة قضايا وتحديات التنمية المستدامة في المجتمع السعوديء والإقليميء والعالمي.\n2-4 تعزيز فرص التعاون والشراكات المختلقة محلياًء وإقليمياً، وعالياً.\n0-4 تنمية مخرجات الاقتصاد المعرفي، للإسهام في تحقيق أهداف التنمية المستدامة للمجتمع السعودي.\nاط عربية السعودية. الباحة ب(1988) 3\nعدوي هطه8-امق ,فاقفهم انافك ع0 10/6001 0 ا 2\nلإانىعء/اأومتاقطة8 © دك نالع .ناط هاء3 أممء !\n53.نالع.نا","a":["المادة الثانية","المادة الثالشة","المادة الرابعة"]},{"d":"bu1447","p":4,"l":"ar","t":"-_- 3 ل ذاقفعثم الاناذظدك 08 60011 لكا\nالفصل الرابج: المعايير التفصيلية لإقرار برامج الدراسات العليا\nالمادة الخامسة:\nيضع مجلس الجامعة المعايير التفصيلية لإقرار برامج الدراسات العليا مع التقيد بما يلي:\n-١ أن تكون الجامعة حاصلة على الاعتماد المؤسسي من هيئة تقويم التعليم والتدريب.\n؟- أن يكون برنامج البكالوريوس - في ذات التخصص- حاصلاً على الاعتماد البرامجي من هيئة تقويم التعليم\nوالتدريب؛ أو من إحدى الحيئات الدولية التي تعتمدها الحيئة؛ لإقرار برنامج الدبلوم العالي أو الماجستيرء وأن\nيكون برنامج الماجستير - في ذات التخصص- حاصلاً على الاعتماد البرامجي من هيئة تقويم التعليم\nوالتدريب، أو من إحدى الهيئات. الدولية التي تعتمدها الحيئة لإقرار برنامج الدكتوراه.\n*“- أن يتوفر لدى القسم العدد الكافي من أعضاء هيئة التدريس من الأساتذة والأساتذة المشاركين المتخصصين في\nمجال برنامج الماجستير أو الدكتوراه. إضافة إلى توفر الإمكانات البحثية، من معامل ومختبرات وتسهيلات\nالحاسوب وغيرها؛ لضمان نجاح البرنامج من حيث التدريس والإشراف والبحث.\n4- أن يكون عدد الطلاب المتوقع قبولهم في البرنامج مناسباً لضمان استمراريته: وألا يزيد عدد الطلاب في الشعبة\nالواحدة عن (©؟) طالباً.\nه- تتقيد الجامعة عند إقرار برامجها بالآي حسب الترتيب:\nأ- التصنيف السعودي الموحد للمستويات والتخصصات التعليمية.\n5- إيقاف القبول ني برامج الماجستير والدكتوراه التي لا تحصا على الاعتماد البرامجي من هيئة تقويم التعليم\nوالتدريب أو من إحدى الهيئات الدولية التي تعتمدها الهيئة خلال سنتين من تخرج أول دفعة من البرامج.\nالقاعدة التنفيذية للمادة الخامسة\n-١ تعمل الجامعة على المحافظة على الاعتماد المؤوسسي.\n؟- تعمل الأقسام على الحصول على الاعتماد البرامجي لبرامج البكالوريوس وبرامج الدراسات العليا.\n#- يقوم القسم العلمي بإعداد مشروع البرنامج المستحدث بناءً على النماذج المعدة لذلك من قبل الإدارة التنفيذية ووفق\nالأحكام الواردة في هذه المادة.\n4 - في حال عدم تمكن القسم من الحصول على الاعتماد البراجي محلياً أو دولياً لبرنامج الماجستير أو الدكتوراه خلال عامين\nار جامعيين من تخرج أول دفعة توصي اللجنة الدائمة إلى مجلس الجامعة بإيقاف البرنامج.\nبإانىومع/اأوتناهلاة8 © دك نالع .ناط6اء3 01م ات\nك5.نالع .نا","a":["المادة الخامسة","القاعدة التنفيذية للمادة الخامسة","المادة."]},{"d":"bu1447","p":5,"l":"ar","t":"فدادة كي كد لدي ول ل تم\nالفصل الخامس : حظيم اللجنة الذاتهذ الدراسات العلا\nالحافة الحصادسة:\nتُشْكّل لجنة دائمة للدراسات العليا في الجامعة (اللجنة الدائمة)؛ وترتبط تنظيمياً بالنائب أو الوكيل المختصء وتكون\nبرئاسته وعضوية كل من:\n-١ خمسة من عمداء الكليات والمعاهد. الت تقدم برامج دراسات عليا في الجامعة، ويراعى تنوع تخصضات الكليات\nوالمعاهد.\n؟- عميد التطوير والجودة في الجامعة.\n#- عميد؛ أو مدير أو رئيس وحدة الإدارة التنفيذية، ويكون أميناً للجنة.\n4 - ثلاثة أعضاء من ذوي الخبرة والاختصاض بالدراسات العليا من داخل الجامعة أو من خارجها.\nويعين الأعضاء المنخصوص عليهم في الفقرتين )١( و(4) من هذه المادة؛ بقرار من مجلس الجامعة؛ بناءً على ترشيح من\nرئيس الجامعة، وذلك لمدة سنتين قابلة للتجديد.\nتتولى اللجنة الدائمة وفق أحكام هذه اللائحة المهام الآتية:\n-١ اقتراح السياسة العامة للدراسات العليا في الجامعة، ومتابعة تنفيذها بعد إقرار مجلس الجامعة.\n؟- التوصية بالموافقة على شروط القبول لبرامج الدراسات العليا وتحديثهاء بناءً على اقتراح مجالس الأقسام والكليات\nوالمعاهد المختصة.\n#- الإشراف على برامج الدراسات العليا المشتركة.\n4- التوصية بإقرار برامج الدراسات العليا وتعديلها - بعد دراستها وتحكيمها- مجلس الجامعة، بناءً على اقتراح من\nمجلس القسم, وتأييد المقترح من مجلس الكلية.\nه- التوصية بإقرار الخطط الدراسية والمعايير التفصيلية مجلس الجامعة؛ بناءً على اقتراح من مجلس القسم وتأييد من\nمجلس الكلية، وفق معايير ومقارنات مرجعية دولية.\n5- اقتراح معايير برامج الدراسات العليا؛ لإقرارها من مجلس الجامعة.\n-٠ اقتراح القواعد المنظمة لتقويم برامج الدراسات العليا؛ لإقرارها من مجلس الجامعة.\n8- الإشراف على تقويم برامج الدراسات العليا في الجامعة بصفة دورية: من خلال لجان أو هيئات متخصصة من\nو داخل الجامعة؛ أو من خارجها.\nمك1 عربية السعودية. الباحة ب(0988) 5\nانام رين مطاد8- ام _فاقكفهمْ زمزيفك ع0 /06001)! 0 1\nلإانوعء/اأومتاقطة8 © هك نالع .ناطنهاءةأممء !\n.نالع .ناا","a":["المادة؛ بقرار من مجلس الجامعة؛ بناءً"]},{"d":"bu1447","p":6,"l":"ar","t":"ا وكالة العمااةة لشؤون\n9- دراسة التقرير الشامل المعد من الإدارة التنفيذية عن برامج الدراسات العليا في الجامعة، ونتائج تقويم تلك البرامج،\nورفعها إلى مجلس الجامعة.\n-٠ التوصية بالموافقة على مقترحات مجالس الكليات فيما يتعلق ببرامج دراسية عليا تتوافق مع احتياجات المجتمع؛\nوخطط ورؤى المملكة, والتوجهات العالمية؛ لإقرارها من مجلس الجامعة.\n5- تأييد مقترحات تحديد الدرجات والشهادات العلمية، ومسمياتما باللغتين العربية والإنجليزية: بناءً على مقترحات\nمجالس الأقسام والكليات.\n7- التوصية بأعداد الطلاب الذين يمكن قبوهم كل عام دراسي في برامج الدراسات العليا مجلس الجامعة, بناءً على\nاقتراح من مجالس الأقسام المختصة: وتأييد من مجالس الكليات.\n-١ اقتراح ضوابط تشكيل لجان الإشراف؛ ومناقشة الرسائل العلمية.\n-١ وضع الأطر العامة: والمعايير للاختبارات الشاملة ولبحوث التخرج.\n-١ وضع الإطار العام للخطط البحفية، والقواعد المنظمة لكيفية كتابة الرسائل العلمية وطباعتها وإخراجها وتقديمهاء\nوإعداد نماذج تقارير لجنة المناقشة؛ والحكم على الرسائل.\n- دراسة التقارير الدورية المتعلقة بالدراسات العلياء التي تقدمها الأقسام العلمية في الجامعة.\n- اقتراح تقديم برامج دراسات عليا خارج مقر الجامعة، والرفع بذلك إلى مجلس الجامعة؛ لاتخاذ ما يراه مناسباً\nبشأنها.\n8- التوصية بالموافقة على مقترحات الكليات بشأن المبادرات التطويرية المتعلقة بالدراسات العليا؛ لتنمية الموارد\nالمالية للجامعة.\n84- التوصية بتحديد المقابل الاي للتقدبم على برامج الدراسات العلياء والمقابل الماللي أو الرسوم الدراسية للبرامج،\nوالمقابل الماللي للخدمات المساندة والمرتبطة بالدراسات العلياء بناءً على مقترحات مجالس الأقسام والكليات.\n-٠ التوصية بتخصيص منح مجانية للطلاب - كاملة أو جزئية - حسب الضوابط التي يقرها مجلس الجامعة.\n-١ التوصية بإغلاق أو إيقاف برامج الدراسات العلياء التي لا تتوافق مع المعايير النوعية، أو مع إستراتيجية الجامعة.\n- النظر فيما يخال إليها من رئيس اللجنة الذائمة أو رئيس الجامعة: أو مجلس الجامعة؛ للدراسة وإبداء الرأي.\nوللجنة الدائمة تفويض بعض صلاحياتا إلى رئيسهاء وها كذلك تكوين لجان دائمة أو مؤقتة من بين أعضائها أومن غيرهم\nلدراسة ما تكلفها به.\nبإانوععء/اأوتاةلاة8 © دك نالع .ناط © أعقامامء اما\nد5.نالع.ناط","a":[]},{"d":"bu1447","p":7,"l":"ar","t":"الدراسات العليا والابتعاث م\nالقاعدة التنفيذية للمادة السابعة\n-١ تشرف اللجنة الدائمة على برامج الدراسات العليا المشتركة: ويكون هناك تنسيق ومتابعة مستمرة مع الجهة التنفيذية\nفي الأقسام والكليات.\n- يقوم القسم العلمي بإعداد مشروع البرنامج المقترح ويحدد فيه المتطلبات الدراسية للدرجة العلمية: ومقررات البرنامج،\nوعدد الساعات الدراسية وتوزيعهاء وتوضيف البرنامج، وتوصيف المقررات؛ وفقا لنماذج هيئة تقويم التعليم\nوالتدريب. وإجراء المقارنات المرجعية اللازمة، والتأكد من توفر الإمكانات البشرية من أعضاء هيئة التدريس مع\nمراعاة الرتب العلمية والفنية والإدارية والمادية من مختبرات وغيرهاء ويرفع تقريرًا مفصلًا للعرض على اللجنة الدائمة.\n- تقوم اللجنة الدائمة بدراسة البرامج المقترحة ثم إرساهها إلى محكمين من أعضاء هيئة التدريس من ذوي الخبرة والدراية\nبالبرنامج في جامعات محلية أو عالمية؛ ويتم إشعار القسم بملاحظات المحكمين لاستدراكها وإجراء التعديلات المطلوبة؛\nثم التوصية بما من مجلسي القسم والكلية، ثم التوصية بما من اللجنة الدائمة؛ ومن ثم الرفع مجلس الجامعة.\n4- تدرس اللجنة الدائمة أي برنامج مقترح وتتولى التنسيق بين متطلباته ومتطلبات البرامج الأخرى لتفادي الازدواجية\nفيما بينها وتعطى الأفضلية للبرامج البينية المشتركة.\nه- تقوم اللجنة الدائمة بإقرار النماذج والأدلة الإرشادية، وخطط وبرامج التوجيه الأكاديمي المعدة من قبل الإدارة\nالتنفيذية؛ لغرض تنظيم إجراءات برامج الدراسات العلياء بما يتوافق مع هذه اللائحة وقواعدها التنفيذية، وبما يتسق\nمع النماذج والأدلة المعتمدة في الجامعة.\nالمادة الشاصنة:\nتجتمع اللجنة الدائمة بدعوة من رئيسها مرة واحدة كل شهر على الأقل، ولا يصح الاجتماع إلا بحضور ثلثي أعضائها على\nالأقل من فيهم الرئيس، أو من ينوب عنه من بين أعضاء اللجنة الدائمة، وتصدر قراراتها بأغلبية أصوات الأعضاء\nالحاضرينء وعن التساوي يُرجح الجانب الذي صوّت معه رئيس الاجتماع وثعد قرارات اللجنة الدائمة نافذة، مالم يرد\nعليها اعتراض من رئيس الجامعة خلال خمسة عشزيوماً من تاريخ وصوها إليهة.فإن اعترض عليها رئيس الجامعة أعادها إلى\nاللجنة الدائمة - مشفوعة بوجهة نظره - لدراستها من جديد, فإن بقيت اللجنة الدائمة على رأيها فتحال القرارات\nالمعترض عليها إلى مجلس الجامعة للبت فيها في أول جلسة عادية أو استثنائية، ومجلس الجامعة تصديق القرارات أو تعديلها\nأو إلغاؤهاء ويكون قرار مجلس الجامعة في ذلك تمائياً، ولرئيس اللجنة الدائمة دعوة من يرى ضرورة حضوره لبعض جلسات\n9 اللجنة الدائمة، دون أن.يكون له حق التصويت.\nلإأنوعء ا أوناهحاة8 © وك نالع اط ه6اء3ةأممء !ا\nهك5.نالع.ناط","a":["القاعدة التنفيذية للمادة السابعة","المادة الشاصنة"]},{"d":"bu1447","p":8,"l":"ar","t":"0-2 : عقا ذاقافهاة الالاذد5ك 08 /6001/١اكا\nوكالة العمنادة لشؤون\nالدراسات العليا والابتعاث\nآ[آ[آ[آ[آ||يييييييبببببإبإبإبإبإبإبإبإبإبإبإبإبإبإبإبإبإيإيإيإيإيإيإيإيإيإيبيبيبيبيبببيبيبيبيبيبيبيبيببيبيب يب آ آظ ظ [آ[آآ |0\nالفصل السادس: البرامج الدراسية ونظام الدراسة\nالمادة التاسعة:\nيجوز استحداث برامج مشتركة للدراسات العليا بين الأقسام, أو بين الكليات، أو المعاهد داخل الجامعة: أو بين الجامعة\nومؤوسسات تعليمية أو بحثية من داخل المملكة أو من خارجهاء وفق قواعد يُقرّها مجلس الجامعة بناءً على توصية اللجنة\nالدائمة؛ بعد التدسيق مع الكليات والأقسام: أو الجهات المعنية.\nالقاعدة التنفيذية للمادة التاسعة\nأولا: القواعد العامة:\n-١ يطبق على البرامج المشتركة - داخل الجامعة - وطلاجما جميع ما يطبق على غيرها من البرامج .\n؟- تشكل جنة تضم ممثلين من البرامج المشاركة داخل الجامعة للإشراف على البرنامج، وضمان معايير الجودة.. وعتابعة\nمن اللجنة الدائمة للدراسات العليا.\n*- تقدم اللجنة المشتركة الاقتراحات إلى مجالس الأقسام المعنية للتوصية بشأنها ويتم تأيبدها:من قبل مجالس الكليات\nالمعنية، والرفع بتوصياتها الى اللجنة الدائمة للدراسات العليا.\n4- تشرف اللجنة الدائمة للدراسات العليا على البرامج المشتركة مع مؤسسات تعليمية أو بحثية من داخل المملكة أو\nمن خارجها ويساندها القسم المشارك في البرنامج من داخل الجامعة .\nه- يتولى القسم الذي يساند في الإشراف على البرنامج المشترك والكلية التابع لما التوصية بكافة الإجراءات التي تتطلب\nمجلسي القسم والكلية بما نصت عليه هذه اللائحة، ويتم الرفع بتوصياتها إلى اللجنة الدائمة للدراسات العليا.\nثانيا: قواعد إقرار برامج الدراسات العليا المشتركة:\n-١ يجب أن يكون إقرار اتفاقية/ برامج الدراسات العليا المشتركة لتحقيق التكامل بين المؤسستين التعليميتين على\nاختلاف مستويات تلك البرامج: ولرفع جودة البرامج الأكاديمية وتحسين مخرجات التعليم بما يتماشى مع معايير\nالاعتماد الأكاديمي؛ ورفع كفاءة استثمار الموارد البشرية: والاستفادة من المزايا الأكاديمية والقانونية لدى كل\nطرف من أطراف البرنامج المشترك.\n؟- يتولى المعهد إدارة تنفيذ البرامج المشتركة بالتنسيق مع وحدات الجامعة ومجالسها المختصة وفق الأنظمة واللوائح\nالمتبعة وذلك من خلال اتفاقية أو مذكرة تفاهم توضح جميع الجوانب المتعلقة بالشراكة بما في ذلك حقوق\nوواجبات الأطراف: وتوزيع المهام: وآليات التنفيذ؛ والالتزام باللوائح والأنظمة الداخلية أو المتبعة لدى المؤسستين\n2 المتعلقة بالدراسات العليا بحسب نوع الشراكة.\nبرانومءناتمتاقطة8© ا دكسلع نط هاءقامى م 1ك\nد5.نالع.ناط","a":["المادة التاسعة","القاعدة التنفيذية للمادة التاسعة"]},{"d":"bu1447","p":9,"l":"ar","t":"0 مكاح ناكار اح العطدي - لي سدم\n##وكالةالعماذةة لشؤون\n*- يلتزم المعهد أو الطرف المشارك في البرامج المشتركة بالحصول على الموافقات اللازمة من المجالس المختصة لديه أو\nالجهات المشرفة إذا تطلب الأمر ذلك ويكون كل طرف مسؤول عما يخصه؛ دون أدى مسؤولية عن إخلال\nالطرف الآخر بالتزاماته.\n4 - تُشّكل لجنة عُليا وفقاً لاتفاقية تنفيذ البرنامج المشترك الإشراف على البرنامج تتكون من ممثلين عن الأطراف\nالمشاركة وتتولى إقرار المناهج والخطط الدراسية وخطط القبول والتقييم ومعالجة القضايا الأكاديمية المشتركة دون\nإخلال: بالصلاحيات المخولة بموجب الأنظمة التي يخضع لها طرفي البرنامج المشترك وللجنة العليا تشكيل لجان\nفرعية للبرنامج في جوانب تخصصية مثل (لجنة المناهج والخطط الدراسية: ومجنة القبول، وجنة التقييم).\nه- يجب أن يتم الاتفاق ومن خلال اللجنة العليا على اليكلة الأكاديمية للبرنامج وخطته الدراسية مع التأكد من كون\nالخطة تعزز مزايا الشراكة بين الطرفين وتحديد معايير القبول والفئة المستهدفة: مع تقديم برامج تحضيرية إذا لزم\nالأمر لضمان تأهيل الطلاب, وبما يتفق مع اللوائح ذات الصلة.\n5- تحدد اللجنة العليا أو اتفاقية تنفيذ البرنامج حسب الأحوال آلية تقييم الطلبة ومسيرتم الدراسية، ووضع\nالسياسات الأكاديمية بما يتفق ولوائح الطرفين (الانسحابء إعادة القيد. الغشء؛ التخرج) والإشراف الأكاديمي:\nوالتدريس.\nيتم تسكين البرامج المشتركة في الكليات أو الأقسام التابعة لها البرامج أكاديمياً أو في أقرب كلية؛ لدى الطرفين أو\nأحدهما ويتولى المعهد الإشراف على تنفيذ ذلك بعد أخذ موافقة رئيس الجامعة.\n8- تصدر الشهاذات من الطرفين أو من أحد الأطراف حسب طبيعة البرنامج مع ضمان الاعتراف بما من جميع\nالجهات المشاركة؛ وتصدر حسب الإجراءات المعتمدة لدى كل طرف.\n9- يتولى المعهد مراجعة البرنامج بشكل دوري لضمان استمرارية الامتثال لمتطلبات الجودة وأن يكون البرنامج لدى\nأحد الأطراف على الأقل معتمداً أكاديمياً من مؤسسة أو هيئة معترف يما.\n- يحدد المعهد أو اللجنة العليا حسب الأحوال المرافق اللازمة لتنفيذ البرنامج بما في ذلك القاعات الدراسية\nوالمعامل: المكتبات، وقواعد البيانات البحثية؛ والمنصات الإلكترونية التي يتم من خلاها إدارة وتقديم الخدمات\nالتعليمية والدعم الأكاديمي والإداري والمالي؛ وآلية تقدبم الدعم الفني وخدمات الإرشاد الأكاديمي: والوصول إلى\nمصادر المعرفة: والتقارير الدورية والسنوية ومن يقدمها وآلية تقييمها.\n- يتولى المعهد بالاتفاق مع الطرف المشارك في تنفيذ البرنامج:\n** آلية تمويل وتشغيل البرامج: تشمل التكاليف التشغيلية، رواتب ومكافآت ومزايا أعضاء هيئة التدريس ومن في\nحكمهم وتكاليف الجوانب الإدارية والخدمات المساندة.\n** وضع وتحديد الرسوم الدراسية وتوزيع التكاليف والأرباح إذا كانت البرامج مدفوعة التكلفة من المستفيدين.\n** موعد وجاهزية البرنامج للطرح والإعلان عبر مواقع الجهات المشاركة ومنصات التواصل الاجتماعي؛ والتسويق\nله لدى الغير وإبراز مميزاته مثل الشراكات الدولية، الاعتماد الأكاديمي؛ وفرص العملء وتحديد أدوار الأطراف\nو المشتركة في البرنامج.\nفس ايت ما ميال سج هد 00 ١\nكاله اط","a":[]},{"d":"bu1447","p":10,"l":"ar","t":"عتحاد 8 الارادكا زا حت قفي ا --\nالدراسات العليا والابتعاث\n** وضع آلية لحل الخلافات التي قد تنشأ بين الأطراف: سواء أكاديمية أو إدارية.\n*** وضع سياسة الخصوصية والسرية: وحقوق الملكية: وإنهاء البرامج المشتركة أو انتهائها وحقوق المستفيدين؛\nوحقوق الأطراف الأخرى الناشئة عن تقديم البرامج المشتركة.\n** اعتماد اتفاقية الشراكة أو مذكرة التفاهم من مجلس الجامعة.\nالمادة العاشسرة.\nلا تقل عدد الوحدات الدراسية التي يدرسها طالب الدراسات العليا في الجامعة التي ستمنحه الدرجة العلمية عن خمسين في\nالمائة من إجمالي عدد الوحدات المطلوبة لمنح الدرجة العلمية، ويجب أن يُنجز الطالب بحث التخرج أو رسالته العلمية - إن\nوجدا - بالكامل تحت إشرافهاء ويستثنى من هذه المادة طلاب البرامج المشتركة.\nالمادة الحادية عشسرة:\nتكون الدراسة للدبلوم العاللي بالمقررات الدراسية والأعمال الميدانية والتطبيقية والمعملية، على أن تكون مدة دراسة البرنامج\nوعدد الوحدات الدراسية وفق ما هو محدد في التصنيف والإطار، ومجلس الجامعة بناءً على اقتراح اللجنة الدائمة زيادة مدة\nدراسة أي برنامج، بما لا يتجاوز نصف المدة المقررة:\nالقاعدة التنفيذية للمادة الحادية عشرة\n-١ تحدد مدة دراسة البرنامج وعدد الوحدات الدراسية وفق التصنيف والإطار للمؤهلات وما يطرأ\nعليهما من تحديئات.\n-١ يشترط للالتحاق ببرامج الدبلوم العاليي الحصول على مؤهل البكالوريوس.\n- أن يكون مسمى الدرجة العلمية في الشهادة على النحو الاقي: الدبلوم العالي في (تخصص\nالبرنامج): ويجوز إضافة المسارات إلى مسمى الدرجة العلمية للبرنامج.\nالمادة الثانية عشسرة:\nتكون الدراسة للماجستير إمَا بالمقررات الدراسية فقطء أو بالمقررات الدراسية والرسالة العلمية، أو بالمقررات الدراسية\nوالاختبار الشافل؛ أو بالمقررات الدراسية وبحث التخرج؛ على أن تكون مدة دراسة البرنامج وعدد الوحدات الدراسية وفق\nما هو محدد في التصنيف والإطارء ومجلس الجامعة بناءً على اقتراح اللجنة الدائمة زيادة مدة دراسة أي برنامج: بما لا يعجاوز\nو نصف المدة المقررة.\nلإانىمء7أمتاهاطة8 © هك نالع نط هاء5 11م 1","a":["المادة العاشسرة.","المادة طلاب البرامج المشتركة.","المادة الحادية عشسرة","القاعدة التنفيذية للمادة الحادية عشرة","المادة الثانية عشسرة"]},{"d":"bu1447","p":11,"l":"ar","t":"عهادة الارتكازوا بعت الغلفي 2 سدم\nا وكالة العمنادة لشؤون\nالدراسات العليا والابتعاث 1\nالقاعدة التنفيذية للمادة الثانية عشرة\n١ - مدة دراسة البرنامج وعدد الوحدات الدراسية يتم تحديدها وفق ما هو محدد في التصنيف السعودي\nالموحد للمستويات والتخصصات التعليمية والإطار الوطني للمؤهلات وما يطرأ عليها من تحديئات.\n؟- يكون اختيار طريقة الدراسة في برنامج الماجستير حسب طبيعة البرنامج وأهدافه بناءً على توصية القسم\nوتأييد مجلس الكلية وإقرارها من اللجنة الدائمة للدراسات العليا.\n#- مدة دراسة الماجستير لا تقل عن سنتين ويجوز تمديد الدراسة لمدة لا تتجاوز نصف المدة المقررة بتوصية\nمن مجلسي القسم والكلية وتأييد اللجنة الدائمة للدراسات العليا.\nالمادة الشالكة عششرة:\nيقرٌ مجلس الجامعة بناءً على توصية اللجنة الدائمة أسلوب دراسة الدكتوراه؛ على أن تكون مدة دراسة البرنامج وعدد\nالوحدات الدراسية المقررة وفق ما هو محدد في التصنيف والإطار، ومجلس الجامعة بناءً على اقتراح اللجنة الدائمة زيادة مدة\nدراسة أي برنامجء بما لا يتجاوز نصف المدة المقررة.\nالقاعدة التنفيذية للمادة الثالثة عشرة\n-١ يكون اختيار طريقة الدراسة في برنامج الدكتوراه بناءً على توصية القسم: وتأيبد مجلس الكلية وإقرازها من\nاللجنة الدائمة للدراسات العليا.\n-٠ مدة دراسة الدكتوراه لا تقل عن ثلاث سنوات، ويجوز تمديد الدراسة لمدة لا تتجاوز نصف المدة المقررة\nبتوصية من مجلسي القسم والكلية وتأييد اللجنة الدائمة للدراسات العليا.\nالمادة الرابعة عشرة:\nنُسب مدة الحصول على الدرجة العلمية من بداية التسجيل في مقررات الدراسات العليا للبرنامج الملتحق بما الطالب حتى\nتاريخ استكمال متطلبات البرنامج؛ أو تقديم المشسرف على الطالب تقريراً إلى رئيس القسم مرفقاً به نسخة من الرسالة\nالعلمية إن وجدت.\nبرانوعع انمتاقطق8 © وك نالع نط © أعقأممء 0 ا أ\nدك5.نالع.ناط","a":["القاعدة التنفيذية للمادة الثانية عشرة","المادة الشالكة عششرة","القاعدة التنفيذية للمادة الثالثة عشرة","المادة الرابعة عشرة"]},{"d":"bu1447","p":12,"l":"ar","t":"عضاذة الإبتكاري بحت الفلفي 7 0 0\n5 وكالة العماتة لشؤون ا\nالفصل السابح: القبول\nالحادة الخافسة صسرة.\nتتولى الإدارة التنفيذية تنفيذ الإجراءات الأكاديمية، بما في ذلك قبول الطلاب وتسجيلهمء وفق أحكام هذه اللائحة\nوالضوابط المقرة من مجلس الجامعة.\nالقاعدة التنفيذية للمادة الخامسة عشرة\n-١ تتولى الإدارة التنفيذية للدراسات العليا تطبيق شروط القبول المقرة من مجلس الجامعة، وعلى الأقسام العلمية التأكد\nمن استيفاء كل متقده للشروط.\n1٠ تتولى الإذارة التنفيذية اعتماد إعلان نتائج القبول النهائي.\nتتولى الإدارة التنفيذية بالتدسيق مع الأقسام العلمية وعمادة القبول والتسجيل تسجيل المقررات وإصدار الجداول\nالدراسية.\n4- يشترط تقديم طلب القبول ببرامج الدراسات العليا خلال الأوقات المحددة من الإدارة التنفيذية والمعلنة في الموقع\nالرسمي.\nالمادة السادسة عشرة:\nمع مراعاة ما ورد في المادة (الخامسة عشرة) من هذه اللائحة؛ يجوز قبول الطالب في غير مجال تخصصه بناء على توصية من\nمجلس القسم المختضص، وموافقة من مجلس الكلية.\nالقاعدة التنفيذية للمادة السادسة عشرة\nعلى الأقسام العلمية الراغبة في قبول الطلاب في غير مجال تخصصاتهم تحديد التخصصات التي يمكنهم القبول فيها بدقة\nوتحديد المقررات التكميلية المطلوب اجتيازها.\nالمادة السابعة عشرة:\nللقسم المختض أن يشترط لقبول الطالت في مرحلتي ا ماجستير والدكتوراه اجتياز عدد من المقررات التكميلية من مرحلة\nسابقة، أو تجاوز اختبار نواتج تعلم متصلة بما؛ ليصبح الطالب مؤهلاً للالتحاق بالبرنامج؛ وفق ضوابط تقرها اللجنة الدائمة،\n2 بناءً على اقتراح من مجلس القسم وتأييد من مجلس الكلية.\nبه ري البرك م 10000\n7 77 ع 7 : 9 و اسم الولدون يد 1 0\nلإازىمء/أوتاهاة8 © هك نالع .نا 6ا013ء 1 1 ا\n53.نالع.ناط","a":["القاعدة التنفيذية للمادة الخامسة عشرة","المادة السادسة عشرة","المادة (الخامسة عشرة) من هذه اللائحة","القاعدة التنفيذية للمادة السادسة عشرة","المادة السابعة عشرة"]},{"d":"bu1447","p":13,"l":"ar","t":"عمادة ااشكا وليحث لعلف 0\n8 وخالةا وق لشؤون التعليم 0(0اكمع نامع ع0 81والازالا\nالقاعدة التنفيذية للمادة السابعة عشرة\n-١ يحدد القسم العلمي المقررات التكميلية بناءً على الخلفية الأكاديمية للطالب وتخصصه السابق مقارنة\nبمتطلبات البرنامج الذي ينوي الالتحاق به.\n؟- اجتياز المقررات التكميلية في مدة لا تزيد عن عام دراسي ولا يتجاوز عدد المقررات (4) بحد أقصى\nحسب ما يتم إقراره من القسم العلمي: ويجوز للجنة الدائمة للدراسات العليا الاستغناء من ذلك بناء\nعلى توضية مجلس القسم واقرار مجلس الكلية.\n#- لا تسب الملة الزمنية لاجتياز المقررات التكميلية ضمن المدة النظامية:للحصول على الدرجة.\n4 - لا تدخل المقررات التكميلية في احتساب المعدل التراكمي لمرحلة الدراسات العليا.\nه- ألا يقل معدله التراكمي في المقررات التكميلية عن جيد جداً.\n5- عدم إكمال المقررات التكميلية في الإطار الزمني المحدد قد يؤثر على أهلية الطالب للاستمرار في البرنامج.\nالمادة الشامنة عشرة:\nيجوز قبول التحاق الطالب ببرنامجين للدراسات العليا في وقت واحد, على أن يكون البرنامجان من نفس المرحلة أو من مرحلة\nسابقة، وفق ضوابظ يقرها مجلس الجامعة, بناءً على توصية اللجنة الدائمة.\nالقاعدة التنفيذية للمادة الثامنة عشرة\n-١ أن تنطبق على الطالب شروط القبول المطلوب توافرها في كل برنامج على حده.\n؟- عادةٌ ما يتطلب القبول الحصول على موافقة من كلا القسمين أو الكليتين المشرفتين على البرنامجين.\n*- ألا تزيد المقررات المعادلة أو المشتركة بين البرنامجين عن ( ٠ 08 ) من مجموع مقررات الدرجة العلمية\n4- ألا يترتب على التحاق الطالب بالبرنامجين إخلال بالعملية التعليمية أو الأنظمة والضوابط الخاصة بالجامعة\nأو إحداث تعارض بينها.\nه- انسحاب الطالب من برنامج دراسي لا يؤدي تلقائياً إلى إغاء التسجيل في برنامج آخر.\nالمادة التاسعة عشرة:\nيجوز معادلة مقررات دراسية سبق للطالب اجتيازها في جامعة أو مؤسسة تعليمية داخل المملكة؛ أو من خارج ١ لمملكة على\n32 أن تكون مرخصة من جهة الاختصاص في بلد الدراسة؛ بناءً على توصية مجلس القسمء وموافقة من مجلس الكلية, وتُتبّت\nعملكة العربية السعودية لباحة ص «(1988) 13\nللم فيم ياب بيلك سمه 0 1\nلإأنىمة أ لاتاهلاة8 © دك نالع .اط هاءةأمامء 18 |\nهك5.نالع.ناط","a":["القاعدة التنفيذية للمادة السابعة عشرة","المادة الشامنة عشرة","القاعدة التنفيذية للمادة الثامنة عشرة","المادة التاسعة عشرة"]},{"d":"bu1447","p":14,"l":"ar","t":". ا ذاقههم املاهد ع0 /6001ل ناا\n“#لاوكالة العقفقهادة لشؤون .\nالمقررات الدراسية التي تم معادلتها في السجل الأكاديمي للطالب، ويحدد مجلس الجامعة الضوابط المنظمة لذلكء بما فيها\nإمكانية احتسابما ضمن المعدل التراكمي للطالب في سجله الأكاديمي.\nالقاعدة التنفيذية للمادة التاسعة عشرة\nيجوز احتساب عدد الوحدات الدراسية التي درسها الطالب طبقا للآتي:\n-١ ألا يكون قد مضى على دراسته للوحدات المعادلة أكثر من ثلاثة سنوات دراسية.\n؟- أن تكون مفردات المقررات متشابحة أو متكافئة بما لا يقل عن ٠ 7/0.19.\n- ألا يقل تقديره في الوحدات المعادلة عن (جيل جدا).\n4- لا تحتسب الوحدات المعادلة ضمن المعدل التراكمي إذا كانت من خارج الجامعة ويجوز احتسابما إذا كانت من داخل\nالجامعة.\nه- تكون المعاذلة بتوصية من مجلس القسم :الذي يتبع له المقرر وموافقة مجلس الكلية.\nالمادة العشرون:\nيجوز بموافقة مجلس القسم المختص وعميد الكلية تأجيل الطالب قبوله؛ ويكون لمرة واحدة؛ ولا يمكن قبول التأجيل بعد بدء\nالطالب دراسته؛ وفق ضوابط يقرها مجلس الجامعة: بناءً على اقتراح اللجنة الدائمة.\nالقاعدة التنفيذية للمادة العشرين\n-١ يجب تقديم طلب تأجيل القبول قبل بدء العام الدراسي بأسبوعين على الأقل وذلك بتعبئة النموذج الخاص\n؟- يدرس القسم العلمي مبررات التأجيل ويرفع قراره لعميد الكلية؛ ولا يقبل في حال لم تكن الأسباب مقنعة،\nأو كان هناك تأثير في الأعداد المحددة للقبول في البرنامج مستقبلاً.\n- أن يكون تأجيل القبول عام دراسي ولمرة واحدة فقط، وفي حال عدم إتاحة البرنامج لاحقاً فإن الجامعة\nغير ملزمة بتقديم المقررات المتبقية في خطة للطالب.\n- يطبق على الطالب أي أنظمة جديدة خاصة بالبرنامج أو الجامعة والتي تكون سارية عند إعادة الالتحاق.\nبإأزوعء /اأمناةاة8 © د5.نالع.ناط ©6اء3 ألم #0 ل","a":["القاعدة التنفيذية للمادة التاسعة عشرة","المادة العشرون","القاعدة التنفيذية للمادة العشرين"]},{"d":"bu1447","p":15,"l":"ar","t":"عفاذة الأبتفازاهملليضث ا المملكة.العربية السعودينة\nم : ا ذاقفقمْ الاذدك 08 /ا6001لذاكا\nوكالة العممعادة لشؤون ١\nالدراسات العليا والابتعاث\nالمادة الحادية والعشرون:\nمع مراعاة ما يصدر من مجلس شؤون الجامعات من قرارات، يجوز أن تتقاضى الجامعة:\n١-رسوماً دراسية أو مقابلاً مالياً؛ لتقديم برامج أو مقررات الدراسات العلياء على أن تكون تلك البرامج حاصلة على\nالاعتماد البرامجي: وبعدد طلاب لا يتجاوز عدد الطلاب المقبولين - لنفس البرامج أو المقررات - بدون رسوم أو\nمقابل مالي ويضع مجلس الجامعة الضوابط المنظمة لذلكء بناءً على توصية من اللجنة الدائمة.\n؟-مقابلاً مالياً للخدمات المرتبطة بالدراسات العليا والمساندة لهاء وفق ضوابظ يقرها مجلس الجامعة، بناءً على توصية\nاللجنة الدائمة.\nالقاعدة التنفيذية للمادة الحادية والعشرين\nتقترح اللجنة الدائمة آليات تحديد المقابل الماليي - إن وجد - لبرامج الدراسات العليا والخدمات المرتبطة: بالدراسات العليا\nوالمساندة ها وترفع توصياتها مجلس الجامعة.\nالفصل الثامن: الإجراءات الأكاديمية\nالمادة الثانية والعشرون:\nيجوز للطالب تأجيل الدراسة بتوصية من مجلس القسم المختص وموافقة مجلس الكلية, وفق ضوابط يقرها مجلس الجامعة,\nبناءً على اقتراح اللجنة الدائمة.\nالقاعدة التنفيذية للمادة الثانية و العشرين\n-١ يجب أن يقدم الطالب أسباب منطقية ومشروعة لطلب تأجيل الدراسة.\n؟- يقوم الطالب بتعبئة النموذج المعد لذلك من قبل الإدارة التنفيذية للدراسات العلياء وتكون الموافقة بناءً\nعلى توصيّة من مجلس القسم المختص:وموافقة مجلس الكلية.\n- أن يكون الطالب قد اجتاز فصلاً دراسياً أو أكثر أو أنجز قدراً مناسباً من الرسالة.\n4- ألا يتجاوز مجموع مدة التأجيل (*) فصول دراسية متفرقة أو فصلين دراسيين متتاليين\nه- لا تحعسب مدة التأجيل في المدة النظامية لإكمال الدراسة.\nات لوب ا سد ليهلا 15 ا\nلإاأوعء“أوتاهاة8 © وك نالع.ناطهاعواموء :1 العا\nهك5.نالع.ناط","a":["المادة الحادية والعشرون","القاعدة التنفيذية للمادة الحادية والعشري","المادة الثانية والعشرون","القاعدة التنفيذية للمادة الثانية و العشر"]},{"d":"bu1447","p":16,"l":"ar","t":"0 5 ع م ذاقذفق8 اللاذد +0 /6001لذاكا\n© الدراسات الغليا #الارتعاتث وزار اع 0(1اتمعنامع عه /والزالر\nالمادة الثالثة والعشرون:\nيجوز للطالب الاعتذار عن الاستمرار في دراسة مقرر أو أكثر, أو جميع مقررات الفصل الدراسيء وذلك بعد انتهاء فترة\nالتسجيلء بتوصية من مجلس القسم المختص, وموافقة من عميد الكلية، وفق ضوابط يقرها مجلس الجامعة بناءً على اقتراح\nاللجنة الدائمة.\nالقاعدة التنفيذية للمادة الثالثة والعشرين\n-١ يجوز للطالب الاعتذار بعد تقديم أسباب ومبررات مقنعة وبناء على توصية مجلس القسم وتأييد مجلس\nالكلية.\n-١ لا يجوز الاعتذار عن جميع المقررات لأكثر من () فصول دراسية: ولا يجوز الاعتذار عن مقرر أكثر من\nمرة واحدة.\n*- يحتسب الفصل الذي تم فيه الاعتذار عن جميع المقررات الدراسية ضمن مدد التأجيل والاعتذار المشار\nإليها في المادة (7؟7) من هذه اللائحة.\n4- ألا يتجاوز عدد مرات الاعتذار (عن أكثر من مقرر) عن مرتين كحد أقصى خلال المرحلة الدراسية.\nه- أن يتقدم بطلب الاعتذار بحسب ما هو معلن في التقويم الجامعي المعتمد من مجلس الجامعة.\nالمادة الرابعة والعشرون:\nإذا انسحب طالب الدراسات العليا من الجامعة ثم أراد الالتحاق بما مجدداً يوز للجامعة أن تطبق عليه شروط القبول وقت\nالتقديم الجديد.\nالمادة الخامسة العشرون:\nيُعدَ الطالب منقطعاً عن الدراسة إذا لم يمسجل خلال الفترة احددة للتسجيل في كل فصل دراسي متاح له التسجيل فيه.\nالمادة السادسة والعششرون:\n20-١ _يُلغى قيد الطالب في الحالات الآتية:\nأ- إذاانقطع عن الدراسة: وفقاً لأحكام المادة (الخامسة والعشرزين) من هذه اللائحة.\nب- إذا لم يجتز المقررات التكميلية، وفق الضوابط التي تقرها اللجنة الدائمة.\nنو ج- إذا انخفض معدله التراكمي عن تقدير (جيد جداً) في فصلين دراسيين متتاليين.\nبإانىمء/اأوناهداة8 © 52 نالع .ناط 6اء3 01م 5 1 1","a":["المادة الثالثة والعشرون","القاعدة التنفيذية للمادة الثالثة والعشري","المادة (7؟7) من هذه اللائحة.","المادة الرابعة والعشرون","المادة الخامسة العشرون","المادة السادسة والعششرون","المادة (الخامسة والعشرزين) من هذه ال"]},{"d":"bu1447","p":17,"l":"ar","t":"0 ا 9 كتف للقي ذاقهعم امناذد عه امت لاا\n5 الدراسات العليا والابتعاث جامعة الباحة 85177 لاالانا هاة8-امه\nد-إذا اتضح أن قبوله مبني على تقديمه معلومات أو وثائق غير ضحيحة كلياً أو جزئياً.\nه- إذا لم يحصل على الدرجة العلمية خلال المدة المحددة للبرنامج.\n؟-0 يلغى قيد الطالب بقرار من اللجنة الدائمة، بناءً على توصية مجلس القسمء وتأييد من مجلس الكلية في الحالات\nالآتية:\nأ- إذا ثبت عدم جديته في مرحلة الرسالة العلمية وفقاً لأحكام المادة (الرابعة والأربعين) من هذه اللائحة.\nب-إذ
