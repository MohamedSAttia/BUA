ة الدكتوراه،\nإذا كان لديه بحثان - بش مجال تخصصه - منشوران؛ أو مقبولان للنشر بش مجلة\nالمادة التاسعة والتلاتثون\nيجوز أن يقوم بالإشراف أو المساعدة 4 الإشراف على الرسائل العلمية مشرفون\nمن ذوي الخبرة والكفاءة ل مجال بحث الرسالة العلمية من غير أعضاء هيئة\nالتدريس، سواء من داخل الجامعة أو من خارجهاء بناءً على توصية مجلس\nالقسم وموافقة مجلس الكلية.\nالمادة الأربعون\nيضع مجلس الجامعة ضوابط المشرفين المساعدين على الرسائل العلمية: بناءً\nعلى اقتراح اللجنة الدائمة.\nالمادة الحادية والأربعون\nيجوز لعضو هيئة التدريس الإشراف على رسائل علمية خارج جامعته -سواء\nداخل المملكة أو خارجها-؛ بما لا يخل بواجباته الوظيفية؛ وفق ضوابط يقرها\nمجلس الجامعة:؛ بناءً على اقتراح اللجنة الدائمة.\nالمادة التانية والأربعون\nيقوم المشرف بتقييم أداء الطالب 4 نهاية كل فصل دراسي،؛ وتحديد مدى تقدمه\nالرسالة العلمية: وفقاً للآئيات التي تقرها اللجنة الدائمة.\nالمادة التالتة والأربعون\nلا يقل عدد الطلاب المسجلين ل الشعبة لمقرربحث التخرح عن خمسة طلاب،\nولمجلس الكلية الاستثناء من الحد الأدنى، وفق ضوابط يقرها مجلس الجامعة:\nبناءً على اقتراح اللجنة الدائمة.\nاللائحة المنظمة للدراسات العليا 4 الجامعات\nالصادرة بقرار مجلس شؤون الجامعات رقم (؟1544/9/1١)\nالمتخن ل الاجتماع التاسع المعقود بتاريخ ١444/١/8 هه الموافق ١/77/8١1م","a":["المادة الثامنة والتلاثون","المادة التاسعة والتلاتثون","المادة الأربعون","المادة الحادية والأربعون","المادة التانية والأربعون","المادة التالتة والأربعون"]},{"d":"cua","p":22,"l":"ar","t":"المادة الرابعة والأربعون\nإذا ثبت عدم جدية الطالب 2 مرحلة الرسالة العلمية؛ بناءٌ على تقرير المشرف\nعلى الرسالة العلمية:، يتم إنذار الطالب بخطاب من القسم المختص؛ء وإذا أنذر\nالطالب مرتين ولم يتلاف أسباب الإنذار يُلغى قيده؛ بناءً على توصية مجلسي\nالقسم والكلية.\nالمادة الخامسة والأربعون\nيحق للمشرفء سواءً كان منفرداً أو مشتركاً مع غيره؛ أن يُشرف بحد أقصى على\nسبع رسائل علمية 4 وقت واحد، وللجنة الدائمة الاستثناء من ذلكء؛ بناءٌ على\nتوصية مجلسي القسم والكلية: وفق ضوابط يقرها مجلس الجامعة بناءٌ على\nاقتراح اللجنة الدائمة.\nالمادة السادسة والأربعون\nيُحسب نصاب الإشراف لعضو هيئة التدريس؛ سواءٌ كان رئيساً أو مساعداًء على\nكل رسالة ضمن العبء التدريسي؛ وفق ضوابط يقرها مجلس الجامعة بناءً\nعلى اقتراح اللجنة الدائمة.\nالمادة السابعة والأربعون\nيُقدم المشرف على الرسالة العلمية، بعد انتهاء الطالب من إعدادهاء تقريراً\nعن اكتمالها إلى رئيس القسم؛ مرفقاً به نسخة من الرسالة العلمية تمهيداً\nلاستكمال إجراءات المناقشة: التي يحددها مجلس الكلية.\nالمادة الثامنة والأربعون\nتكوّن لجنة لمناقشة الرسالة العلمية بقرارمن مجلس الكلية؛ بناءً على توصية\nمجلس القسم.\nالمادة التاسعة والأربعون\nيضع مجلس الجامعة ضوابط اختيار أعضاء لجان مناقشة رسائل الماجستير\nوالدكتوراه وآلية إجراء تلك المناقشات: بناءً على اقتراح اللجنة الدائمة.\nاللائحة المنظمة للدراسات العليا 4 الجامعات\nالصادرة بقرار مجلس شؤون الجامعات رقم (1444/9/5)\nالمتخن # الاجتماع التاسع المعقود بتاريخ 1444/1/7 هه الموافق ١/1011/4م\nلقف كا بحآ[ طز[ز[ز[ز[خ[آ[آ[آ[آ[آ#آ#آ##ك","a":["المادة الرابعة والأربعون","المادة الخامسة والأربعون","المادة السادسة والأربعون","المادة السابعة والأربعون","المادة الثامنة والأربعون","المادة التاسعة والأربعون"]},{"d":"cua","p":23,"l":"ar","t":"المادة الخمسون\nتُعد لجنة المناقشة تقريراً يُوقع من جميع أعضائهاء يُقَدّم إلى رئيس القسم\nخلال أسبوع من تاريخ المناقشة, متضمناً إحدى التوصيات الآتية:\n.١ قبول الرسالة العلمية والتوصية بمنح الدرجة.\n؟. قبول الرسالة العلمية مع إجراء بعض التعديلات، دون مناقشتها مرة\nأخرى؛ ويفوّض أحد أعضاء لجنة المناقشة بالتوصية بمنح الدرجة بعد\nالتأكد من الأخن بهذه التعديلات 4 مدة لا تتجاوزثلاثة أشهر من تاريخ\nالمناقشة: وللجلس الكلية الاستثناء من ذلك على ألا يتجاوزستة أشهرمن\nتاريخ المناقشة.\n*. استكمال أوجه النقص ي الرسالة العلمية: وتعيد اللجنة مناقشتها خلال\nالفترة التي يحددها مجلس الكلية؛ بناءً على توصية مجلس القسم\nالمختصء على ألا تزيد عن سنة واحدة من تاريخ المناقشة.\n:. عدم قبول الرسالة العلمية.\nولكل عضو من لجنة المناقشة على الرسالة العلميةالحق 4# أن يقدم ما لديه من\nمرئيات مغايرة أو تحفظات ةْ تقرير مفصل إلى رئيس القسم ل مدة لا تتجاوز\nأسبوعاً من تاريخ المناقشة؛ ويُرفع إلى عميد الكلية مع تقرير لجنة المناقشة.\nالمادة الحادية والخمسون\n.١ يُصرف للمشرف على رسالة الماجستير من خارج الجامعة مكافأة مقطوعة\nمقدارها )مه خمسة آلاف ريال، كما يصرف للمشرف على رسالة\nالدكتوراه من خارج الجامعة مكافأة مقطوعة مقدارها )٠٠٠١( سبعةآلاف\n؟. يجوزإذا استدعى الأمر مقابلة الأستاذ المشرف الخارجي للطلبة المشرف\nعليهم وبموافقة اللجنة الدائمة:؛ بناءً على طلب من الجامعة التي يتبع\nلها الطالب انتداب المشرف الخارجي على رسائل الماجستير أو الدكتوراه،\nوفق ما يلي:\nاللائحة المنظمة للدراسات العليا 4 الجامعات\nالصادرة بقرار مجلس شؤون الجامعات رقم (؟1544/9/1١)\nالمتخن الاجتماع التاسع المعقود بتاريخ ١544/١/7 ه الموافق ١/17/8١1م","a":["المادة الخمسون","المادة الحادية والخمسون"]},{"d":"cua","p":24,"l":"ar","t":"أ. ألا يتجاوز مرتين ْ كل عام دراسي لكل جامعة خارجية يُشرف على\nرسائل طلبة فيها.\nب. آلا يتجاوز عدد الجامعات التي ينتدب لها جامعتين 4 كل عام دراسي.\nج.ألا تتجاوزمدة الانتداب 4 كل مرة ثلاثة أيام.\nد. ألا يتجاوز مجموع أيام الانتداب عشرة أيام يك العام الدراسي لجميع\nالجامعات.\nه. تتحمل الجامعة المستفيدة نفقات عضو هيئة التدريس المنتدب للإشراف\nعلى رسائل طلبتها وفق ما هو مقررنظاماً حسب رتبته.\n*. للجامعة تعديل المكافأة المقطوعة المشارإليها 4 الفقرة )١( من هذه المادة\nبعد صدور قرار بالموافقة من مجلس شؤون الجامعات.\nالمادة الثانية والخمسون\nيُصرف لمن يشترك 4 مناقشة رسالة ماجستير أو دكتوراه مكافأة مقطوعة\nمقدارها )٠٠٠١( ألف ريال إذا كان المناقش عضواً 4 هيئة التدريس بنفس\nالجامعة التي تقدم لها الرسالة.\nأما إذا كان المناقش من غير أعضاء هيئة التدريس 4# الجامعة التي تناقش فيها\nالرسالة سواء كان من موظفي تلك الجامعة:؛ أو من يُدعى من خارجها فتصرف له\nمكافأة مقطوعة مقدارها )16٠١( ألف وخمسماتة ريال لمناقشة رسالة الدكتوراه\nو(١٠٠٠)ألف ريال؛ لمناقشة رسالة الماجستير وتزاد المكافأة لتصبح )15٠١( ألفان\nوخمسماتة ريال إذا كان المناقش من خارج المملكة.\nوإذا كان المناقش من خارج المدينة التي بها مقر الجامعة التي تناقش فيها\nالرسالة سواء كان من داخل المملكة أو خارجها فيصرف له بالإضافة إلى المكافأة\nالمشار إليها أعلاه تذكرة إركاب من مقر إقامته واليه وأجرة السكن المناسب\nوالإعاشة وبيحد أقصى لا يتجاوز ليلتين، كما تصرف تذكرة إركاب لمرافق المناقش\nإذا كان المناقش كفيفاً ولحرم المناقشة بالإضافة إلى أجرة السكن المناسب بحد\nأقصى لا يتجاوز ليلتين.\nويجوز للجنة الدائمة إضافة ليلة أو ليلتين 2 حالات الضرورة؛ وإذا ما اقتضت\nالصادرة بقار مجلس شؤون الجاممات رقم (144/6/0)\nالمتخن # الاجتماع التاسع المعقود بتاريخ ١444/1/7 هه الموافق ١17/8/1١1م","a":["المادة","المادة الثانية والخمسون"]},{"d":"cua","p":25,"l":"ar","t":"ذلك طبيعة الدراسة؛ وذلك بناءً على توصية من مجلسي القسم والكلية\nالمختصين مع إيضاح المبررات للبقاء مدة تزيد على ليلتين.\nوللجامعة تعديل المكافأة الملقطوعة المشار إليها 2 هذه المادة بعد صدور قرار\nبالموافقة من مجلس شؤون الجامعات.\nالفصل الحادى عشر: التخرج ومنة الدرجة\nالمادة التالتة والخمسون\nيرفع رئيس القسم المختص تقرير لجنة المناقشة إلى عميد الكلية 4 مدة لا\nتتجاوز أسبوعين من تاريخ المناقشة؛ لرفعه إلى الإدارة التنفيذية.\nالمادة الرابعة والخمسون\nيتخرج الطالب بعد إنهاء متطلبات التخرج بنجاح حسب خطة البرنامج؛ على\nألا يقل معدله التراكمي عن المعدل الذي يحدده مجلس الجامعة لكل برنامج؛،\nعلى ألا يقل 2 كل الأحوال عن تقدير«جيد جداء.\nالمادة الخامسة والخمسون\nحال وفاة الطالب قبل تمكنه من المناقشة يُمنح الدرجة؛ وفق ضوابط يقرها\nمجلس الجامعة بناءً على اقتراح اللجنة الدائمة.\nالمادة السادسة والخمسون\nيرفع النائب أو الوكيل المختص التوصية بمنح الدرجة العلمية إلى مجلس\nالجامعة لاتخاذ القرار.\nالفصل التانى عشر: أحكام عامة\nالمادة السابعة والخمسون\n.١ مع عدم الإخلال بما ورد 4 التصنيف والإطار: ووفق ضوابط يقرها مجلس\nالجامعة بناءً على اقتراح اللجنة الدائمة: لمجلس الجامعة بناءً على تأييد\nمنالنائب أوالوكيل المختص وتوصية مجلسي القسم والكلية منح الطالب:\nاللائحة المنظمة للدراسات العليا 4 الجامعات\nالصادرة بقرار مجلس شؤون الجامعات رقم (؟1544/9/1١)\nالمتخن # الاجتماع التاسع المعقود بتاريخ ١444/1/+ ه الموافق ١/17/8١1م","a":["المادة بعد صدور قرار","المادة التالتة والخمسون","المادة الرابعة والخمسون","المادة الخامسة والخمسون","المادة السادسة والخمسون","المادة السابعة والخمسون"]},{"d":"cua","p":26,"l":"ar","t":"أ. درجة دبلوم عالي عند اجتيازه عدداً من مقررات برنامج الماجستير, دون\nأن تكون بمجموعها مؤهلة لحصوله على درجة الماجستير.\nب. درجة الماجستير عند اجتيازه عدداً من مقررات برنامج الدكتوراه؛ دون\nأن تكون بمجموعها مؤهلة لحصوله على درجة الدكتوراه.\n؟. مع عدم الإخلال بما ورد لِك الفقرة )١( من هذه المادة، لالإدارة التنفيذية\nبناءٌ على توصية مجلسي القسم والكلية منح الطالب ما يثبت اجتيازه\nعددا من مقررات الدراسات العليا دون أن تكون بمجموعها مؤهلة لحصوله\nعلى درجة علمية؛ وفق ضوابط يقرها مجلس الجامعة بناءً على اقتراح\nاللجنة الدائمة.\nالمادة الثامنة والخمسون\nحال حصول الطالب على الدرجة العلمية ذاتها من مؤسستين تعليميتين\nإطار برنامج مشترك يجوزأن تصدر وثيقة تخرج مشتركة بين المؤسستين\nالتعليميتين، أووثيقة تخرج مستقلة من أحد أو كلتا المؤسستين التعليميتين،\nويحدد مجلس الجامعة الضوابط والإجراءات المنظمة 4 ذلك بناءً على اقتراح\nمن اللجنة الدائمة.\nالمادة التاسعة والخمسون\nيستثنى من أحكام هذه اللائحة الدبلومات الصحية والزمالات الصحية فيطبق\nعليهما اللوائح والقواعد الصادرة من مجلس الجامعة.\nالمادة الستون\nيُقر مجلس كل جامعة القواعد التنفيذية لهذه اللائحة.\nالمادة الحادية والستون\nمالم يرد فيه نص خاص 2# هذه اللائحة؛ يطبق بشأنه نظام مجلس التعليم\nالعالي والجامعات الصادر بالمرسوم الملكي رقم (م/81) وتاريخ 4/ 5/ 414١ها\nللجامعات المشمولة بتطبيق هذا النظام؛ ونظام الجامعات الصادر بالمرسوم الملكي\nرقم (م/502؟) وتاريخ ؟/ */ ١44١ه للجامعات المشمولة بهذا النظام؛ ولوائحهماء\nوالأنظمة واللوائح والقرارات المعمول بها 4# المملكة.\nالصادة بقرار مجلس شؤون الجامحات رقم (11/:/1)\nالمتخن 2 الاجتماع التاسع المعقود بتاريخ 1444/1/٠ هه الموافق ١/1077/8م","a":["المادة» لالإدارة التنفيذية","المادة الثامنة والخمسون","المادة التاسعة والخمسون","المادة الستون","المادة الحادية والستون"]},{"d":"cua","p":27,"l":"ar","t":"ل959999و برب لجخا ر_ىر_ىرىرىرّرء_ٌ_ٌ ءّءّص ١ض *<٠«<١ ١ ”<<\nالمادة الثانية والستون\nتحل هذه اللائحة محل اللائتحة الموحدة للدراسات العليا ْ الجامعات الصادرة\nبقرار مجلس التعليم العالي رقم )١1517/5/9( وتاريخ ١7/8/5١11اه وتلغي ما\nيتعارض معها من أحكام.\nالمادة الثالتة والستون\nلمجلس شؤون الجامعات تفسير هذه اللاتحة.\nالمادة الرابعة والستون\nيعمل بهذه اللائحة اعتباراً من تاريخ بداية العام الدراسي 444١ه..\nاللائحة المنظمة للدراسات العليا ْ الجامعات\nالصادرة بقرار مجلس شؤون الجامعات رقم (؟1544/9/1١)\nالمتخن 2# الاجتماع التاسع المعقود بتاريخ 1444/1/8 هه الموافق ١/71/4١1م\nلللجاااججاجاججج7ججججج77 ابابا","a":["المادة الثانية والستون","المادة الثالتة والستون","المادة الرابعة والستون"]},{"d":"cua","p":28,"l":"en","t":"by Royal Decree No. (M/27) dated 2/3/1441 H shall be applied to the\nuniversities that are subject to this Law and their Regulations in addition to the effective laws, regulations, and decisions in the Kingdom.\nArticle 62\nThis Regulation shall nullify the Unified Statute for Graduate Studies\nin Universities issued by the Higher Education Council Resolution\nNo. (3/6/1417) dated 08/26/1417 AH, and all provisions inconsistent\ntherewith.\nArticle 63:\nThe Council of Universities’ Affairs has the right to interpret this\nRegulation.\nArticle 64:\nThis Regulation comes shall enter into force at the beginning of the\nacademic year of 1444H.\nRegulation on Graduate Studies\nIssued by Council of Universities’Affairs\nResolution No. (2/9/1444) dated 3/1/1444 H,\ncorresponding to 1/8/2022 AD","a":["Article 62","Article 63","Article 64"]},{"d":"cua","p":29,"l":"en","t":"2. Without prejudice to what is stated in Clause (1) of this Article, the\nExecutive Management, based on the recommendation of the Department and College Councils, may grant the student evidence of\npassing a number of graduate courses without all of them contributing towards a degree in accordance with regulations approved\nby the University Council based on the proposal of the Standing\nCommittee.\nArticle 58\nIIn the event that the student obtains the same academic degree from\ntwo educational institutions within the framework of a joint program,\na joint graduation certificate may be issued between the two educational institutions or an independent graduation certificate from one\nor both educational institutions. The University Council shall issue\nthe guidelines and procedures regulating this based on a proposal\nfrom the Standing Committee.\nArticle 59\nHealth diplomas and health fellowships are excluded from the provisions of this Statute, and the regulations and rules issued by the\nUniversity Council shall apply to them.\nArticle 60\nThe council of each university shall approve the executive rules for\nthis Regulation.\nArticle 61\nWhenever there is no a special provision in this Regulation, the Law\nof the Council of Higher Education and Universities issued by Royal\nDecree No. (M/8) dated 6/4/1414 H shall be applied to the universities that are subject to this Law, and the Law of Universities issued\nRegulation on Graduate Studies\nIssued by Council of Universities’Affairs\nResolution No. (2/9/1444) dated 3/1/1444 H,\ncorresponding to 1/8/2022 AD","a":["Article, the","Article 58","Article 59","Article 60","Article 61"]},{"d":"cua","p":30,"l":"en","t":"lative GPA is not less than that required by the University Council for\neach program on the condition that it is below a “very good”.\nArticle 55\nIf the student decease before being able to defend the thesis, the degree is awarded in accordance with regulations approved by the University Council based on the proposal of the Standing Committee.\nArticle 56\nThe authorized Vice-President shall submit the recommendation to\naward the academic degree to the University Council to take the decision.\nChapter Twelve: General Provisions\nArticle 57\n1. Without prejudice to what is stated in the Classification and Framework, and in accordance with regulations approved by the University Council based on the proposal of the Standing Committee,\nthe University Council, based on the recommendation of the Department and College Councils and the support of the authorized\nVice-President, may grant the student:\na. A higher diploma when he passes a number of the master’s\nprogram courses, without being qualified to obtain a master’s\ndegree.\nb. A master’s degree when he has passed a number of doctoral\nprogram courses, without being qualified to obtain a doctorate\ndegree.\nRegulation on Graduate Studies\nIssued by Council of Universities’Affairs\nResolution No. (2/9/1444) dated 3/1/1444 H,\ncorresponding to 1/8/2022 AD","a":["Article 55","Article 56","Article 57"]},{"d":"cua","p":31,"l":"en","t":"If the defense committee member is from outside the city in which\nthe thesis is being discussed whether he is from inside or outside the\nKingdom, he shall be issued, in addition to the aforementioned payment, a round-trip ticket from his place of residence and appropriate\naccommodation and subsistence fees, for a maximum of two nights.\nA ticket is issued for the escort if the discussant is blind and for the\nguardian if the defense committee member is a female in addition to\nthe appropriate accommodation fee with a maximum of two nights.\nThe Standing Committee may add one or two nights in certain situations and if the nature of the study so requires based on a recommendation from the competent Department and College Councils, with\nthe justifications for staying for a period of more than two nights.\nThe university may amend the lump sum payment referred to in this\nArticle after the issuance of a decision of approval by the Council of\nUniversities Affairs.\nChapter Eleven: Graduation and Degree Granting\nArticle 53\nThe head of the competent department shall submit the defense committee’s report to the College Dean within a period not exceeding\ntwo weeks from the defense date to submit it to the Executive Management.\nArticle 54\nThe student graduates after successfully completing the graduation\nrequirements according to the program plan, provided that his cumu-\nRegulation on Graduate Studies\nIssued by Council of Universities’Affairs\nResolution No. (2/9/1444) dated 3/1/1444 H,\ncorresponding to 1/8/2022 AD","a":["Article after the issuance of a decis","Article 53","Article 54"]},{"d":"cua","p":32,"l":"en","t":"b. The number of universities to which they are assigned to temporary secondment shall not exceed two universities in each\nacademic year.\nc. The duration of the assignment shall not exceed three days\neach time.\nd. The total number of assignment days shall not exceed ten days\nin the academic year for all universities.\ne. The host university shall bear the expenses of the external\nfaculty member to supervise its students’ thesis in accordance\nwith what is legally prescribed according to his academic rank.\n3. The university may amend the lump sum payment in Clause (1)\nof this Article upon an approval decision by the Council of Universities’ Affairs.\nArticle 52\nA lump sum payment of (1,000) thousand riyals shall be paid to a\ndefense committee member who participates in the discussion of a\nmaster’s thesis or doctoral dissertation if he is a faculty member at\nthe same university to which the thesis is submitted.\nIf the defense committee member is not a faculty member at the university in which the thesis is being discussed whether he is an employee of that university or someone invited from outside it, a lump\nsum payment of (1,500) one thousand five hundred riyals shall be\npaid to him/her for a doctoral dissertation and (1,000) one thousand\nriyals for a master’s thesis. The payment shall be increased to (2,500)\ntwo thousand five hundred riyals if the defense committee member is\nfrom outside the Kingdom.\nRegulation on Graduate Studies\nIssued by Council of Universities’Affairs\nResolution No. (2/9/1444) dated 3/1/1444 H,\ncorresponding to 1/8/2022 AD","a":["Article upon an approval decision by ","Article 52"]},{"d":"cua","p":33,"l":"en","t":"ceeding three months from the defense date. The College Council\nmay make an exception to that provided that the period does not\nexceed six months from the defense date.\n3. Completion of deficiencies in the thesis and re-defend it by the\ncommittee during the period determined by the College Council\nbased on the recommendation of the competent Department Council, provided that it does not exceed one year from the defense date.\n4. Not accepting the thesis.\nEach member of the defense committee has the right to present what\nhe has of different views or reservations in a detailed report to the\nDepartment Head within a period not exceeding one week from the\ndiscussion date, and it is submitted to the College Dean with the report of the defense committee.\nArticle 51\n1. A lump-sum payment of (5000) five thousand riyals will be paid\nto the master’s thesis supervisor from outside the university, and\na lump sum payment of (7000) seven thousand riyals to the doctoral dissertation supervisor from outside the university.\n2. The standing Committee may approve, based on a request from\nthe student’s university, the assignment to temporary secondment\nof the external supervisor to meet the student whom he is supervising, provided the following:\na. The assignment shall not to exceed twice in each academic year\nfor each external university in which students’ thesis are supervised.\nRegulation on Graduate Studies\nIssued by Council of Universities’Affairs\nResolution No. (2/9/1444) dated 3/1/1444 H,\ncorresponding to 1/8/2022 AD","a":["Article 51"]},{"d":"cua","p":34,"l":"en","t":"Article 47\nAfter the completion of the thesis, the supervisor shall submit a report on its completion to the Department Head attaching a copy of\nthe thesis, in preparation for completing the defense procedures determined by the College Council.\nArticle 48\nA committee shall be formed by a decision of the College Council based\non the recommendation of the Department Council.\nArticle 49\nThe University Council shall issue the rules for selecting the members of the master’s thesis and doctoral dissertations defense committees and the mechanism for conducting those discussions based on\nthe proposal of the Standing Committee.\nArticle 50\nThe defense committee shall prepare a report signed by all its members and submitted to the Department Head within a week from the\ndate of the defense, including one of the following recommendations:\n1. Acceptance of the thesis and a recommendation to award the degree.\n2. Acceptance of the thesis with minor amendments without re-defending it again. A member of the defense committee shall be delegated to recommend the awarding of the degree after ensuring\nthe implementation of the amendments within a period not ex-\nRegulation on Graduate Studies\nIssued by Council of Universities’Affairs\nResolution No. (2/9/1444) dated 3/1/1444 H,\ncorresponding to 1/8/2022 AD","a":["Article 47","Article 48","Article 49","Article 50"]},{"d":"cua","p":35,"l":"en","t":"Article 43\nThe number of students enrolled in the class for the graduation research course shall not be less than five, and the College Council\nmay make an exception from the minimum in accordance with regulations approved by the University Council based on the proposal of\nthe Standing Committee.\nArticle 44\nIf it is proven that the student is not in academic good standing at the\nthesis stage, based on the report of the thesis supervisor, the student\nis warned by a letter from the competent department. If the student\nis warned twice and does not resolve the reasons for the warning, his\nenrollment will be terminated based on the recommendation of the\nDepartment and College Councils.\nArticle 45\nWhether individually or jointly with others, the supervisor can supervise a maximum of seven thesis at one time. The Standing Committee may except from this based on the recommendation of the\nDepartment and College Councils in accordance with regulations approved by the University Council based on the proposal of the Standing Committee.\nArticle 46\nThe supervision load for a faculty member, whether he is a main supervisor or an assistant supervisor for each thesis is included in his\nteaching load in accordance with regulations approved by the University Council based on the proposal of the Standing Committee.\nRegulation on Graduate Studies\nIssued by Council of Universities’Affairs\nResolution No. (2/9/1444) dated 3/1/1444 H,\ncorresponding to 1/8/2022 AD","a":["Article 43","Article 44","Article 45","Article 46"]},{"d":"cua","p":36,"l":"en","t":"Article 38\nThesis are supervised by professors and associate professors from the\nuniversity faculty. An assistant professor may supervise graduation\nresearch and master’s thesis and assist in supervising doctoral dissertations if he has two published research papers or accepted for publication in a refereed academic journal in his field of specialization.\nArticle 39\nExperienced and specialized individuals in the field of the thesis research who are not faculty member whether from inside or outside\nthe university may supervise or assist in the supervision of thesis\nbased on a recommendation of the Department Council and an approval of the College Council.\nArticle 40\nThe University Council shall issue the guidelines for the thesis assistant supervisors based on the proposal of the Standing Committee.\nArticle 41\nA faculty member may supervise thesis outside his university, whether inside or outside the Kingdom, without prejudice to his job duties\nin accordance with regulations approved by the University Council\nbased on the proposal of the Standing Committee.\nArticle 42\nThe supervisor shall evaluate the student’s performance at the end of\neach semester and determines his progress in the thesis in accordance\nwith the mechanisms approved by the Standing Committee.\nRegulation on Graduate Studies\nIssued by Council of Universities’Affairs\nResolution No. (2/9/1444) dated 3/1/1444 H,\ncorresponding to 1/8/2022 AD","a":["Article 38","Article 39","Article 40","Article 41","Article 42"]},{"d":"cua","p":37,"l":"en","t":"2. The student must pass the supplementary course on the first attempt with a grade of no less than (above average), and his cumulative GPA in all supplementary courses must not be less than\n(very good).\n3. Regarding alternative exams and courses that require more than\none semester to be studied, the College Council decides what is\nconsidered appropriate based on the Department Council’s recommendation.\nArticle 35\nThe University Council shall issue the rules regulating the oral and\nwritten comprehensive exam for the master’s and doctoral stages,\nbased on the proposal of the Standing Committee.\nChapter Ten: Thesis, Supervision, and Defense\nArticle 36\nThe University Council shall issue the rules regulating the registration of the graduation research project, the thesis of the graduate student if any, and the mechanism for determining the thesis supervisor\nand the assistant supervisor if any, based on the recommendation of\nthe Standing Committee.\nArticle 37\nThesis are written in the language approved for the program by the\nUniversity Council, provided that the thesis contains an adequate\nsummary in Arabic if it is in a language other than Arabic.\nRegulation on Graduate Studies\nIssued by Council of Universities’Affairs\nResolution No. (2/9/1444) dated 3/1/1444 H,\ncorresponding to 1/8/2022 AD","a":["Article 35","Article 36","Article 37"]},{"d":"cua","p":38,"l":"en","t":"Article 32\nA graduate student may, based on the recommendation of the Department Council and the approval of the College Council, study some\ncourses at a university or educational institution inside or outside the\nKingdom, provided that it is licensed by the competent authority in\nthe country of study. The academic units he studied shall be transferred and recorded in the student’s academic record. The University\nCouncil shall issue the regulations governing this and the possibility\nof including their grades in the student’s cumulative GPA in his academic record.\nArticle 33\nA graduate student from a non-Saudi university may study some\ncourses at a Saudi university in accordance with regulations approved by the University Council based on the proposal of the Standing Committee.\nChapter Nine: Assessment Mechanism\nArticle 34:\nExam in graduate courses shall be conducted and grades shall be recorded in accordance with the Regulations on Studying and Examinations at the University Undergraduate Level, except for the following:\n1. The student shall not be considered to have passed the course\nunless he obtains at least an (above average) grade.\nRegulation on Graduate Studies\nIssued by Council of Universities’Affairs\nResolution No. (2/9/1444) dated 3/1/1444 H,\ncorresponding to 1/8/2022 AD","a":["Article 32","Article 33","Article 34"]},{"d":"cua","p":39,"l":"en","t":"Article 29\nAs an exception to Clause (e) of Item (1) of Article (26) of this Regulation, the Standing Committee may grant the student an exceptional\nopportunity not to exceed one academic year, based on a report from\nthe supervisor and the recommendation of the Department and College Councils.\nArticle 30\nWithout prejudice to Article (15) of this Regulation, based on the\nrecommendation of the Department and College Councils, the Executive Management may accept the transfer of a student to the university from a university or educational institution inside or outside\nthe Kingdom, provided that it is licensed by the competent authority in the country of study, on the condition that he is not dismissed\nfrom it for any reason. The transferred courses shall be recorded in\nthe student’s academic record, and the University Council shall issue\nthe regulations governing this and the possibility of including their\ngrades in the student’s cumulative GPA in his academic record.\nArticle 31\nA student may be transferred from one program to another within the\nuniversity based on the recommendation of the Department Council\nto which he is transferred and the approval of the College Council in\naccordance with the guidelines and conditions approved by the University Council based on the proposal of the Standing Committee.\nRegulation on Graduate Studies\nIssued by Council of Universities’Affairs\nResolution No. (2/9/1444) dated 3/1/1444 H,\ncorresponding to 1/8/2022 AD","a":["Article 29","Article (26) of this Regulation, the ","Article 30","Article (15) of this Regulation, base","Article 31"]},{"d":"cua","p":40,"l":"en","t":"Article 27\nA student whose enrollment has been terminated may be re-enrolled\nif the conditions preventing him/her from continuing his studies are\nacceptable to the Department and College Councils. Re-enrollment\ndecision shall be made by the Standing Committee in consideration\nof the following:\n1. A student whose enrollment has been terminated for more than\nthree academic years is deemed as a new student in terms of\nre-studying courses, regardless of what he has previously accomplished from the study stage, and the University Council may\nexcept from that in accordance with regulations issued by the\nUniversity Council based on a proposal from the Standing Committee.\n2. A student whose enrollment has been terminated for three academic years or less re-studies some of the courses specified by the\nDepartment Council and approved by the College Council. The\nunits he studies after re-enrolling are included in his cumulative\nGPA, and the period the student spent in the study before terminating his enrollment Shall be calculated within the maximum\nperiod for obtaining the degree.\nArticle 28\nAs an exception to Clause (c) of Item (1) of Article (26) of this Regulation, the College Council may grant the student one exceptional\nopportunity, not to exceed one academic year, based on the Department Council’s recommendation.\nRegulation on Graduate Studies\nIssued by Council of Universities’Affairs\nResolution No. (2/9/1444) dated 3/1/1444 H,\ncorresponding to 1/8/2022 AD","a":["Article 27","Article 28","Article (26) of this Regulation, the "]},{"d":"cua","p":41,"l":"en","t":"Article 26\n1. The student’s enrollment shall be terminated in the following situations:\na. If he stops studying, in accordance with the provisions of Article (25) of this Regulation.\nb. If he does not pass the supplementary courses, in accordance\nwith the regulations approved by the Standing Committee.\nc. If his cumulative GPA falls below (Very Good) in two consecutive semesters.\nd. If his acceptance is found to be based on his submission of\ncompletely or partially incorrect information or documents.\ne. If he does not obtain the degree within the specified period of\nthe program.\n2. The student’s enrollment shall be terminated by a decision of the\nStanding Committee based on the recommendation of the Department Council and the endorsement of the College Council in the\nfollowing situations:\na. If it is proven that he is not in academic good standing at the\nthesis stage in accordance with the provisions of Article (44)\nof this Regulation.\nb. If he does not pass the comprehensive exam after being allowed to repeat it once.\nc. If the thesis is not accepted by the defense committee as being\nunsuitable for defense.\nd. If he violates academic integrity, during the coursework or thesis-writing phases, or if he violates the laws, regulations, or\nrelated decisions.\nRegulation on Graduate Studies\nIssued by Council of Universities’Affairs\nResolution No. (2/9/1444) dated 3/1/1444 H,\ncorresponding to 1/8/2022 AD","a":["Article 26","Article (25) of this Regulation.","Article (44)"]},{"d":"cua","p":42,"l":"en","t":"2. A service fee for graduate studies and their support in accordance\nwith regulations approved by the University Council based on the\nrecommendation of the Standing Committee.\nChapter Eight: Academic Procedures\nArticle 22\nThe student may postpone the study at the recommendation of the\ncompetent Department Council and the approval of the College\nCouncil in accordance with regulations approved by the University\nCouncil based on the proposal of the Standing Committee.\nArticle 23\nThe student may withdraw from one or more courses or all courses of\nthe semester after the end of the registration period upon the recommendation of the competent Department Council and the approval of\nthe College Dean according to regulations approved by the University Council based on the proposal of the Standing Committee.\nArticle 24\nIf a graduate student withdraws from the university and then decides\nto re-join, the university may apply the admission requirements at the\ntime of the new application.\nArticle 25\nA student shall be deemed to have dropped out if he does not register\nwithin the specified period for registration in each semester in which\nhe is allowed to register.\nRegulation on Graduate Studies\nIssued by Council of Universities’Affairs\nResolution No. (2/9/1444) dated 3/1/1444 H,\ncorresponding to 1/8/2022 AD","a":["Article 22","Article 23","Article 24","Article 25"]},{"d":"cua","p":43,"l":"en","t":"Article 19\nIt is permissible to transfer courses previously passed by a student\nat a university or educational institution inside the Kingdom or from\noutside the Kingdom provided that these institutions are licensed by\nthe competent authority in the country of study. This should be based\non the recommendation of the Department Council and the approval\nof the College Council. The courses that have been transferred are\nrecorded in the student’s academic record. The University Council\nshall issue the regulations governing this and the possibility of including their grades in the student’s cumulative GPA in his academic\nrecord.\nArticle 20:\nWith the approval of the competent Department Council and the College Dean, the student may postpone his admission one time. The\npostponement cannot be accepted after the student starts his studies.\nThis shall be in accordance with the regulations approved by the University Council based on the proposal of the Standing Committee.\nArticle 21:\nWithout prejudice to the decisions issued by the Council of Universities’ Affairs, the university may charge:\n1. Tuition fees or a charge to offer graduate studies programs or\ncourses provided that these programs have program accreditation,\nand the number of students does not exceed the number of accepted students - for the same programs or courses - without fees or\ncharge. The University Council shall set the regulations governing\nthis based on a recommendation from the Standing Committee.\nRegulation on Graduate Studies\nIssued by Council of Universities’Affairs\nResolution No. (2/9/1444) dated 3/1/1444 H,\ncorresponding to 1/8/2022 AD","a":["Article 19","Article 20","Article 21"]},{"d":"cua","p":44,"l":"en","t":"Chapter Seven: Admission\nArticle 15\nThe Executive Management shall undertake the implementation of\nacademic procedures, including student admission and registration,\nin accordance with the provisions of this Regulation and the regulations approved by the University Council.\nArticle 16\nWithout prejudice to Article (15) of this Regulation, a student may\nbe accepted in a field other than his specialization, based on a recommendation from the competent Department Council and approval\nfrom the College Council.\nArticle 17\nThe competent department may require for admission of the student\nto the master’s and doctoral level that he pass a number of supplementary courses from a previous stage or pass a related learning outcome assessment in order for the student to become eligible to join\nthe program in accordance with regulations approved by the Standing Committee based on a proposal from the Department Council and\nendorsement from the College Council.\nArticle 18\nA student may be accepted into two graduate studies programs at the\nsame time provided that the two programs are from the same stage or\nfrom a previous stage, in accordance with regulations approved by the\nUniversity Council based on the recommendation of the Standing Committee.\nRegulation on Graduate Studies\nIssued by Council of Universities’Affairs\nResolution No. (2/9/1444) dated 3/1/1444 H,\ncorresponding to 1/8/2022 AD","a":["Article 15","Article 16","Article (15) of this Regulation, a st","Article 17","Article 18"]},{"d":"cua","p":45,"l":"en","t":"Article 12\nStudy options of a master’s degree shall be either coursework only,\ncoursework and thesis, coursework and comprehensive exam, or\ncoursework and graduation research, provided that the study period\nof the program and the number of study units are in accordance with\nwhat is specified in the Classification and Framework. The University Council, based on a proposal of the Standing Committee, may\nincrease the study period for any program, not exceeding half the\nspecified period.\nArticle 13\nThe University Council, based on the recommendation of the Standing Committee, shall approve the method of doctoral study, provided\nthat the study period of the program and the number of study units are\nin accordance with what is specified in the Classification and Framework. The University Council, based on the proposal of the Standing\nCommittee, may increase the study period for any program, not exceeding half the specified period.\nArticle 14\nThe period for obtaining the academic degree starts from the beginning of registration for the graduate courses of the program in which\nthe student is enrolled until the date of completing the requirements\nof the program or the student’s supervisor submitting a report to the\nHead of Department with a copy of the thesis if any.\nRegulation on Graduate Studies\nIssued by Council of Universities’Affairs\nResolution No. (2/9/1444) dated 3/1/1444 H,\ncorresponding to 1/8/2022 AD","a":["Article 12","Article 13","Article 14"]},{"d":"cua","p":46,"l":"en","t":"Chapter Six: Study Programs and Study System\nArticle 9\nJoint graduate studies programs may be established between departments, colleges, or institutes within the university; or between\nthe university and educational or research institutions from inside\nor outside the Kingdom, in accordance with rules approved by the\nUniversity Council based on the recommendation of the Standing\nCommittee and after coordination with the colleges and departments\nor competent entities.\nArticle 10\nThe number of study units a graduate student must study at the university that will grant him/her the academic degree shall not be less\nthan fifty percent of the total number of credits required to grant the\ndegree; and the student must complete his graduation research or his\nthesis, if any, entirely under its supervision. Students of joint programs are excluded from this Article.\nArticle 11\nThe study for the higher diploma shall consist of academic courses\nand field study, applied, and laboratory work, provided that the study\nperiod of the program and the number of study units are in accordance with specifications in the Classification and Framework. The\nUniversity Council, based on a proposal of the Standing Committee,\nmay increase the study period for any program, not exceeding half\nthe specified period.\nRegulation on Graduate Studies\nIssued by Council of Universities’Affairs\nResolution No. (2/9/1444) dated 3/1/1444 H,\ncorresponding to 1/8/2022 AD","a":["Article 9","Article 10","Article.","Article 11"]},{"d":"cua","p":47,"l":"en","t":"21. Recommending the termination or suspension of graduate studies programs that do not comply with quality standards or with\nthe university’s strategy.\n22. Reviewing the referrals made by the Chair of the Standing Committee, the University President, or the University Council in order to provide its opinion. The Committee may delegate some of\nits authorities to its Chair, and it may also form standing or temporary committees from among its members or others to study\nwhat they are asked to do.\nArticle 8\nThe Standing Committee shall meet upon a call by its Chair at least\nonce a month, and the meeting shall only be valid if attended by at\nleast two-thirds of its members, including the Chair or whomever he\ndeputizes from among the members of the Committee. The Committee’s decisions are issued by a majority vote of the members present.\nIn case of a tie, the Chair of the meeting shall have the casting vote.\nThe decisions of the Standing Committee shall be effective unless\ncontested by the University President within fifteen days from the\ndate of receipt. If contested, they shall be returned with the University President’s comments to the Standing Committee. If the Standing\nCommittee maintains its position, the disputed decisions shall be referred to the University Council to be decided in its first ordinary or\nextraordinary meeting. The University Council may ratify, amend, or\ncancel the decisions. The decision of the University Council on this is\nfinal. The Chair of the Standing Committee may invite whomever he\ndeems necessary to attend some of the Standing Committee meetings\nin a non-voting capacity.\nRegulation on Graduate Studies\nIssued by Council of Universities’Affairs\nResolution No. (2/9/1444) dated 3/1/1444 H,\ncorresponding to 1/8/2022 AD","a":["Article 8"]},{"d":"cua","p":48,"l":"en","t":"competent departments and the approval of the College Councils.\n13. Suggesting the guidelines for forming supervisory committees\nand thesis defense committees.\n14. Setting general frameworks and standards for comprehensive\nexam and graduation research.\n15. Setting the overall framework for research plans and the rules\ngoverning writing, printing, producing, and submitting thesis;\npreparing forms for the thesis defense committee reports; and\nevaluating thesis.\n16. Studying periodic reports related to graduate studies that are submitted by the academic departments at the university.\n17. Proposing the offering of graduate studies programs outside the\nuniversity premises and submitting this to the University Council\nto take what it deems appropriate.\n18. Recommending the approval of the colleges’ proposals regarding\ndevelopment initiatives related to graduate studies in order to develop the university’s financial resources.\n19. Recommending the determination of the fees for applying to\ngraduate programs, the tuition fees for the programs, and the fees\nfor support services related to graduate studies, based on the proposals of the Department and College Councils.\n20. Recommending the allocation of scholarships for students, in\nfull or in part, in accordance with the regulations approved by the\nUniversity Council.\nRegulation on Graduate Studies\nIssued by Council of Universities’Affairs\nResolution No. (2/9/1444) dated 3/1/1444 H,\ncorresponding to 1/8/2022 AD","a":[]},{"d":"cua","p":49,"l":"en","t":"5. Recommending the approval of study plans and detailed standards to the University Council, based on a proposal from the\nDepartment Council and endorsement by the College Council in\naccordance with international benchmarks and comparisons.\n6. Proposing standards for graduate studies programs for approval\nby the University Council.\n7. Proposing the rules regulating the evaluation of graduate studies\nprograms for approval by the University Council.\n8. Supervising the evaluation of graduate studies programs at the\nuniversity on a regular basis, through specialized committees or\nbodies inside or outside the university.\n9. Reviewing the comprehensive report prepared by the Executive\nManagement on the graduate studies programs at the university\nand the results of evaluating those programs and submitting them\nto the University Council.\n10. Recommending the approval of the college councils’ proposals\nregarding graduate studies programs that are compatible with the\ncommunity’s needs, the Kingdom’s plans and visions, and global\ntrends, for approval by the University Council.\n11. Supporting proposals for determining academic degrees and certificates and their names in both Arabic and English, based on the\nproposals of Department and College Councils.\n12. Recommending the numbers of students who can be accepted each academic year in the graduate studies programs to the\nUniversity Council, based on a proposal from the councils of the\nRegulation on Graduate Studies\nIssued by Council of Universities’Affairs\nResolution No. (2/9/1444) dated 3/1/1444 H,\ncorresponding to 1/8/2022 AD","a":[]},{"d":"cua","p":50,"l":"en","t":"1. Five deans of university colleges and institutes that offer graduate programs, considering the diversity of colleges and institutes’\nspecializations.\n2. Dean of Development and Quality at the university.\n3. Dean, director, or head of the Executive Management unit, who\nshall be the secretary of the committee.\n4. Three members who are experienced and specialized in graduate\nstudies from inside or outside the university.\nThe members specified in Clauses (1) and (4) of this Article are appointed by a decision of the University Council upon the University\nPresident’s nomination for a two-year term that is renewable.\nArticle 7\nWithout prejudice to the provisions of this Regulation, the Standing\nCommittee shall undertake the following tasks:\n1. Proposing the general policy for graduate studies at the university\nand supervising its implementation after approval by the University Council.\n2. Recommending the approval of the admission requirements for\ngraduate studies programs and updating them upon the request of\nthe councils of competent departments, colleges, and institutes.\n3. Supervising joint graduate programs.\n4. Recommending the approval and amendment of graduate studies\nprograms, after studying and refereeing, to the University Council based on a proposal from the Department Council, and endorsement of the proposal by the College Council.\nRegulation on Graduate Studies\nIssued by Council of Universities’Affairs\nResolution No. (2/9/1444) dated 3/1/1444 H,\ncorresponding to 1/8/2022 AD","a":["Article are appointed by a decision o","Article 7"]},{"d":"cua","p":51,"l":"en","t":"ter’s or doctoral program in addition to the availability of research\ncapabilities such as laboratories, computer facilities, and others in\norder to ensure the success of the program in terms of teaching,\nsupervision, and research.\n4. The number of students expected to be accepted into the program\nshould be appropriate to ensure its continuance, and the maximum number of students in each class should not exceed twenty-five students.\n5. When approving its programs, the university shall adhere to the\nfollowing criteria in the following order:\na. The unified Saudi Standard Classification of Educational Levels\nand Specializations.\nb. The National Qualifications Framework in the Kingdom of Saudi\nArabia.\n6. Suspension of admission to master’s and doctoral programs that\ndo not obtain program accreditation from the Education and Training Evaluation Commission or one of the international agencies\napproved by the Commission within two years of graduating the\nfirst cohort from the programs.\nChapter Five: Organization of the Standing\nCommittee for Graduate Studies\nArticle 6\nA Standing Committee for graduate studies (the Standing Committee) shall be formed at the university, and it is to be organizationally\nlinked to the authorized Vice-President and chaired by him/her and\nthe membership of the following:\nRegulation on Graduate Studies\nIssued by Council of Universities’Affairs\nResolution No. (2/9/1444) dated 3/1/1444 H,\ncorresponding to 1/8/2022 AD","a":["Article 6"]},{"d":"cua","p":52,"l":"en","t":"challenges of sustainable development locally in Saudi society,\nregionally, and globally.\n8. Enhancing local, regional, and international cooperation and partnership opportunities.\n9. Developing the knowledge economy outputs to contribute to\nachieving the sustainable development goals of Saudi society.\nChapter Four: Criteria for Graduate\nProgram Approval\nArticle 5\nThe University Council shall set the detailed criteria for approving\ngraduate programs in accordance with the following:\n1. The university must have obtained institutional accreditation\nfrom the Education and Training Evaluation Commission.\n2. The bachelor’s program - in the same specialization - must have\nobtained program accreditation from the Education and Training\nEvaluation Commission or from one of the international accrediting agencies approved by the Commission in order to approve the\nhigher diploma or master’s program. For the approval of the doctoral program, the master’s program - in the same specialization\n- must have obtained program accreditation from the Education\nand Training Evaluation Commission or from one of the international agencies approved by the Commission.\n3. The department must have a sufficient number of professors and\nassociate professors who are specialized in the field of the mas-\nRegulation on Graduate Studies\nIssued by Council of Universities’Affairs\nResolution No. (2/9/1444) dated 3/1/1444 H,\ncorresponding to 1/8/2022 AD","a":["Article 5"]},{"d":"cua","p":53,"l":"en","t":"Chapter Three: Objectives of\nGraduate Studies\nArticle 4\nGraduate studies aim to achieve the following:\n1. Maintain advanced studies and research that serve the national\ngoals, expanding them, and endeavoring to publish them.\n2. Contributing to the enrichment of all areas of knowledge by\nmeans of specialised studies and academic research to gain access to innovative scientific and applied research additions and to\nreveal new facts.\n3. Providing students with the educational opportunities to pursue\ngraduate courses locally.\n4. Offering qualifying courses and programs to students to increase\ntheir level of qualification and competence in conducting studies\nand research that benefit the country and contribute to the enrichment of their respective specialisations.\n5. Recruiting a group of exceptional students from across the world\nin the most essential research subjects in order to enhance the\noutputs of academic research and increase the required cultural\ndiversity in graduate programs.\n6. Preparing and developing the academic and professional specialists that society needs.\n7. Encouraging creativity and innovation to keep pace with the demands of knowledge and technical development, elevating the\nlevel of academic research, and directing it to address issues and\nRegulation on Graduate Studies\nIssued by Council of Universities’Affairs\nResolution No. (2/9/1444) dated 3/1/1444 H,\ncorresponding to 1/8/2022 AD","a":["Article 4"]},{"d":"cua","p":54,"l":"en","t":"Graduation Research\nA research requirement that may be completed over the course of\none or two semesters. It qualifies for the academic degree and is a\nsubject-specific course within the program’s courses.\nThesis\nThe thesis or dissertation that represents the research and its results,\nwhich the student prepares and submits for the purpose of obtaining\nthe degree.\nChapter Two: Objectives and Enforcement\nof the Regulation\nArticle 2\nWithout prejudice to the provisions of Regulations on Studying and\nExaminations at the University Undergraduate Level, this Regulation\naims to organize graduate studies in universities in order to increase\nthe efficacy and quality of the educational process and academic procedures for the graduate studies stages at the university.\nArticle 3\nThe provisions of this Regulation shall apply to universities that are\nsubject to the Law of the Higher Education Council and Universities\nissued by Royal Decree No. M/8 dated 4/6/1414 H and universities\nthat are subject to the Law of Universities issued by Royal Decree\nRegulation on Graduate Studies\nIssued by Council of Universities’Affairs\nResolution No. (2/9/1444) dated 3/1/1444 H,\ncorresponding to 1/8/2022 AD","a":["Article 2","Article 3"]},{"d":"cua","p":55,"l":"en","t":"Postponement of Admission\nPostponing the commencement date of the student’s studies following the issuing of his university identification number and prior to\ncourse registration. This can only be done once, and it cannot be done\nafter the study has begun.\nPostponement of Study\nThe student suspends the continuance of the period specified - pursuant to this Regulation - for obtaining the academic degree after the\ncommencement of his studies.\nWithdrawal\nThe student permanently terminates his relationship with the university in which he is enrolled before completing his academic program.\nTermination of Enrollment\nThe university terminates its relationship with the student before he\ncompletes his academic program for specific reasons stipulated in\nthis Regulation.\nRe-enrollment\nThe university restores its relationship with the student whose enrollment has been terminated.\nComprehensive Exam\nA test of the knowledge and skills required for obtaining a graduate\nprogram degree (higher diploma/master’s/doctorate). The comprehensive exam may be the final qualifier for some of these degrees\nexcept for the Ph.D.\nRegulation on Graduate Studies\nIssued by Council of Universities’Affairs\nResolution No. (2/9/1444) dated 3/1/1444 H,\ncorresponding to 1/8/2022 AD","a":[]},{"d":"cua","p":56,"l":"en","t":"Program\nThe set of courses, the thesis, the graduation research, the comprehensive exam, or those that the student studies during a specified\nperiod of time in order to obtain an academic degree or a higher certificate in the field of specialization.\nJoint Program\nAn academic program in which more than one department or college\nfrom within the university, or from the educational institutions or research institutions inside or outside the Kingdom participate; and it\nhas specific learning outcomes.\nStudy Unit\nThe weekly theoretical lecture, the weekly academic symposium, the\nclinical lesson, or the exercise lesson of no less than 50-minute duration, the practical lesson of no less than 100-minute duration, or the\nfield lesson specified in the study plan.\nCourse\nThe study material in the plan of each program, which includes a\nnumber, code and description of the content, is subject to follow-up,\nevaluation and development in each section. It may be taught independently or have a prerequisite or concurrent requisite. The prerequisite or the concurrent requisite may be waived based on an examination of specific learning outcomes.\nRegulation on Graduate Studies\nIssued by Council of Universities’Affairs\nResolution No. (2/9/1444) dated 3/1/1444 H,\ncorresponding to 1/8/2022 AD","a":[]},{"d":"cua","p":57,"l":"en","t":"Chapter One: Definitions\nArticle 1\nThe following terms and phrases whenever they appear in this Regulation\nshall have the meanings herein specified unless the context indicates otherwise:\nGraduate Studies\nA stage of education above the bachelor’s, such as a graduate certificate, master’s degree, or doctorate.\nClassification\nThe unified Saudi Classification of Educational Levels and Specializations issued by Council of Ministers’ Resolution No. (75) dated\n27/1/1442 H, and any amendments or updates thereto.\nFramework\nThe National Qualifications Framework in the Kingdom of Saudi Arabia issued by the decision of the Board of Directors of the Education\nand Training Evaluation Commission at its 1st meeting for the 2nd\nsession held on 6/6/1441 H, and any amendments or updates thereto.\nAuthorized Vice-President\nThe university competent vice-president concerned with the affairs\nof graduate studies at the university according to the organizational\nstructure of the university.\nExecutive Management\nThe deanship, department, or unit in the university in charge of carrying out graduate studies-related academic procedures in accordance\nwith the university’s approved organizational structure.\nRegulation on Graduate Studies\nIssued by Council of Universities’Affairs\nResolution No. (2/9/1444) dated 3/1/1444 H,\ncorresponding to 1/8/2022 AD","a":["Article 1"]},{"d":"cua","p":58,"l":"ar","t":"7 ...21018 1تاوعك] عطلا 01 ااعصعء ص مخصظ 0صنه دع كتاءء زا 0 :190 تعام هط\n0 ........ وع1م5 عأ سلمتع)205 10 عع ااتسحممن) عمتلسهاذ عط 1ه صم امعتصمع02 :علاط معام هط\n3 ااام ام ٠.000.660. 818131تاعع11 لاع طرووعوع4 تعستاط معأامقطت","a":[]},{"d":"cua","p":60,"l":"en","t":"Kingdom of Saudi Arabia\nCouncil of Universities, Affairs\nGeneral Secretary\nCouncil of Universities’ Affairs\nRegulation on Graduate Studies\nIssued by Council of Universities’Affairs\nResolution No. (2/9/1444) dated 3/1/1444 H,\ncorresponding to 1/8/2022 AD\nFirst Edition","a":[]},{"d":"cua","p":61,"l":"ar","t":"5 ناكد :وعتاأود حتطنا 1ه لأعسسامن0 ٍ شؤون الج ات 5\n15> 212011266 ذه اماق لسعء ]1 اللائحة المنظمة للدراسات العليا ةك الجامعات الصادرة\n15 'دغ1)أواء كلدنا 01 لأعسراهن) 9ط لعنو15 بقرار مجلس شؤون الجامعات رقم (؟4145/9/1١)\n,!! 3/1/1444 0ع026 (2/9/1444) .لظا مسمتاأساموع ]1 المتخن لك الاجتماع التاسع المعقود بتاريخ ١444/1/* هم\n| تطابعالجامفة |","a":[]}];

const STOPW=new Set(['في','من','على','الى','إلى','عن','او','أو','ما','هل','لا','مع','ان','أن','التي','الذي','هذه','هذا','كل','بعد','قبل','the','of','and','to','in','for','a','is']);
function regSearch(q,n=4,doc=''){const terms=normAr(q).split(/[^؀-ۿa-z0-9]+/).filter(w=>w.length>2&&!STOPW.has(w));if(!terms.length)return[];
  return REGLIB.filter(x=>!doc||x.d===doc).map(x=>{const t=x._n||(x._n=normAr(x.t));let sc=0;terms.forEach(w=>{const stem=w.replace(/^ال/,'');const m=t.split(stem).length-1;if(m)sc+=1+Math.min(3,m)*.3});return{x,sc}}).filter(o=>o.sc>0).sort((a,b)=>b.sc-a.sc).slice(0,n).map(o=>o.x)}
function hlText(t,q){let h=esc(t);const terms=normAr(q).split(/[^؀-ۿa-z0-9]+/).filter(w=>w.length>2&&!STOPW.has(w)).map(w=>w.replace(/^ال/,''));
  if(!terms.length)return h;return h.split('\n').map(line=>{const n=normAr(line);return terms.some(w=>n.includes(w))?`<mark>${line}</mark>`:line}).join('\n')}

  ${res.map(x=>{const key=x.d+x.p,open=RL.open===key;return`<div class="card mt rlp ${open?'open':''}"><div class="row between" data-act="rlOpen" data-k="${key}" style="cursor:pointer"><div><span class="chip">${esc(tx(DOCN[x.d]).split(' — ')[0])}</span> <b>${T('صفحة','Page')} ${x.p}</b>${x.l==='en'?' <span class="chip en">EN</span>':''}</div><span class="small muted">${(x.a||[]).slice(0,3).map(esc).join(' · ')}</span></div><div class="rlt" dir="${x.l==='en'?'ltr':'rtl'}">${open?hlText(x.t,q):hlText(x.t.slice(0,420),q)+'…'}</div></div>`}).join('')}`}

function countUp(root){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;root.querySelectorAll('.tile .num, .cu').forEach(el=>{const txt=el.textContent.trim();const m=txt.match(/^(\d+(?:\.\d+)?)(.*)$/);if(!m)return;const end=parseFloat(m[1]),suf=m[2],dec=(m[1].split('.')[1]||'').length;if(end===0)return;const t0=performance.now(),dur=900;const step=t=>{const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);el.textContent=(end*e).toFixed(dec)+suf;if(p<1)requestAnimationFrame(step)};requestAnimationFrame(step)})}
function revealObs(){const els=document.querySelectorAll('.reveal:not(.shown)');if(!('IntersectionObserver' in window)){els.forEach(e=>e.classList.add('shown'));return}const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('shown');io.unobserve(e.target)}}),{threshold:.12});els.forEach((e,i)=>{e.style.transitionDelay=(i%8)*60+'ms';io.observe(e)})}

(function bgfx(){const cv=document.createElement('canvas');cv.id='bgfx';document.body.prepend(cv);if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const x=cv.getContext('2d');let W,H,P=[],dpr=Math.min(2,devicePixelRatio||1);
 const cols=['#1A97D4','#94C83D','#5B6FD8'];
 function size(){W=cv.width=innerWidth*dpr;H=cv.height=innerHeight*dpr;cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';const n=Math.round(Math.min(70,innerWidth*innerHeight/22000));P=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.25*dpr,vy:(Math.random()-.5)*.25*dpr,r:(Math.random()*1.6+0.8)*dpr,c:cols[Math.floor(Math.random()*3)]}))}
 size();addEventListener('resize',size);let mx=-1e4,my=-1e4;addEventListener('pointermove',e=>{mx=e.clientX*dpr;my=e.clientY*dpr},{passive:true});
 function f(){if(document.hidden){requestAnimationFrame(f);return}x.clearRect(0,0,W,H);const D=140*dpr;
  for(const p of P){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;const dx=p.x-mx,dy=p.y-my,dd=Math.hypot(dx,dy);if(dd<120*dpr){p.x+=dx/dd*.6;p.y+=dy/dd*.6}}
  for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const a=P[i],b=P[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<D){x.strokeStyle=a.c;x.globalAlpha=(1-d/D)*.35;x.lineWidth=dpr*.8;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}

   return{id:f.thread,ms,first:f,last,subject:f.subject||T('(بدون عنوان)','(no subject)'),from:f.from,to:f.to,triage:f.triage,priority:f.prio||f.triage?.priority||'normal',status:f.status||'open',unread:ms.some(m=>m.from!==ME&&!m.readBy?.[ME]&&(m.to===ME||m.to==='head'&&isHead()||m.to===('c:'+myC()))),mine:f.from===ME};

let ASSETS=null;const FILECACHE={};
const readDataURL=f=>new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(f)});
const extType=n=>({pdf:'application/pdf',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',webp:'image/webp',txt:'text/plain',csv:'text/csv'})[(n.split('.').pop()||'').toLowerCase()];
async function storeFile(file){
  const meta={name:file.name,type:file.type||extType(file.name)||'application/octet-stream',size:file.size,at:new Date().toISOString(),by:ME};
  if(ASSETS){try{const r=await ASSETS.upload(file,{type:meta.type});return{...meta,asset:r.id}}catch(e){if(e&&e.code==='too_large'){toast(T('الملف أكبر من ٢٠ م.ب','File exceeds 20 MB'));return null}if(e&&e.code==='unsupported_type'){toast(T('نوع الملف غير مدعوم (PDF أو صورة)','Unsupported type (PDF or image)'));return null}}}
  let data;
  if(/^image\//.test(meta.type)){data=await compressImg(file,1200,.72);meta.type='image/jpeg'}
  else{if(file.size>200000){toast(T('في النسخة المحلية الحد ٢٠٠ ك.ب — من الرابط المنشور حتى ٢٠ م.ب','Local copy limit 200 KB — published link allows 20 MB'));return null}data=await readDataURL(file)}
  const fid='f'+uid();FILECACHE[fid]=data;
  if(MODE==='live'&&!readOnly){try{await db.collection('files').doc(fid).set({id:fid,data,name:meta.name,type:meta.type})}catch(e){toast(T('تعذر حفظ الملف','File save failed'));return null}}
  return{...meta,fid};
}
async function fileURL(a){if(a.asset)return'/_blob/'+a.asset;if(FILECACHE[a.fid])return FILECACHE[a.fid];if(db){try{const s=await db.doc('files/'+a.fid).get();if(s.exists){FILECACHE[a.fid]=s.data().data;return FILECACHE[a.fid]}}catch(e){}}return null}

function svgDonut(items,o={}){const s=o.size||190,r=s/2-8,ir=r*.62,cx=s/2,cy=s/2,tot=items.reduce((a,b)=>a+b.value,0)||1;let a0=-Math.PI/2;

async function drDownload(html,fname,fmt,css){css=css||DCSS;
  const doc=`<!DOCTYPE html><html lang="${LANG}" dir="${LANG==='ar'?'rtl':'ltr'}"><head><meta charset="utf-8"><title>${fname}</title><style>body{margin:32px}${css}</style></head><body>${html}</body></html>`;
  const blob=new Blob(['﻿'+doc],{type:fmt==='doc'?'application/msword':'text/html'});
  const dl=window.claude?.use?await claude.use('downloads'):null;
  if(dl){try{await dl.save({filename:fname+(fmt==='doc'?'.doc':'.html'),data:blob});return}catch(e){if(e&&/declin|cancel/i.test(e.code||e.message||''))return}}
  copy(doc);
}

function compressImg(file,W=560,q=.6){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,W/im.width);const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);const x=c.getContext('2d');if(q===1){x.clearRect(0,0,c.width,c.height)}x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL(q===1?'image/png':'image/jpeg',q))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}

 sendReport:()=>{const now=new Date().toISOString();put('requests',{id:'r'+uid(),no:'RPT-'+uid().slice(0,4).toUpperCase(),type:'report',title:$('#rep h2').textContent,details:$('#rep').innerText.slice(0,5000),applicant:ME,fields:{},committee:RP.scope==='all'?null:RP.scope,flow:['council'],si:0,status:'open',priority:'normal',stageAt:now,createdAt:now,history:[{stage:'submitted',action:'رفع التقرير الشامل',by:ME,at:now,note:''}],votes:{},agent:{decision:'approve',engine:'rules',rationale:'تقرير دوري للاعتماد.',rationale_en:'Periodic report for adoption.',articles:['م7'],missing:[],council_note:'يعتمد المجلس التقرير ويرفعه لعمادة الكلية.'}});notify('council','council',T('تقرير شامل على جدول الأعمال','Report on council agenda'),'#council');toast(T('أُدرج على جدول الأعمال','Added to agenda'))},
 aiSummary:async()=>{if(!sample){toast(T('الذكاء الاصطناعي يعمل من الرابط المنشور','AI works from the published link'));return}const box=$('#repSum');const src=$('#rep').innerText.slice(0,4000);try{const r=await sample(`اكتب ${LANG==='ar'?'بالعربية':'in English'} ملخصاً تنفيذياً رسمياً (٨٠–١٢٠ كلمة) لهذا التقرير، ثم سطر ###، ثم ٤ توصيات مرقمة قابلة للقياس:\n${src}`,{onText:({text})=>{box.textContent=text.split('###')[0]}});const p=r.text.split('###');box.textContent=p[0].trim();if(p[1])$('#repRec').innerHTML=`<div style="white-space:pre-wrap">${esc(p[1].trim())}</div>`}catch(e){}},
 saveDir:()=>{document.querySelectorAll('.ph-in').forEach(()=>{});const by={};document.querySelectorAll('.ph-in').forEach(e=>{if(e.disabled)return;(by[e.dataset.k]=by[e.dataset.k]||{})[e.dataset.f]=e.value.trim()});Object.entries(by).forEach(([k,v])=>{const cur=S.accounts.find(a=>a.id===k)||{id:k};if((cur.phone||'')!==v.phone||(cur.email||'')!==v.email)put('accounts',{...cur,...v})});toast(T('تم الحفظ','Saved'))},
 saveNames:()=>{document.querySelectorAll('.nm-in').forEach(e=>{const k=e.dataset.k,cur=S.accounts.find(a=>a.id===k)||{id:k};const f=LANG==='ar'?'nameAr':'nameEn';if((cur[f]||'')!==e.value.trim())put('accounts',{...cur,[f]:e.value.trim()})});toast(T('تم الحفظ','Saved'))},
 saveLogo:async()=>{const f=$('#logoF').files?.[0];if(!f)return;try{const u=f.type==='image/svg+xml'?await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)}):await compressImg(f,400,1);put('settings',{...setting('brand'),id:'brand',logo:u});toast(T('تم حفظ الشعار','Logo saved'))}catch(e){toast(T('تعذرت قراءة الملف','Could not read file'))}},
 clearLogo:()=>put('settings',{...setting('brand'),id:'brand',logo:''}),
 purge:async()=>{if(!isHead())return;const all=COLS.filter(c=>!['accounts','settings'].includes(c)).flatMap(c=>S[c].filter(x=>x.demo).map(x=>[c,x.id]));toast(T(`حذف ${all.length} سجل…`,`Deleting ${all.length}…`));for(const[c,id]of all){await remove(c,id);await new Promise(r=>setTimeout(r,120))}toast(T('تم','Done'))},
 kit:d=>copy(KIT[d.k]())
};
function decide(id,adopt){const r=get('requests',id),v=r.votes||{},y=Object.values(v).filter(x=>x==='yes').length,n=Object.values(v).filter(x=>x==='no').length,a=Object.values(v).filter(x=>x==='abstain').length;const note=`موافق ${y} · غير موافق ${n} · ممتنع ${a}${adopt&&r.agent?.council_note?'\n'+r.agent.council_note:''}`;
  if(y>n){advance(r,'قرار المجلس: الموافقة',note);const x=get('requests',id);if(x&&x.status==='open')postMessage({from:'head',to:r.applicant,subject:T('قرار مجلس القسم — ','Council decision — ')+NO(r.no),body:`وافق مجلس القسم على طلبكم «${RT[r.type].n[0]}» (${NO(r.no)})، ويُرفع الآن إلى ${STG[x.flow[x.si]].n[0]}.`,thread:r.msgThread,reqId:r.id})}
  else{const x=clone(r);x.history.push({stage:'council',action:'قرار المجلس: عدم الموافقة',by:ME,at:new Date().toISOString(),note});x.status='rejected';put('requests',x);postMessage({from:'head',to:r.applicant,subject:T('قرار مجلس القسم — ','Council decision — ')+NO(r.no),body:`قرر مجلس القسم عدم الموافقة على طلبكم (${NO(r.no)}).${r.agent?'\nالمسوغ: '+r.agent.rationale:''}`,thread:r.msgThread,reqId:r.id})}
  {const z=get('requests',id);if(z&&z.status!=='approved')autoLetters(id)}notify('council','council',`${T('صدر قرار المجلس','Council decided')}: ${r.title}`,'#council');closeModal()}
function autoLetters(id){const r=get('requests',id);if(!r)return;const rt=RT[r.type];const basis=(r.agent?.articles||rt.arts||[]).join('، ');
  if(r.status==='open'&&STG[r.flow[r.si]]&&!['committee','head','council'].includes(r.flow[r.si])){const st=r.flow[r.si];makeLetter({to:['dean','college'].includes(st)?'dean':null,toName:STG[st].n[0],subject:`الرفع بطلب «${rt.n[0]}» رقم ${r.no}`,body:`نحيط سعادتكم علماً بأن مجلس قسم اللغة الإنجليزية قرر في جلسته الموافقة على طلب «${rt.n[0]}» المقدم من ${accName(r.applicant)} برقم (${r.no})، وذلك استناداً إلى ${basis||'الأنظمة واللوائح المعتمدة'}.\n${r.agent?.council_note&&r.agent.council_note!=='—'?'نص القرار: '+r.agent.council_note+'\n':''}نأمل الاطلاع والتوجيه باعتماده واستكمال الإجراءات.`,reqId:r.id})}
  if(r.status==='approved'||r.status==='rejected'){makeLetter({kind:'decision',to:r.applicant,toName:accName(r.applicant),subject:`قرار بشأن طلب «${rt.n[0]}» رقم ${r.no}`,body:r.status==='approved'?`نفيدكم بالموافقة على طلبكم «${rt.n[0]}» رقم (${r.no})${basis?' وفق '+basis:''}، ويُعمل بموجبه اعتباراً من تاريخه.`:`نفيدكم بعدم الموافقة على طلبكم «${rt.n[0]}» رقم (${r.no}).\n${r.agent?'المسوّغ: '+r.agent.rationale:''}`,reqId:r.id})}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b){if(!e.target.closest('#panel')&&!e.target.closest('[data-act=bell]'))$('#panel').classList.remove('on');return}const a=b.dataset.act;if(!ACT[a])return;if(b.tagName==='INPUT'){ACT[a](b.dataset,b,e);return}if(b.tagName==='A'&&!b.getAttribute('target')&&!['closePanel'].includes(a))e.preventDefault();if(a==='closePanel'){ACT[a]();return}ACT[a](b.dataset,b,e)});
document.addEventListener('mousemove',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');const tip=document.getElementById('tip');if(!t){tip.style.display='none';return}tip.textContent=t.getAttribute('data-tip');tip.style.display='block';const x=Math.min(e.clientX+14,innerWidth-tip.offsetWidth-8);tip.style.left=x+'px';tip.style.top=(e.clientY+14)+'px'});
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});
document.getElementById('dcss').textContent=DCSS+LCSS;seenInit();boot();
</script>
